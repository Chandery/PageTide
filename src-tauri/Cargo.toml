[package]
name = "paper-dig-helper"
version = "0.1.0"
description = "Local-first PaperDigHelper desktop shell"
authors = ["PaperDigHelper"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
# Native "Save as" dialog and the fatal-startup message box on Windows (macOS uses NSSavePanel).
# default-features off: to our knowledge rfd's default features are `common-controls-v6` (themed message boxes via an
# application manifest we do not ship; without it the dialogs still work, in the classic style) and `xdg-portal`
# (Linux only, irrelevant here).
rfd = { version = "0.15", default-features = false }
# Second launch focuses the running window. Resolved by cargo to the newest 2.x that accepts tauri 2.11.x;
# the exact version is fixed by Cargo.lock once someone with network access runs cargo.
tauri-plugin-single-instance = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
