[package]
name = "pagetide"
version = "0.1.5"
description = "Local-first PageTide desktop shell"
authors = ["PageTide"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSOpenPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
# Native "Save as" dialog and the fatal-startup message box on Windows (macOS uses NSSavePanel).
# default-features off: to our knowledge rfd's default features are `common-controls-v6` (themed message boxes via an
# application manifest we do not ship; without it the dialogs still work, in the classic style) and `xdg-portal`
# (Linux only, irrelevant here).
rfd = { version = "0.15", default-features = false }
# Second launch focuses the running window. Held at 2.4.x: 2.5+ requires tauri ^2.12 and the app is on tauri 2.11
# (crates.io dependency data, checked 2026-10-23); Cargo.lock has 2.4.5.
tauri-plugin-single-instance = "~2.4.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
