<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>设置 - PaperDigHelper</title>
  <script src="/theme.js"></script>
  <script src="/save-file.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--base);
      color: var(--text);
      font-size: calc(14px * var(--s));
      line-height: 1.6;
      min-height: 100vh;
      padding: calc(40px * var(--s)) calc(20px * var(--s)) calc(80px * var(--s));
    }
    /* — layout — */
    .container { max-width: calc(680px * var(--s)); margin: 0 auto; }
    .back-link {
      display: inline-flex; align-items: center; gap: calc(6px * var(--s));
      color: var(--muted); text-decoration: none; font-size: calc(13px * var(--s));
      margin-bottom: calc(28px * var(--s)); transition: color .16s ease;
    }
    .back-link:hover { color: var(--text); }
    h1 { font-family: var(--display); font-size: calc(26px * var(--s)); font-weight: 600; margin-bottom: calc(28px * var(--s)); }
    /* — section cards — */
    .section {
      background: var(--surface-1); border: 1px solid var(--line);
      border-radius: var(--r-lg); padding: calc(22px * var(--s)) calc(24px * var(--s)); margin-bottom: calc(16px * var(--s));
      box-shadow: var(--sh-1);
    }
    .section h2 {
      font-size: calc(13px * var(--s)); font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: calc(18px * var(--s)); padding-bottom: calc(12px * var(--s)); border-bottom: 1px solid var(--line);
    }
    /* — fields — */
    .field { margin-bottom: calc(16px * var(--s)); }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block; font-size: calc(13px * var(--s)); font-weight: 500;
      color: var(--text); margin-bottom: calc(6px * var(--s));
    }
    .field label.inline {
      display: flex; align-items: center; gap: calc(10px * var(--s));
      font-weight: 400; cursor: pointer; user-select: none;
    }
    .field small { display: block; margin-top: calc(5px * var(--s)); font-size: calc(12px * var(--s)); color: var(--muted); }
    .readonly-note { font-size: calc(13px * var(--s)); color: var(--text, inherit); padding: calc(8px * var(--s)) calc(10px * var(--s)); border: 1px solid var(--line, rgba(0,0,0,.12)); border-radius: 8px; }
    /* — inputs — */
    .field input[type="text"],
    .field input[type="password"],
    .field input[type="number"],
    .field select {
      width: 100%; padding: calc(8px * var(--s)) calc(11px * var(--s)); font-size: calc(13px * var(--s));
      border: 1px solid var(--line); border-radius: var(--r-sm);
      background: var(--base); color: var(--text); outline: none;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .field input[readonly] { color: var(--muted); cursor: default; }
    /* checkbox */
    .field input[type="checkbox"] {
      width: 16px; height: 16px; flex: 0 0 16px;
      accent-color: var(--accent); cursor: pointer;
    }
    /* — buttons — */
    button {
      padding: calc(8px * var(--s)) calc(18px * var(--s)); font-size: calc(13px * var(--s)); font-weight: 500;
      border: 1px solid var(--line); border-radius: var(--r-sm);
      cursor: pointer; background: var(--surface-1); color: var(--text);
      transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    button:hover { background: var(--surface-2); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.primary {
      background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    }
    button.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--surface-1)); }
    button.danger {
      background: var(--surface-1); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent);
    }
    button.danger:hover { background: color-mix(in srgb, var(--bad) 8%, transparent); }
    button.ghost { border-color: transparent; background: transparent; }
    button.ghost:hover { background: var(--surface-2); }
    /* — data sources: one row each (switch, key, one status word, test, clear, get) — */
    .source-row .source-key { display: flex; flex-wrap: wrap; align-items: center; gap: calc(8px * var(--s)); margin: calc(8px * var(--s)) 0 0 calc(26px * var(--s)); }
    .source-row .source-key input[type="password"] { flex: 1 1 calc(180px * var(--s)); width: auto; min-width: 0; }
    .source-row .source-key .source-state { margin-top: 0; min-width: 5em; font-size: calc(12px * var(--s)); color: var(--muted); }
    .source-row .source-key button { padding: calc(5px * var(--s)) calc(10px * var(--s)); }
    .source-row .source-key a { font-size: calc(12px * var(--s)); color: var(--muted); }
    .source-row .source-key a:hover { color: var(--text); }
    .source-row .source-name { font-size: calc(13px * var(--s)); font-weight: 500; color: var(--text); }
    .source-row .source-option { display: flex; flex-wrap: wrap; align-items: center; gap: calc(8px * var(--s)); margin: calc(8px * var(--s)) 0 0 calc(26px * var(--s)); }
    .source-row .source-option label.inline { margin-bottom: 0; }
    .source-row .source-option .source-state { margin-top: 0; min-width: 5em; font-size: calc(12px * var(--s)); color: var(--muted); }
    .source-row .source-option button { padding: calc(5px * var(--s)) calc(10px * var(--s)); }
    /* — actions bar — */
    .actions {
      display: flex; gap: calc(10px * var(--s)); justify-content: flex-end;
      margin-top: calc(28px * var(--s)); padding-top: calc(20px * var(--s)); border-top: 1px solid var(--line);
    }
    /* motion */
    @media (prefers-reduced-motion: no-preference) {
      .section { animation: fadeUp .22s ease both; }
      .section:nth-child(2) { animation-delay: .04s; }
      .section:nth-child(3) { animation-delay: .08s; }
      .section:nth-child(4) { animation-delay: .12s; }
      .section:nth-child(5) { animation-delay: .16s; }
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @media (max-width:600px) {
      body { padding: calc(24px * var(--s)) calc(16px * var(--s)) calc(60px * var(--s)); }
      .section { padding: calc(18px * var(--s)) calc(16px * var(--s)); }
      h1 { font-size: calc(20px * var(--s)); }
      .actions { flex-direction: column-reverse; }
      .actions button { width: 100%; justify-content: center; }
    }
  </style>
<script src="/dialogs.js"></script><link rel="stylesheet" href="/dialogs.css"></head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 返回主页</a>
    <h1>设置</h1>

    <div class="section">
      <h2>通用</h2>
      <div class="field">
        <label for="language">语言 / Language</label>
        <select id="language">
          <option value="zh-CN" data-no-i18n>中文</option>
          <option value="en-US">English</option>
        </select>
      </div>
      <div class="field">
        <label for="theme">主题</label>
        <select id="theme">
          <option value="light">浅色</option>
          <option value="dark">深色</option>
          <option value="auto">跟随系统</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h2>API 配置</h2>
      <div class="field">
        <label for="apiProvider">提供商</label>
        <select id="apiProvider">
          <option value="deepseek">DeepSeek</option>
        </select>
      </div>
      <div class="field">
        <label for="apiKey">API 密钥</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" aria-describedby="apiKeyStatus aiTestStatus">
        <small id="apiKeyStatus"></small>
        <button type="button" id="testAiBtn" title="调用 1 次 AI，只发送固定测试消息">测试 AI</button>
        <div id="aiTestStatus" data-pdh-status role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
      <div class="field">
        <label class="inline">
          <input type="checkbox" id="aiEnabled" checked>
          启用 AI
        </label>
      </div>
      <div class="field">
        <label>AI 用量记录</label>
        <div id="budgetLimits" class="readonly-note">读取中…</div>
      </div>
    </div>

    <div class="section">
      <h2>推荐设置</h2>
      <div class="field">
        <label for="recommendCount">每日推荐数量</label>
        <input type="number" id="recommendCount" value="5" min="1" max="20">
      </div>
      <div class="field">
        <label for="decayWindow">反馈的有效期（天）</label>
        <input type="number" id="decayWindow" value="30" min="7" max="365">
      </div>
      <div class="field">
        <label for="newPaperBoost">偏向新论文</label>
        <input type="number" id="newPaperBoost" value="0.5" min="0" max="1" step="0.1">
      </div>
    </div>

    <div class="section">
      <h2>实验功能</h2>
      <div class="field">
        <label class="inline">
          <input type="checkbox" id="routeBeta">
          打开学习图模式（beta）
        </label>
      </div>
    </div>

    <div class="section">
      <h2>数据源</h2>
      <div class="field">
        <label class="inline">
          <input type="checkbox" id="sourceArxiv" checked>
          arXiv
        </label>
      </div>
      <div class="field source-row">
        <label class="inline">
          <input type="checkbox" id="sourceOpenAlex" checked>
          期刊与会议论文
        </label>
        <div class="source-key">
          <input type="password" id="openalexKey" placeholder="密钥（可选）" aria-label="期刊与会议论文密钥" autocomplete="off">
          <span id="openalexKeyStatus" class="source-state" data-pdh-status role="status" aria-live="polite" aria-atomic="true"></span>
          <button type="button" id="testOpenalexBtn" class="ghost">测试</button>
          <button type="button" id="clearOpenalexKeyBtn" class="ghost" hidden>清除</button>
          <a id="openalexKeyLink" href="#" target="_blank" rel="noopener noreferrer" hidden>获取</a>
        </div>
      </div>
      <div class="field source-row">
        <div class="source-name">百度学术</div>
        <div class="source-key">
          <input type="password" id="baiduScholarKey" placeholder="密钥" aria-label="百度学术密钥" autocomplete="off">
          <span id="baiduScholarKeyStatus" class="source-state" data-pdh-status role="status" aria-live="polite" aria-atomic="true"></span>
          <button type="button" id="testBaiduScholarBtn" class="ghost">测试</button>
          <button type="button" id="clearBaiduScholarKeyBtn" class="ghost" hidden>清除</button>
          <a id="baiduScholarKeyLink" href="#" target="_blank" rel="noopener noreferrer" hidden>获取</a>
        </div>
        <div class="source-option">
          <label class="inline">
            <input type="checkbox" id="sourceBaiduScholar">
            百度学术接口
          </label>
        </div>
        <div class="source-option">
          <label class="inline">
            <input type="checkbox" id="sourceBaiduWeb">
            百度搜索
          </label>
          <span id="baiduWebStatus" class="source-state" data-pdh-status role="status" aria-live="polite" aria-atomic="true"></span>
          <button type="button" id="testBaiduWebBtn" class="ghost">测试</button>
        </div>
      </div>
      <div class="field">
        <label for="updateFrequency">更新频率</label>
        <select id="updateFrequency">
          <option value="daily">每天</option>
          <option value="weekly">每周</option>
          <option value="manual">手动</option>
        </select>
      </div>
      <div class="field">
        <label for="timePreference">时间偏好</label>
        <select id="timePreference">
          <option value="recent">最近 1 周</option>
          <option value="month">最近 30 天</option>
          <option value="all">所有时间</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h2>存储与导出</h2>
      <div class="field">
        <label for="dataDir">数据目录</label>
        <input type="text" id="dataDir" value="读取中…" readonly>
      </div>
      <div class="field">
        <button id="exportBtn" class="ghost" style="padding-left:0">导出数据</button>
        <div id="exportStatus" data-pdh-status role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
      <div class="field">
        <button id="clearCacheBtn" class="danger">清除已下载的论文信息</button>
      </div>
    </div>

    <div id="settingsStatus" data-pdh-status role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="actions">
      <button id="cancelBtn" class="ghost">取消</button>
      <button id="saveBtn" class="primary">保存设置</button>
    </div>
  </div>

  <script>
    const $ = sel => document.querySelector(sel);

    // Same storage key as the main page ('pdh-mode'); no stored value means follow the system.
    const systemDark = () => matchMedia('(prefers-color-scheme:dark)').matches;
    const storedMode = localStorage.getItem('pdh-mode');
    document.documentElement.dataset.mode = storedMode || (systemDark() ? 'dark' : 'light');

    let settings = {};
    let aiTestBusy = false;
    let aiTestEpoch = 0;

    // Data sources that take a key: one row each. A test result is shown as one short word and is ignored when the key
    // changes or the page reloads meanwhile (the same protection as the AI test). Only the word table below is ever shown,
    // never text from the server, so a provider message or a key cannot reach the page.
    const SOURCE_ROWS = {
      openalex: {key:'#openalexKey', status:'#openalexKeyStatus', test:'#testOpenalexBtn', clear:'#clearOpenalexKeyBtn', link:'#openalexKeyLink'},
      baidu_scholar: {key:'#baiduScholarKey', status:'#baiduScholarKeyStatus', test:'#testBaiduScholarBtn', clear:'#clearBaiduScholarKeyBtn', link:'#baiduScholarKeyLink'},
      // Baidu search restricted to xueshu.baidu.com uses the same Qianfan key: the key line of the Baidu block is its field, so it has no key, clear or link of its own.
      baidu_web: {key:'#baiduScholarKey', status:'#baiduWebStatus', test:'#testBaiduWebBtn', shared:true},
    };
    const SOURCE_WORDS = {ok:'可用', auth_required:'密钥无效', quota_exhausted:'今日额度已用完', network_error:'无法连接',
      unavailable:'服务暂不可用', bad_response:'返回无法识别', invalid_input:'请求无效', not_found:'没有结果'};
    const sourceTest = {openalex:{busy:false, epoch:0}, baidu_scholar:{busy:false, epoch:0}, baidu_web:{busy:false, epoch:0}};
    let sourceInfo = {};
    let baiduConfirmed = false;

    function sourceBaseWord(info) {
      if (!info) return '';
      if (info.needs_key && !info.configured) return '需要密钥';
      if (info.configured && info.status_kind === 'auth_required') return '密钥无效';
      if (info.status_kind === 'quota_exhausted' || (info.daily_cap && Number(info.used_today) >= Number(info.daily_cap))) return '今日额度已用完';
      return info.configured ? '已配置' : '未配置';
    }

    function renderSourceRow(id) {
      if (sourceTest[id].busy && sourceTest[id].shownBusy) return;     // a running test keeps its own word
      const target = $(SOURCE_ROWS[id].status);
      target.textContent = sourceBaseWord(sourceInfo[id]);
      target.dataset.kind = '';
    }

    function invalidateSourceTests() {
      for (const id of Object.keys(SOURCE_ROWS)) {
        sourceTest[id].epoch++;
        sourceTest[id].shownBusy = false;
        renderSourceRow(id);
      }
    }

    function renderSources(sources) {
      sourceInfo = sources || {};
      for (const id of Object.keys(SOURCE_ROWS)) {
        const row = SOURCE_ROWS[id], info = sourceInfo[id];
        if (!info) continue;
        renderSourceRow(id);
        if (row.link) {
          $(row.link).href = info.key_url || '#';
          $(row.link).hidden = !info.key_url;
        }
        if (row.clear) $(row.clear).hidden = !info.configured;
      }
    }

    function safeSourceText(value, typedKey, fieldKey) {
      let text = String(value || '请求失败');
      for (const key of new Set([typedKey, fieldKey])) {
        if (key) text = text.split(key).join('[密钥已隐藏]');
      }
      return text;
    }

    async function testSource(id) {
      const row = SOURCE_ROWS[id], state = sourceTest[id];
      if (state.busy) return;
      state.busy = true;
      const button = $(row.test), target = $(row.status), field = $(row.key);
      const key = field.value.trim(), epoch = ++state.epoch;
      const current = () => epoch === state.epoch && field.value.trim() === key;
      const show = (word, kind) => window.PDHDialogs.notice(safeSourceText(word, key, field.value.trim()), {target, kind});
      button.disabled = true;
      state.shownBusy = true;
      show('测试中…');
      try {
        const res = await fetch('/api/source-test', {method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify(key ? {id, api_key:key} : {id})});
        const data = await res.json();
        if (!current()) return;
        const kind = res.ok && typeof data.kind === 'string' && Object.prototype.hasOwnProperty.call(SOURCE_WORDS, data.kind) ? data.kind : null;
        if (kind === 'ok' && data.ok === true) show(SOURCE_WORDS.ok, 'success');
        else show(kind && kind !== 'ok' ? SOURCE_WORDS[kind] : '请求失败', 'error');
      } catch (error) {
        if (current()) show('无法连接', 'error');
      } finally {
        state.busy = false;
        state.shownBusy = false;
        button.disabled = false;
        if (!current()) renderSourceRow(id);        // an ignored result leaves the base word, not the waiting word
      }
    }

    function invalidateAiTest(message) {
      aiTestEpoch++;
      if (message && (aiTestBusy || $('#aiTestStatus').textContent)) {
        window.PDHDialogs.notice(message, {target:$('#aiTestStatus')});
      }
    }

    function safeAiTestText(value, testedKey) {
      let text = String(value || '请求失败');
      for (const key of new Set([testedKey, $('#apiKey').value.trim()])) {
        if (key) text = text.split(key).join('[密钥已隐藏]');
      }
      return text.replace(/sk-[A-Za-z0-9_-]{8,}/g, '[密钥已隐藏]');
    }

    async function testAiConnection() {
      if (aiTestBusy) return;
      aiTestBusy = true;
      const button = $('#testAiBtn'), target = $('#aiTestStatus');
      const key = $('#apiKey').value.trim(), epoch = ++aiTestEpoch, started = Date.now();
      button.disabled = true;
      const current = () => epoch === aiTestEpoch && $('#apiKey').value.trim() === key;
      const waiting = () => {
        if (current()) window.PDHDialogs.notice('正在测试 AI…', {target});
      };
      waiting();
      const timer = setInterval(waiting, 1000);
      try {
        const res = await fetch('/api/ai-test', {method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify(key ? {api_key:key} : {})});
        const data = await res.json();
        clearInterval(timer);
        if (!current()) return;
        if (!res.ok || data.ok !== true) {
          window.PDHDialogs.notice(`AI 测试失败：${safeAiTestText(data.reason || data.error, key)}`, {target,kind:'error'});
        } else {
          const counts = data.usage || {};
          const total = Number.isInteger(counts.total_tokens) ? counts.total_tokens
            : Number.isInteger(counts.prompt_tokens) && Number.isInteger(counts.completion_tokens) ? counts.prompt_tokens + counts.completion_tokens : null;
          // one short cost word: an unknown amount is never shown as a number
          window.PDHDialogs.notice(`AI 测试成功 · ${data.usage_reserved || data.usage_unknown || total == null ? '用量未确认' : `本次 ${total} token`}`, {target,kind:'success'});
        }
        // Refresh accounting alone: a connection test must not overwrite unsaved settings.
        try {
          const usageRes = await fetch('/api/settings');
          if (usageRes.ok) renderUsage(await usageRes.json());
        } catch { /* The connection result remains valid if the usage display cannot refresh. */ }
      } catch (error) {
        if (current()) window.PDHDialogs.notice(`AI 测试失败：${safeAiTestText(error.message, key)}`, {target,kind:'error'});
      } finally {
        clearInterval(timer);
        aiTestBusy = false;
        button.disabled = false;
      }
    }

    async function loadSettings() {
      invalidateAiTest('请重新测试');
      invalidateSourceTests();
      try {
        const res = await fetch('/api/user_settings');
        const data = await res.json();
        settings = data.settings || {};
      } catch { settings = {}; }

      $('#language').value       = settings.language       || 'zh-CN';
      $('#theme').value          = settings.theme || 'auto';
      window.PDHTheme.apply($('#theme').value);
      $('#apiProvider').value    = settings.apiProvider    || 'deepseek';
      $('#apiKey').value         = '';
      $('#openalexKey').value    = '';
      $('#baiduScholarKey').value = '';
      $('#recommendCount').value = settings.recommendCount ?? 5;
      $('#decayWindow').value    = settings.decayWindow    ?? 30;
      $('#newPaperBoost').value  = settings.newPaperBoost  ?? 0.5;
      $('#routeBeta').checked    = settings.routeBeta === true;
      $('#sourceArxiv').checked  = settings.sourceArxiv   !== false;
      $('#sourceOpenAlex').checked = settings.sourceOpenAlex !== false;
      $('#sourceBaiduScholar').checked = settings.sourceBaiduScholar === true;      // off until the user switches it on
      $('#sourceBaiduWeb').checked = settings.sourceBaiduWeb === true;
      baiduConfirmed = settings.baiduScholarConfirmed === true;
      $('#updateFrequency').value = settings.updateFrequency || 'daily';
      $('#timePreference').value  = settings.timePreference  || 'all';

      try { const res=await fetch('/api/data-location'); if(!res.ok)throw new Error(); const data=await res.json(); $('#dataDir').value=data.data_dir; } catch { $('#dataDir').value='无法读取'; }
      await loadGateway();
    }

    function renderUsage(data) {
      const u = data.usage || {};
      // Confirmed use only: an unconfirmed call is held at its maximum (a whole answer's room), which is not spending.
      const less = (total, held) => Math.max(0, Number(total ?? 0) - Number(held ?? 0));
      const usd = (total, held) => String(Number(less(total, held).toFixed(6)));
      const unconfirmed = Math.max(Number(u.pending_reservations) || 0, Number(u.month_pending_reservations) || 0);
      $('#budgetLimits').textContent = [   // one phrase per part: the language layer translates a " · " list part by part
        `今日 ${less(u.tokens, u.reserved_tokens)} token`, `本月 ${less(u.month_tokens, u.month_reserved_tokens)} token`,
        `今日消耗 $${usd(u.usd, u.reserved_usd)}`, `本月消耗 $${usd(u.month_usd, u.month_reserved_usd)}`,
        unconfirmed > 0 ? `另有 ${unconfirmed} 次用量未确认`
          : u.tokens_known === false || u.month_tokens_known === false || u.usage_unknown || u.usage_reserved
            || Number(u.pending_requests) > 0 || Number(u.unknown_requests) > 0 ? '另有用量未确认' : '',
      ].filter(Boolean).join(' · ');
    }

    function renderGateway(data) {
      $('#aiEnabled').checked = data.ai_enabled !== false;
      renderUsage(data);
      const sources = {...(data.sources || {})};
      if (!sources.openalex && data.openalex) sources.openalex = {needs_key:false, configured:!!data.openalex.configured};
      renderSources(sources);
      const p = data.provider || {};
      $('#apiKeyStatus').textContent = p.configured
        ? '已配置'
        : '未配置密钥';
    }

    async function loadGateway() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) throw new Error();
        renderGateway(await res.json());
      } catch { $('#budgetLimits').textContent = '无法读取用量'; }
    }

    async function postGateway(body) {
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '保存失败');
      renderGateway(data);
    }

    async function saveSettings() {
      const btn = $('#saveBtn');
      if(btn.disabled)return;
      btn.disabled = true;
      btn.textContent = '保存中…';
      const newSettings = {
        language:       $('#language').value,
        theme:          $('#theme').value,
        apiProvider:    $('#apiProvider').value,
        recommendCount: Number($('#recommendCount').value),
        decayWindow:    Number($('#decayWindow').value),
        newPaperBoost:  Number($('#newPaperBoost').value),
        routeBeta:      $('#routeBeta').checked,
        sourceArxiv:    $('#sourceArxiv').checked,
        sourceOpenAlex: $('#sourceOpenAlex').checked,
        sourceBaiduScholar: $('#sourceBaiduScholar').checked && baiduConfirmed,
        sourceBaiduWeb: $('#sourceBaiduWeb').checked && baiduConfirmed,
        baiduScholarConfirmed: baiduConfirmed,
        updateFrequency: $('#updateFrequency').value,
        timePreference:  $('#timePreference').value,
      };
      try {
        await postGateway({ai_enabled: $('#aiEnabled').checked});
        const key = $('#apiKey').value.trim();
        if (key) await postGateway({api_key: key});
        for (const id of Object.keys(SOURCE_ROWS)) {
          if (SOURCE_ROWS[id].shared) continue;          // its key is saved once, through the row that owns the field
          const value = $(SOURCE_ROWS[id].key).value.trim();
          if (value) await postGateway({source_key: {id, value}});
        }
        const saved = await fetch('/api/user_settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({settings: newSettings})
        });
        if (!saved.ok) throw new Error((await saved.json()).error || '保存失败');
        if (newSettings.theme === 'auto') localStorage.removeItem('pdh-mode');
        else localStorage.setItem('pdh-mode', newSettings.theme);
        window.location.href = '/';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '保存设置';
        window.PDHDialogs.notice(e && e.message && e.message !== '保存失败' ? e.message : '保存失败', {target:$('#settingsStatus'),kind:'error'});
      }
    }

    for (const id of Object.keys(SOURCE_ROWS)) {
      const row = SOURCE_ROWS[id];
      $(row.test).onclick = () => testSource(id);
      $(row.key).oninput = () => {          // every row that uses this field is invalidated by an edit of it
        for (const other of Object.keys(SOURCE_ROWS)) {
          if (SOURCE_ROWS[other].key !== row.key) continue;
          sourceTest[other].epoch++; sourceTest[other].shownBusy = false; renderSourceRow(other);
        }
      };
      if (!row.clear) continue;
      $(row.clear).onclick = async () => {
        const button = $(row.clear);
        if (button.disabled) return;
        button.disabled = true;
        try { await postGateway({clear_source_key: id}); $(row.key).value = ''; }
        catch (e) { window.PDHDialogs.notice(e.message || '清除失败', {target:$('#settingsStatus'),kind:'error'}); }
        finally { button.disabled = false; }
      };
    }

    // Chinese keywords go to Baidu with the user's own key: one question, the first time the switch is turned on.
    $('#sourceBaiduScholar').onchange = async () => {
      const box = $('#sourceBaiduScholar');
      if (!box.checked || baiduConfirmed) return;
      if (await window.PDHDialogs.confirm('开启后，含中文的关键词会发给百度学术（使用你自己的密钥）。继续吗？')) baiduConfirmed = true;
      else box.checked = false;
    };

    // The same question for Baidu AI Search on xueshu.baidu.com: the same keywords go to Baidu with the same key, so one answer
    // (baiduConfirmed) serves both Baidu rows.
    $('#sourceBaiduWeb').onchange = async () => {
      const box = $('#sourceBaiduWeb');
      if (!box.checked || baiduConfirmed) return;
      if (await window.PDHDialogs.confirm('开启后，含中文的关键词会通过百度搜索发给百度学术（使用你自己的密钥）。继续吗？')) baiduConfirmed = true;
      else box.checked = false;
    };

    $('#saveBtn').onclick  = saveSettings;
    $('#cancelBtn').onclick = () => window.location.href = '/';
    $('#testAiBtn').onclick = testAiConnection;
    $('#apiKey').oninput = () => invalidateAiTest('请重新测试');

    $('#exportBtn').onclick = async () => {
      const button=$('#exportBtn'), target=$('#exportStatus');
      if(button.disabled)return;
      button.disabled=true;
      window.PDHDialogs.notice('导出中…',{target});
      try {
        const res=await fetch('/api/export');const data=await res.json();
        if(!res.ok)throw new Error(data.error||'导出失败');
        const filename=`paperdighelper-export-${new Date().toISOString().slice(0,10)}.json`;
        const result=await window.PDHSaveFile(filename,JSON.stringify(data,null,2));
        if(result?.status==='cancelled')window.PDHDialogs.notice('已取消',{target});
        else if(result?.status==='saved')window.PDHDialogs.notice(`导出已保存：${result.path||filename}`,{target,kind:'success'});
        else throw new Error('未收到有效的保存回执');
      } catch(e) {window.PDHDialogs.notice(`导出失败：${e.message}`,{target,kind:'error'});}
      finally {button.disabled=false;}
    };

    $('#clearCacheBtn').onclick = async () => {
      const button=$('#clearCacheBtn'), target=$('#settingsStatus');
      if(button.disabled)return;
      button.disabled=true;
      try {
        if(!await window.PDHDialogs.confirm('清除已下载的论文信息？归档的 PDF 和笔记会保留。'))return;
        const res=await fetch('/api/cache',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({_method:'DELETE'})});
        const data=await res.json();if(!res.ok)throw new Error(data.error||'清理失败');
        const names={'source-response-cache':'已下载的论文信息','pdf-archives':'归档 PDF','fulltext':'全文','notes':'笔记','projects':'项目'};
        window.PDHDialogs.notice(`已清除：${(data.removed||[]).map(x=>window.PDHi18n?.t(names[x]||x)||names[x]||x).join('、')||'无'}`,{target,kind:'success'});
      } catch(e) {window.PDHDialogs.notice(`清理失败：${e.message}`,{target,kind:'error'});}
      finally {button.disabled=false;}
    };

    loadSettings();
  </script>
</body>
</html>
