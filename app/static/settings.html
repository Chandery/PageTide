<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>设置 - PageTide</title>
  <script src="/theme.js"></script>
  <script src="/save-file.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--base);
      color: var(--text);
      font-size: calc(var(--fs-md) * var(--s));
      line-height: 1.55;
      min-height: 100vh;
      padding: calc(40px * var(--s)) calc(24px * var(--s)) 0;
    }
    /* — layout: a titled group of rows; each row is a name on the left and its control on the right — */
    .container { max-width: calc(720px * var(--s)); margin: 0 auto; }
    .back-link {
      display: inline-flex; align-items: center; gap: calc(6px * var(--s));
      color: var(--muted); text-decoration: none; font-size: calc(var(--fs-sm) * var(--s));
      margin-bottom: calc(20px * var(--s)); transition: color .16s ease;
    }
    .back-link:hover { color: var(--text); }
    h1 { font-family: var(--display); font-size: calc(var(--fs-2xl) * var(--s)); font-weight: 700; margin-bottom: calc(32px * var(--s)); }
    .section { margin-bottom: calc(32px * var(--s)); }
    .section h2 {
      font-size: calc(var(--fs-sm) * var(--s)); font-weight: 600; color: var(--muted);
      margin: 0 0 calc(10px * var(--s)) calc(4px * var(--s));
    }
    .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); }
    .field {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: calc(24px * var(--s));
      padding: calc(14px * var(--s)) calc(20px * var(--s)); min-height: calc(56px * var(--s));
    }
    .field + .field { border-top: 1px solid var(--line); }
    .field > label, .field-head > label { font-size: calc(var(--fs-md) * var(--s)); font-weight: 500; color: var(--text); }
    .field .control { display: flex; align-items: center; justify-content: flex-end; gap: calc(10px * var(--s)); min-width: 0; }
    /* a row whose control needs the whole width (a key, a path, a usage line) puts it under the name */
    .field.stack { grid-template-columns: minmax(0, 1fr); row-gap: calc(10px * var(--s)); }
    .field.stack .control { justify-content: flex-start; }
    .field.stack .field-head { display: flex; align-items: baseline; justify-content: space-between; gap: calc(12px * var(--s)); }
    .field .key-meta { display: inline-flex; align-items: baseline; gap: calc(12px * var(--s)); font-size: calc(var(--fs-sm) * var(--s)); color: var(--muted); }
    .field .key-meta small { font-size: inherit; }
    .field a { color: var(--accent-text); text-decoration: none; font-size: calc(var(--fs-sm) * var(--s)); }
    .field a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .readonly-note { font-size: calc(var(--fs-sm) * var(--s)); color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.7; }
    /* — inputs — */
    .field input[type="text"],
    .field input[type="password"],
    .field input[type="number"],
    .field select {
      height: calc(36px * var(--s)); padding: 0 calc(12px * var(--s)); font: inherit; font-size: calc(var(--fs-sm) * var(--s));
      border: 1px solid var(--line-strong); border-radius: var(--r-sm);
      background: var(--surface-1); color: var(--text); outline: none;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .field select { width: calc(200px * var(--s)); cursor: pointer; }
    .field input[type="number"] { width: calc(96px * var(--s)); text-align: right; font-variant-numeric: tabular-nums; }
    .field input[type="text"], .field input[type="password"] { flex: 1 1 auto; min-width: 0; width: 100%; }
    .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field input[readonly] { color: var(--muted); background: var(--surface-2); border-color: transparent; cursor: default; }
    /* on/off: a switch at the right end of its row */
    .field input.switch {
      appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 999px; margin: 0; position: relative;
      background: var(--line-strong); cursor: pointer; transition: background .18s ease; flex: 0 0 auto;
    }
    .field input.switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: var(--sh-1); transition: transform .18s ease;
    }
    .field input.switch:checked { background: var(--accent); }
    .field input.switch:checked::after { transform: translateX(16px); }
    .field input.switch:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
    /* — buttons: every one has an edge; only Save is filled — */
    button {
      height: calc(36px * var(--s)); padding: 0 calc(16px * var(--s)); font: inherit; font-size: calc(var(--fs-sm) * var(--s)); font-weight: 500;
      border: 1px solid var(--line-strong); border-radius: var(--r-sm); white-space: nowrap;
      cursor: pointer; background: var(--surface-1); color: var(--text);
      transition: background .16s ease, border-color .16s ease;
    }
    button:hover { background: var(--surface-2); }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
    button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line-strong)); }
    button.danger:hover { background: color-mix(in srgb, var(--bad) 8%, var(--surface-1)); }
    /* — results: a word next to the button that asked for it; success is green with a tick, failure red with a cross (dialogs.css) — */
    [data-pt-status] { margin-top: 0; font-size: calc(var(--fs-sm) * var(--s)); color: var(--muted); }
    [data-pt-status]:empty { display: none; }
    .field.stack > [data-pt-status] { margin-top: calc(-2px * var(--s)); }
    /* — data sources: the switch row, then the key line under it — */
    .source-row .source-key { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: calc(10px * var(--s)); margin-top: calc(12px * var(--s)); }
    .source-row .source-key input[type="password"] { flex: 1 1 calc(220px * var(--s)); width: auto; }
    .source-row .source-key .source-state { min-width: 4.5em; }
    .field.actions-row .control { justify-content: flex-start; flex-wrap: wrap; }
    .previous-dir { display: flex; align-items: center; gap: calc(12px * var(--s)); font-size: calc(var(--fs-sm) * var(--s)); color: var(--muted); }
    .previous-dir[hidden] { display: none; }
    .previous-dir span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    /* — save bar: stays at the bottom of the window while the page scrolls — */
    .actions {
      position: sticky; bottom: 0; display: flex; align-items: center; gap: calc(10px * var(--s)); justify-content: flex-end;
      margin: calc(8px * var(--s)) calc(-24px * var(--s)) 0; padding: calc(16px * var(--s)) calc(24px * var(--s));
      background: var(--base); border-top: 1px solid var(--line);
    }
    .actions #settingsStatus { margin-right: auto; }
    @media (max-width:600px) {
      body { padding: calc(24px * var(--s)) calc(16px * var(--s)) 0; }
      .field { grid-template-columns: minmax(0, 1fr); row-gap: calc(10px * var(--s)); }
      .field .control { justify-content: flex-start; }
      h1 { font-size: calc(var(--fs-xl) * var(--s)); }
    }
  </style>
<script src="/dialogs.js"></script><link rel="stylesheet" href="/dialogs.css"></head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 返回主页</a>
    <h1>设置</h1>

    <section class="section">
      <h2>通用</h2>
      <div class="card">
        <div class="field">
          <label for="language">语言 / Language</label>
          <div class="control">
            <select id="language">
              <option value="zh-CN" data-no-i18n>中文</option>
              <option value="en-US">English</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="theme">主题</label>
          <div class="control">
            <select id="theme">
              <option value="light">浅色</option>
              <option value="dark">深色</option>
              <option value="auto">跟随系统</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="replayTourBtn">新手指引</label>
          <div class="control"><button type="button" id="replayTourBtn">重新查看</button></div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>API 配置</h2>
      <div class="card">
        <div class="field">
          <label for="aiEnabled">启用 AI</label>
          <div class="control"><input type="checkbox" id="aiEnabled" class="switch" checked></div>
        </div>
        <div class="field">
          <label for="apiProvider">提供商</label>
          <div class="control">
            <select id="apiProvider">
              <option value="deepseek">DeepSeek</option>
            </select>
          </div>
        </div>
        <div class="field stack">
          <div class="field-head">
            <label for="apiKey">API 密钥</label>
            <span class="key-meta">
              <small id="apiKeyStatus"></small>
              <a id="apiKeyLink" href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener noreferrer">获取</a>
            </span>
          </div>
          <div class="control">
            <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" aria-describedby="apiKeyStatus aiTestStatus">
            <button type="button" id="testAiBtn" title="调用 1 次 AI，只发送固定测试消息">测试 AI</button>
          </div>
          <div id="aiTestStatus" data-pt-status role="status" aria-live="polite" aria-atomic="true"></div>
        </div>
        <div class="field stack">
          <label>AI 用量记录</label>
          <div id="budgetLimits" class="readonly-note">读取中…</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>推荐设置</h2>
      <div class="card">
        <div class="field">
          <label for="recommendCount">每日推荐数量</label>
          <div class="control"><input type="number" id="recommendCount" value="5" min="1" max="20"></div>
        </div>
        <div class="field">
          <label for="decayWindow">反馈的有效期（天）</label>
          <div class="control"><input type="number" id="decayWindow" value="30" min="7" max="365"></div>
        </div>
        <div class="field">
          <label for="newPaperBoost">偏向新论文</label>
          <div class="control"><input type="number" id="newPaperBoost" value="0.5" min="0" max="1" step="0.1"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>数据源</h2>
      <div class="card">
        <div class="field">
          <label for="sourceArxiv">arXiv</label>
          <div class="control"><input type="checkbox" id="sourceArxiv" class="switch" checked></div>
        </div>
        <div class="field source-row">
          <label for="sourceOpenAlex">期刊与会议论文</label>
          <div class="control"><input type="checkbox" id="sourceOpenAlex" class="switch" checked></div>
          <div class="source-key">
            <input type="password" id="openalexKey" placeholder="密钥" aria-label="期刊与会议论文密钥" autocomplete="off">
            <span id="openalexKeyStatus" class="source-state" data-pt-status role="status" aria-live="polite" aria-atomic="true"></span>
            <button type="button" id="testOpenalexBtn">测试</button>
            <button type="button" id="clearOpenalexKeyBtn" hidden>清除</button>
            <a id="openalexKeyLink" href="#" target="_blank" rel="noopener noreferrer" hidden>获取</a>
          </div>
        </div>
        <div class="field">
          <label for="sourceCnki">知网</label>
          <div class="control"><input type="checkbox" id="sourceCnki" class="switch"></div>
        </div>
        <div class="field">
          <label for="updateFrequency">更新频率</label>
          <div class="control">
            <select id="updateFrequency">
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="manual">手动</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="timePreference">时间偏好</label>
          <div class="control">
            <select id="timePreference">
              <option value="recent">最近 1 周</option>
              <option value="month">最近 30 天</option>
              <option value="all">所有时间</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>更新</h2>
      <div class="card">
        <div class="field">
          <label for="autoCheckUpdates">自动检查更新</label>
          <div class="control"><input type="checkbox" id="autoCheckUpdates" class="switch" checked></div>
        </div>
        <div class="field actions-row">
          <div class="control">
            <button type="button" id="checkUpdateBtn">检查更新</button>
            <span id="updateStatus" class="source-state" data-pt-status role="status" aria-live="polite" aria-atomic="true"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>实验功能</h2>
      <div class="card">
        <div class="field">
          <label for="routeBeta">打开学习图模式（beta）</label>
          <div class="control"><input type="checkbox" id="routeBeta" class="switch"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>存储与导出</h2>
      <div class="card">
        <div class="field stack">
          <label for="dataDir">数据目录</label>
          <div class="control"><input type="text" id="dataDir" value="读取中…" readonly><button type="button" id="moveDataBtn" hidden>更改…</button></div>
          <div id="dataDirStatus" data-pt-status role="status" aria-live="polite" aria-atomic="true"></div>
          <div class="previous-dir" id="previousDir" hidden><span id="previousDirText"></span><button type="button" id="removePreviousBtn" class="danger">删除</button></div>
        </div>
        <div class="field stack actions-row">
          <div class="control">
            <button id="exportBtn">导出数据</button>
            <button id="clearCacheBtn" class="danger">清除已下载的论文信息</button>
          </div>
          <div id="exportStatus" data-pt-status role="status" aria-live="polite" aria-atomic="true"></div>
        </div>
      </div>
    </section>

    <div class="actions">
      <div id="settingsStatus" data-pt-status role="status" aria-live="polite" aria-atomic="true"></div>
      <button id="cancelBtn">取消</button>
      <button id="saveBtn" class="primary">保存设置</button>
    </div>
  </div>

  <script>
    const $ = sel => document.querySelector(sel);

    // Same storage key as the main page ('pt-mode'); no stored value means follow the system.
    const systemDark = () => matchMedia('(prefers-color-scheme:dark)').matches;
    const storedMode = localStorage.getItem('pt-mode');
    document.documentElement.dataset.mode = storedMode || (systemDark() ? 'dark' : 'light');

    let settings = {};
    let aiTestBusy = false;
    let aiTestEpoch = 0;

    // Data sources that take a key: one row each. A test result is shown as one short word and is ignored when the key
    // changes or the page reloads meanwhile (the same protection as the AI test). Only the word table below is ever shown,
    // never text from the server, so a provider message or a key cannot reach the page.
    const SOURCE_ROWS = {
      openalex: {key:'#openalexKey', status:'#openalexKeyStatus', test:'#testOpenalexBtn', clear:'#clearOpenalexKeyBtn', link:'#openalexKeyLink'},
    };
    const sourceOf = (id) => SOURCE_ROWS[id].source || id;       // the source whose state a row shows and whose test its button runs
    const SOURCE_WORDS = {ok:'可用', auth_required:'密钥无效', quota_exhausted:'今日额度已用完', network_error:'无法连接',
      unavailable:'服务暂不可用', bad_response:'返回无法识别', invalid_input:'请求无效', not_found:'没有结果'};
    const sourceTest = {openalex:{busy:false, epoch:0}};
    let sourceInfo = {};
    let cnkiConfirmed = false;

    function sourceBaseWord(info) {
      if (!info) return '';
      if (info.needs_key && !info.configured) return '需要密钥';
      if (info.configured && info.status_kind === 'auth_required') return '密钥无效';
      if (info.status_kind === 'quota_exhausted' || (info.daily_cap && Number(info.used_today) >= Number(info.daily_cap))) return '今日额度已用完';
      return info.configured ? '已配置' : '未配置';
    }

    function renderSourceRow(id) {
      if (sourceTest[id].busy && sourceTest[id].shownBusy) return;     // a running test keeps its own word
      const target = $(SOURCE_ROWS[id].status);
      target.textContent = sourceBaseWord(sourceInfo[sourceOf(id)]);
      target.dataset.kind = '';
    }

    function invalidateSourceTests() {
      for (const id of Object.keys(SOURCE_ROWS)) {
        sourceTest[id].epoch++;
        sourceTest[id].shownBusy = false;
        renderSourceRow(id);
      }
    }

    function renderSources(sources) {
      sourceInfo = sources || {};
      for (const id of Object.keys(SOURCE_ROWS)) {
        const row = SOURCE_ROWS[id], info = sourceInfo[sourceOf(id)];
        if (!info) continue;
        renderSourceRow(id);
        if (row.link) {
          $(row.link).href = info.key_url || '#';
          $(row.link).hidden = !info.key_url;
        }
        if (row.clear) $(row.clear).hidden = !info.configured;
      }
    }

    function safeSourceText(value, typedKey, fieldKey) {
      let text = String(value || '请求失败');
      for (const key of new Set([typedKey, fieldKey])) {
        if (key) text = text.split(key).join('[密钥已隐藏]');
      }
      return text;
    }

    async function testSource(id) {
      const row = SOURCE_ROWS[id], state = sourceTest[id];
      if (state.busy) return;
      state.busy = true;
      const button = $(row.test), target = $(row.status), field = $(row.key);
      const key = field.value.trim(), epoch = ++state.epoch;
      const current = () => epoch === state.epoch && field.value.trim() === key;
      const show = (word, kind) => window.PTDialogs.notice(safeSourceText(word, key, field.value.trim()), {target, kind});
      button.disabled = true;
      state.shownBusy = true;
      show('测试中…');
      try {
        const res = await fetch('/api/source-test', {method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify(key ? {id: sourceOf(id), api_key:key} : {id: sourceOf(id)})});
        const data = await res.json();
        if (!current()) return;
        const kind = res.ok && typeof data.kind === 'string' && Object.prototype.hasOwnProperty.call(SOURCE_WORDS, data.kind) ? data.kind : null;
        if (kind === 'ok' && data.ok === true) show(SOURCE_WORDS.ok, 'success');
        else show(kind && kind !== 'ok' ? SOURCE_WORDS[kind] : '请求失败', 'error');
      } catch (error) {
        if (current()) show('无法连接', 'error');
      } finally {
        state.busy = false;
        state.shownBusy = false;
        button.disabled = false;
        if (!current()) renderSourceRow(id);        // an ignored result leaves the base word, not the waiting word
      }
    }

    function invalidateAiTest(message) {
      aiTestEpoch++;
      if (message && (aiTestBusy || $('#aiTestStatus').textContent)) {
        window.PTDialogs.notice(message, {target:$('#aiTestStatus')});
      }
    }

    function safeAiTestText(value, testedKey) {
      let text = String(value || '请求失败');
      for (const key of new Set([testedKey, $('#apiKey').value.trim()])) {
        if (key) text = text.split(key).join('[密钥已隐藏]');
      }
      return text.replace(/sk-[A-Za-z0-9_-]{8,}/g, '[密钥已隐藏]');
    }

    async function testAiConnection() {
      if (aiTestBusy) return;
      aiTestBusy = true;
      const button = $('#testAiBtn'), target = $('#aiTestStatus');
      const key = $('#apiKey').value.trim(), epoch = ++aiTestEpoch, started = Date.now();
      button.disabled = true;
      const current = () => epoch === aiTestEpoch && $('#apiKey').value.trim() === key;
      const waiting = () => {
        if (current()) window.PTDialogs.notice('正在测试 AI…', {target});
      };
      waiting();
      const timer = setInterval(waiting, 1000);
      try {
        const res = await fetch('/api/ai-test', {method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify(key ? {api_key:key} : {})});
        const data = await res.json();
        clearInterval(timer);
        if (!current()) return;
        if (!res.ok || data.ok !== true) {
          window.PTDialogs.notice(`AI 测试失败：${safeAiTestText(data.reason || data.error, key)}`, {target,kind:'error'});
        } else {
          const counts = data.usage || {};
          const total = Number.isInteger(counts.total_tokens) ? counts.total_tokens
            : Number.isInteger(counts.prompt_tokens) && Number.isInteger(counts.completion_tokens) ? counts.prompt_tokens + counts.completion_tokens : null;
          // one short cost word: an unknown amount is never shown as a number
          window.PTDialogs.notice(`AI 测试成功 · ${data.usage_reserved || data.usage_unknown || total == null ? '用量未确认' : `本次 ${total} token`}`, {target,kind:'success'});
        }
        // Refresh accounting alone: a connection test must not overwrite unsaved settings.
        try {
          const usageRes = await fetch('/api/settings');
          if (usageRes.ok) renderUsage(await usageRes.json());
        } catch { /* The connection result remains valid if the usage display cannot refresh. */ }
      } catch (error) {
        if (current()) window.PTDialogs.notice(`AI 测试失败：${safeAiTestText(error.message, key)}`, {target,kind:'error'});
      } finally {
        clearInterval(timer);
        aiTestBusy = false;
        button.disabled = false;
      }
    }

    async function loadSettings() {
      invalidateAiTest('请重新测试');
      invalidateSourceTests();
      try {
        const res = await fetch('/api/user_settings');
        const data = await res.json();
        settings = data.settings || {};
      } catch { settings = {}; }

      $('#language').value       = settings.language       || 'zh-CN';
      $('#theme').value          = settings.theme || 'auto';
      window.PTTheme.apply($('#theme').value);
      $('#apiProvider').value    = settings.apiProvider    || 'deepseek';
      $('#apiKey').value         = '';
      $('#openalexKey').value    = '';
      $('#recommendCount').value = settings.recommendCount ?? 5;
      $('#decayWindow').value    = settings.decayWindow    ?? 30;
      $('#newPaperBoost').value  = settings.newPaperBoost  ?? 0.5;
      $('#routeBeta').checked    = settings.routeBeta === true;
      $('#autoCheckUpdates').checked = settings.autoCheckUpdates !== false;
      $('#sourceArxiv').checked  = settings.sourceArxiv   !== false;
      $('#sourceOpenAlex').checked = settings.sourceOpenAlex !== false;
      $('#sourceCnki').checked = settings.sourceCnki === true;
      cnkiConfirmed = settings.cnkiConfirmed === true;
      // 知网 is searched only in the desktop app's own CNKI window (ADR 0045): from a source run there is none.
      $('#sourceCnki').disabled = !window.__TAURI_INTERNALS__ && !$('#sourceCnki').checked;
      $('#sourceCnki').title = window.__TAURI_INTERNALS__ ? '' : '只在桌面应用里可用';
      $('#updateFrequency').value = settings.updateFrequency || 'daily';
      $('#timePreference').value  = settings.timePreference  || 'all';

      await loadLocation();
      await loadGateway();
      savedState = formState();
    }

    // Unsaved changes (owner, 2026-10-26: "设置里修改了但未保存就出去了的情况很多"): a snapshot of every field once loaded;
    // leaving with a different one asks first. A key typed but not saved counts as a change (only whether one is typed is
    // compared, never the key itself).
    let savedState = null;
    function formState() {
      const fields = document.querySelectorAll ? document.querySelectorAll('.container input, .container select, .container textarea') : [];
      return JSON.stringify([...(fields || [])]
        .filter((el) => el.id && el.type !== 'file' && !el.readOnly)       // read-only ones (the data folder) change on their own
        .map((el) => [el.id, el.type === 'checkbox' ? el.checked : el.type === 'password' ? !!el.value.trim() : el.value]));
    }
    const unsaved = () => savedState !== null && formState() !== savedState;
    async function leave(href) {
      if (unsaved() && !(await window.PTDialogs.confirm('设置有修改还没保存，离开会丢掉这些修改。仍然离开吗？'))) return;
      savedState = null;
      window.location.href = href;
    }
    window.onbeforeunload = (event) => { if (unsaved()) { event.preventDefault(); event.returnValue = ''; } };

    function renderUsage(data) {
      const u = data.usage || {};
      // Confirmed use only: an unconfirmed call is held at its maximum (a whole answer's room), which is not spending.
      const less = (total, held) => Math.max(0, Number(total ?? 0) - Number(held ?? 0));
      const usd = (total, held) => String(Number(less(total, held).toFixed(6)));
      const unconfirmed = Math.max(Number(u.pending_reservations) || 0, Number(u.month_pending_reservations) || 0);
      $('#budgetLimits').textContent = [   // one phrase per part: the language layer translates a " · " list part by part
        `今日 ${less(u.tokens, u.reserved_tokens)} token`, `本月 ${less(u.month_tokens, u.month_reserved_tokens)} token`,
        `今日消耗 $${usd(u.usd, u.reserved_usd)}`, `本月消耗 $${usd(u.month_usd, u.month_reserved_usd)}`,
        unconfirmed > 0 ? `另有 ${unconfirmed} 次用量未确认`
          : u.tokens_known === false || u.month_tokens_known === false || u.usage_unknown || u.usage_reserved
            || Number(u.pending_requests) > 0 || Number(u.unknown_requests) > 0 ? '另有用量未确认' : '',
      ].filter(Boolean).join(' · ');
    }

    function renderGateway(data) {
      $('#aiEnabled').checked = data.ai_enabled !== false;
      renderUsage(data);
      const sources = {...(data.sources || {})};
      if (!sources.openalex && data.openalex) sources.openalex = {needs_key:false, configured:!!data.openalex.configured};
      renderSources(sources);
      const p = data.provider || {};
      $('#apiKeyStatus').textContent = p.configured
        ? '已配置'
        : '未配置密钥';
    }

    async function loadGateway() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) throw new Error();
        renderGateway(await res.json());
      } catch { $('#budgetLimits').textContent = '无法读取用量'; }
    }

    async function postGateway(body) {
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '保存失败');
      renderGateway(data);
    }

    async function saveSettings() {
      const btn = $('#saveBtn');
      if(btn.disabled)return;
      btn.disabled = true;
      btn.textContent = '保存中…';
      const newSettings = {
        language:       $('#language').value,
        theme:          $('#theme').value,
        apiProvider:    $('#apiProvider').value,
        recommendCount: Number($('#recommendCount').value),
        decayWindow:    Number($('#decayWindow').value),
        newPaperBoost:  Number($('#newPaperBoost').value),
        routeBeta:      $('#routeBeta').checked,
        autoCheckUpdates: $('#autoCheckUpdates').checked,
        sourceArxiv:    $('#sourceArxiv').checked,
        sourceOpenAlex: $('#sourceOpenAlex').checked,
        sourceCnki:     $('#sourceCnki').checked && cnkiConfirmed,
        cnkiConfirmed:  cnkiConfirmed,
        updateFrequency: $('#updateFrequency').value,
        timePreference:  $('#timePreference').value,
      };
      try {
        await postGateway({ai_enabled: $('#aiEnabled').checked});
        const key = $('#apiKey').value.trim();
        if (key) await postGateway({api_key: key});
        for (const id of Object.keys(SOURCE_ROWS)) {
          const value = $(SOURCE_ROWS[id].key).value.trim();
          if (value) await postGateway({source_key: {id, value}});
        }
        const saved = await fetch('/api/user_settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({settings: newSettings})
        });
        if (!saved.ok) throw new Error((await saved.json()).error || '保存失败');
        // 知网 switched off: a run still going in the app's CNKI window stops now (ADR 0045).
        if (!newSettings.sourceCnki && window.__TAURI_INTERNALS__) {
          try { await window.__TAURI_INTERNALS__.invoke('cnki_cancel'); } catch (e) { /* nothing running */ }
        }
        if (newSettings.theme === 'auto') localStorage.removeItem('pt-mode');
        else localStorage.setItem('pt-mode', newSettings.theme);
        savedState = null;                         // saved: leaving needs no question
        window.location.href = '/';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '保存设置';
        window.PTDialogs.notice(e && e.message && e.message !== '保存失败' ? e.message : '保存失败', {target:$('#settingsStatus'),kind:'error'});
      }
    }

    for (const id of Object.keys(SOURCE_ROWS)) {
      const row = SOURCE_ROWS[id];
      $(row.test).onclick = () => testSource(id);
      $(row.key).oninput = () => {          // every row that uses this field is invalidated by an edit of it
        for (const other of Object.keys(SOURCE_ROWS)) {
          if (SOURCE_ROWS[other].key !== row.key) continue;
          sourceTest[other].epoch++; sourceTest[other].shownBusy = false; renderSourceRow(other);
        }
      };
      if (!row.clear) continue;
      $(row.clear).onclick = async () => {
        const button = $(row.clear);
        if (button.disabled) return;
        button.disabled = true;
        try { await postGateway({clear_source_key: id}); $(row.key).value = ''; }
        catch (e) { window.PTDialogs.notice(e.message || '清除失败', {target:$('#settingsStatus'),kind:'error'}); }
        finally { button.disabled = false; }
      };
    }

    // Chinese keywords go to CNKI from the app's own CNKI window: one question, the first time the switch is turned on.
    $('#sourceCnki').onchange = async () => {
      const box = $('#sourceCnki');
      if (!box.checked || cnkiConfirmed) return;
      if (await window.PTDialogs.confirm('开启后，含中文的关键词会在应用里的知网窗口中检索。第一次检索时知网会要求滑一次拼图。继续吗？')) cnkiConfirmed = true;
      else box.checked = false;
    };

    $('#saveBtn').onclick  = saveSettings;
    $('#cancelBtn').onclick = () => leave('/');
    const backLink = document.querySelector('.back-link');
    if (backLink) backLink.onclick = (event) => { event.preventDefault(); leave('/'); };
    $('#testAiBtn').onclick = testAiConnection;
    $('#apiKey').oninput = () => invalidateAiTest('请重新测试');

    $('#exportBtn').onclick = async () => {
      const button=$('#exportBtn'), target=$('#exportStatus');
      if(button.disabled)return;
      button.disabled=true;
      window.PTDialogs.notice('导出中…',{target});
      try {
        const res=await fetch('/api/export');const data=await res.json();
        if(!res.ok)throw new Error(data.error||'导出失败');
        const filename=`pagetide-export-${new Date().toISOString().slice(0,10)}.json`;
        const result=await window.PTSaveFile(filename,JSON.stringify(data,null,2));
        if(result?.status==='cancelled')window.PTDialogs.notice('已取消',{target});
        else if(result?.status==='saved')window.PTDialogs.notice(`导出已保存：${result.path||filename}`,{target,kind:'success'});
        else throw new Error('未收到有效的保存回执');
      } catch(e) {window.PTDialogs.notice(`导出失败：${e.message}`,{target,kind:'error'});}
      finally {button.disabled=false;}
    };

    $('#clearCacheBtn').onclick = async () => {
      const button=$('#clearCacheBtn'), target=$('#settingsStatus');
      if(button.disabled)return;
      button.disabled=true;
      try {
        if(!await window.PTDialogs.confirm('清除已下载的论文信息？归档的 PDF 和笔记会保留。'))return;
        const res=await fetch('/api/cache',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({_method:'DELETE'})});
        const data=await res.json();if(!res.ok)throw new Error(data.error||'清理失败');
        const names={'source-response-cache':'已下载的论文信息','pdf-archives':'归档 PDF','fulltext':'全文','notes':'笔记','projects':'项目'};
        window.PTDialogs.notice(`已清除：${(data.removed||[]).map(x=>window.PTi18n?.t(names[x]||x)||names[x]||x).join('、')||'无'}`,{target,kind:'success'});
      } catch(e) {window.PTDialogs.notice(`清理失败：${e.message}`,{target,kind:'error'});}
      finally {button.disabled=false;}
    };

    // "Check now" is an explicit request: it ignores the cache and the automatic-check switch.
    $('#checkUpdateBtn').onclick = async () => {
      const button=$('#checkUpdateBtn'), target=$('#updateStatus');
      if(button.disabled)return;
      button.disabled=true;
      try {
        const res=await fetch('/api/update?force=1'); const data=await res.json();
        if(data.reason_code==='dev_build')window.PTDialogs.notice('开发版不检查更新',{target,kind:'info'});
        else if(data.reason_code==='no_asset')window.PTDialogs.notice('新版本暂无适用于本机的安装包',{target,kind:'info'});
        else if(data.status!=='ok')window.PTDialogs.notice('暂时无法检查更新',{target,kind:'error'});
        else if(data.available)window.PTDialogs.notice(`有新版本 v${data.latest}，回到主页即可更新`,{target,kind:'success'});
        else window.PTDialogs.notice('已是最新版本',{target,kind:'success'});
      } catch(e) {window.PTDialogs.notice('暂时无法检查更新',{target,kind:'error'});}
      finally {button.disabled=false;}
    };

    // Replay the first-run tour: a fresh demo sandbox, then the main page shows it. The project to come back to is the current real one.
    $('#replayTourBtn').onclick = async () => {
      const button=$('#replayTourBtn');
      if(button.disabled)return;
      button.disabled=true;
      try {
        const list=await (await fetch('/api/projects')).json();
        const ids=(list.projects||[]).map(p=>p.id), saved=localStorage.getItem('pt-current-project');
        const returnProject=ids.includes(saved)?saved:(ids[0]||null);
        const res=await fetch('/api/onboarding'); const data=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);
        // The welcome card (language, appearance) comes first; the demo sandbox is built when it is confirmed.
        window.PTTour.begin({step:'w0',version:data.version,returnProject});
        window.location.href='/';
      } catch(e) {
        window.PTDialogs.notice(`打不开新手指引：${e.message}`,{target:$('#settingsStatus'),kind:'error'});
        button.disabled=false;
      }
    };

    // Data folder: choose a folder, copy the library there (the old folder stays as it was), restart into it.
    const MOVE_WORDS = {invalid:'找不到这个文件夹', not_found:'找不到这个文件夹', same:'这就是现在的数据目录',
      inside_current:'不能选当前数据目录里面的文件夹', not_writable:'这个文件夹不能写入', occupied:'这个文件夹里已有名为 PageTide 的其他内容',
      busy:'还有任务在运行，请稍后再试', no_previous:'原来的文件夹已经不在了', copy_failed:'复制没有完成，原来的论文库没有改动', moving:'正在移动中', fixed:'数据目录由环境变量指定，不能在这里更改'};
    const tauri = () => window.__TAURI_INTERNALS__;
    async function loadLocation() {
      try {
        const res=await fetch('/api/data-location'); if(!res.ok)throw new Error(); const data=await res.json();
        $('#dataDir').value=data.data_dir;
        $('#moveDataBtn').hidden=!data.movable;
        $('#previousDir').hidden=!data.previous; $('#previousDir').dataset.path=data.previous||'';
        $('#previousDirText').textContent=data.previous?`原来的文件夹还在：${data.previous}`:'';
        if(data.missing)window.PTDialogs.notice(`找不到数据目录 ${data.missing}，这次用的是原来的位置`,{target:$('#dataDirStatus'),kind:'error'});
        return data;
      } catch { $('#dataDir').value='无法读取'; return null; }
    }
    async function chooseFolder() {
      if (tauri()) return await tauri().invoke('pick_folder', {title: window.PTi18n?.t('选择新的数据目录') || '选择新的数据目录'});
      return window.prompt(window.PTi18n?.t('新的数据目录（完整路径）') || '新的数据目录（完整路径）') || null;   // a source run in a browser
    }
    async function postLocation(body) {
      const res=await fetch('/api/data-location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await res.json().catch(()=>({}));
      if(!res.ok || data.ok===false)throw new Error(MOVE_WORDS[data.reason]||'没能更改数据目录');
      return data;
    }
    // The copy the library left behind: deleted only on request, after a confirmation.
    $('#removePreviousBtn').onclick = async () => {
      const button=$('#removePreviousBtn'), target=$('#dataDirStatus');
      const old=$('#previousDir').dataset.path;
      if(button.disabled)return;
      button.disabled=true;
      try {
        if(!await window.PTDialogs.confirm(`删除 ${old} 里原来的论文库？现在用的论文库不受影响，这一步不能撤销。`))return;
        await postLocation({action:'remove-previous'});
        window.PTDialogs.notice('已删除原来的论文库',{target,kind:'success'});
        await loadLocation();
      } catch(e) { window.PTDialogs.notice(e.message||'没能删除',{target,kind:'error'}); }
      finally { button.disabled=false; }
    };
    $('#moveDataBtn').onclick = async () => {
      const button=$('#moveDataBtn'), target=$('#dataDirStatus');
      if(button.disabled)return;
      button.disabled=true;
      try {
        const chosen=await chooseFolder();
        if(!chosen)return;
        const plan=await postLocation({action:'inspect', path:chosen});
        const question = plan.kind==='library'
          ? `${plan.target} 里已经有一个 PageTide 论文库。切换后会使用它，当前的论文库不会搬过去，也不会被改动。继续吗？`
          : `把论文库复制到 ${plan.target}？复制完成后 PageTide 会重新启动。原来的文件夹会保留，确认没问题后可以自己删除。`;
        if(!await window.PTDialogs.confirm(question))return;
        await postLocation({action:'move', path:chosen});
        let move;
        for(;;) {
          await new Promise(r=>setTimeout(r,400));
          move=(await (await fetch('/api/data-location')).json()).move||{};
          if(move.state!=='running')break;
          const share=move.total?Math.floor(100*move.done/move.total):0;
          window.PTDialogs.notice(`正在复制… ${share}%`,{target});
        }
        if(move.state!=='done')throw new Error(MOVE_WORDS[move.reason]||'没能更改数据目录');
        window.PTDialogs.notice(`数据目录已改为 ${move.result.data_dir}，正在重新启动…`,{target,kind:'success'});
        if(tauri())await tauri().invoke('relaunch');
        else window.PTDialogs.notice(`数据目录已改为 ${move.result.data_dir}，重新启动 PageTide 后生效`,{target,kind:'success'});
      } catch(e) { window.PTDialogs.notice(e.message||'没能更改数据目录',{target,kind:'error'}); }
      finally { button.disabled=false; }
    };

    loadSettings();
  </script>
  <link rel="stylesheet" href="/tour.css">
  <script src="/tour.js"></script>
  <script>window.PTTour.boot('settings', {});</script>
</body>
</html>
