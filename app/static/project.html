<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/project-creation.css">
<title>项目设置 · PaperDigHelper</title>
</head>
<body>
<div class="container">
<a class="back" href="/" data-role="back">← 返回今日推荐</a>
<h1>项目设置</h1>
<div class="notice" data-role="notice" hidden></div>

<section class="settings-card" data-role="main" hidden>
  <h2>名称</h2>
  <form data-role="renameForm" class="row-form">
    <label class="hint" for="projectName">项目名称</label>
    <input id="projectName" data-role="name" maxlength="120" autocomplete="off">
    <div class="map-actions"><button type="submit" class="primary small" data-role="rename">保存名称</button></div>
  </form>

  <h2>推荐语言</h2>
  <form data-role="languageForm">
    <div data-role="paperPolicy"></div>
    <div class="map-actions"><button type="submit" class="primary small" data-role="languageSave">保存语言</button></div>
  </form>

  <h2>这个项目</h2>
  <dl class="facts" data-role="facts"></dl>
  <div class="map-actions" data-route-beta><a class="ghost-link" data-role="routeLink" href="/route.html">打开学习图</a></div>

  <h2>删除项目</h2>
  <div class="danger">
    <label class="hint" for="confirmName">输入项目名称确认删除：</label>
    <div class="confirm-name" data-role="nameEcho" data-no-i18n></div>
    <input id="confirmName" data-role="confirm" autocomplete="off" placeholder="项目名称">
    <div class="map-actions"><button type="button" class="danger-button small" data-role="delete" disabled>删除这个项目</button></div>
  </div>
</section>
</div>
<script src="/paper-policy.js"></script>
<script src="/project-page.js"></script>
</body>
</html>
