<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/project-creation.css">
<link rel="stylesheet" href="/import.css">
<title>导入论文 · PaperDigHelper</title>
<script src="/dialogs.js"></script><link rel="stylesheet" href="/dialogs.css"></head>
<body>
<div class="container">
<a class="back" id="back" href="/">← 返回主页</a>
<h1>导入已有论文库</h1>
<div class="hint" id="target" role="status"></div>
<div class="notice bad" id="error" role="alert" hidden></div>

<ol class="steps" id="steps" aria-label="导入进度">
  <li data-step="source" class="on">选择</li><li data-step="working">读取与匹配</li><li data-step="review">确认</li><li data-step="done">完成</li>
</ol>

<!-- ===================================================================== 1 选择 -->
<section class="panel active" id="stepSource" aria-label="选择要导入的论文">
  <div id="resumeBox" class="resume" hidden></div>
  <div class="resume" id="continueBox" hidden><span id="continueText"></span> <button type="button" class="small" id="continueSkip">直接匹配已有的文件</button> <button type="button" class="small ghost" id="continueBack" hidden>查看失败记录</button></div>
  <div class="picker">
    <button type="button" class="primary" id="pickFiles">选择 PDF 文件…</button>
    <button type="button" id="pickFolder">选择文件夹…</button>
    <input type="file" id="filesInput" accept="application/pdf,.pdf" multiple hidden>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
  </div>
  <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="拖入 PDF 或文件夹">
    <strong>或把 PDF、文件夹拖到这里</strong>
  </div>
  <details class="zotero">
    <summary>从 Zotero 导入</summary>
    <ol>
      <li>在 Zotero 里右键分类，选「导出分类…」</li>
      <li>选 BibTeX 或 RIS，勾选「导出文件」</li>
      <li>在这里选择导出的文件夹</li>
    </ol>
  </details>

  <div id="picked" hidden>
    <div class="summary" id="pickedSummary"></div>
    <div class="notice warn" id="pickedWarn" hidden></div>
    <ul class="skipped" id="pickedSkipped" hidden></ul>
  </div>

  <fieldset class="options" id="options">
    <legend>导入选项</legend>
    <label class="check"><input type="checkbox" id="optOnline" checked><span>联网补全元数据</span></label>
    <p class="hint opt-hint">只向 OpenAlex 发送 DOI、arXiv 编号和题目</p>
    <label class="check"><input type="checkbox" id="optFolders" checked><span>把子文件夹整理成分类</span></label>
    <label class="check"><input type="checkbox" id="optRoot"><span>所选文件夹也作为分类</span></label>
    <label class="check"><input type="checkbox" id="optReplace"><span>替换已有的 PDF</span></label>
    <label class="check" id="filelessRow" hidden><input type="checkbox" id="optFileless"><span>也导入没有 PDF 的题录</span></label>
    <p class="hint opt-hint" id="filelessHint" hidden></p>
  </fieldset>
  <div class="actions"><span class="spacer"></span><button type="button" class="primary" id="start" disabled>开始导入</button></div>
</section>

<!-- ===================================================================== 2 读取与匹配 -->
<section class="panel" id="stepWorking" aria-label="读取与匹配">
  <div class="stage" id="stageUpload">
    <div class="stage-head"><strong>读取 PDF</strong><span class="stage-count" id="uploadCount"></span></div>
    <div class="bar"><i id="uploadBar"></i></div>
    <div class="hint" id="sidecarNote"></div>
    <div class="hint" id="uploadNow" data-no-i18n></div>
    <ul class="skipped" id="uploadFailed" hidden></ul>
  </div>
  <div class="stage" id="stageResolve" hidden>
    <div class="stage-head"><strong>匹配论文信息</strong><span class="stage-count" id="resolveCount"></span></div>
    <div class="bar"><i id="resolveBar"></i></div>
    <div class="counts" id="resolveCounts"></div>
    <div class="hint" id="quota"></div>
    <div class="notice warn" id="paused" hidden></div>
  </div>
  <div class="actions"><button type="button" class="ghost" id="stop">暂停</button><span class="spacer"></span><button type="button" class="primary" id="resume" hidden>继续</button><button type="button" id="toReview" hidden>先看已有结果</button><button type="button" id="settle" hidden>剩下的按原样导入</button></div>
</section>

<!-- ===================================================================== 3 确认 -->
<section class="panel" id="stepReview" aria-label="确认导入">
  <div class="notice warn" id="reviewWarnings" hidden></div>
  <div class="notice warn" id="emptyImport" role="status" hidden>
    <strong id="emptyImportTitle"></strong>
    <p id="emptyImportText"></p>
    <p class="hint" id="emptyImportOptions"></p>
    <button type="button" id="emptyReselect">重新选择文件</button>
  </div>
  <div class="notice warn" id="failedBox" hidden>
    <div id="failedText"></div>
    <ul class="skipped" id="failedList"></ul>
    <button type="button" class="small" id="addMore">补传这些文件</button>
  </div>
  <div class="summary" id="reviewSummary"></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="分组"></div>
  <ul class="rows" id="rows"></ul>
  <div class="actions"><button type="button" class="ghost" id="more" hidden>显示更多</button></div>
  <details class="cats" id="cats" open>
    <summary id="catsSummary">分类预览</summary>
    <div id="catsBody"></div>
  </details>
  <div class="commitbar">
    <button type="button" class="ghost" id="discard">放弃这次导入</button>
    <span class="spacer"></span>
    <span class="hint" id="commitNote"></span>
    <button type="button" class="primary" id="commit" disabled>导入到论文库</button>
  </div>
</section>

<!-- ===================================================================== 4 完成 -->
<section class="panel" id="stepDone" aria-label="导入完成">
  <h2 class="done-title">导入完成</h2>
  <div class="summary" id="doneSummary"></div>
  <div class="card" id="catsDone" hidden></div>
  <div class="card" id="seedsCard" hidden>
    <h3>设为种子（可选）</h3>
    <ul class="seedlist" id="seedList"></ul>
    <div class="actions"><span class="hint" id="seedCount"></span><span class="spacer"></span><button type="button" id="seedGo" disabled>设为种子</button></div>
  </div>
  <div class="card" id="aiCard" hidden></div>
  <div class="actions"><a class="linkbutton" id="again" href="#">再导入一批</a><span class="spacer"></span><a class="linkbutton primary" id="toLibrary" href="/">去论文库</a></div>
</section>
</div>

<script src="/creation-pdf.js"></script>
<script src="/pdf-hints.js"></script>
<script src="/import-files.js"></script>
<script src="/import.js"></script>
</body>
</html>
