<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<script src="/theme.js"></script><script src="/math.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/project-creation.css">
<link rel="stylesheet" href="/tour.css">
<title>创建项目 · PageTide</title>
<script src="/dialogs.js"></script><link rel="stylesheet" href="/dialogs.css"></head>
<body>
<div class="container">
<a class="back" href="/">← 返回主页</a>
<h1>创建研究项目</h1>
<p class="lead" data-route-beta>选一种方式开始。</p><p class="lead" data-route-beta-off>选一种方式开始。</p>
<div id="creationPaperPolicy"></div>
<div id="creationQuitStatus" data-pt-status role="status" aria-live="polite" aria-atomic="true"></div>

<div class="modes" role="radiogroup" aria-label="创建方式">
  <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="quick">
    <span class="mode-title">快速创建</span><span class="badge ai">AI · 1 次调用</span>
    <span class="mode-desc" data-route-beta>一句话说清目标，生成关键词、检索式和学习图。</span><span class="mode-desc" data-route-beta-off>一句话说清目标，生成关键词和检索式。</span>
  </button>
  <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="ai_guided">
    <span class="mode-title">AI 引导</span><span class="badge ai">AI · 对话</span>
    <span class="mode-desc" data-route-beta>和助手对话，逐步完善关键词、检索式和学习图。</span><span class="mode-desc" data-route-beta-off>和助手对话，逐步完善关键词和检索式。</span>
  </button>
  <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="manual">
    <span class="mode-title">手动创建</span><span class="badge">不用 AI</span>
    <span class="mode-desc">自己填关键词和种子论文。</span>
  </button>
</div>

<label class="import-after"><input type="checkbox" id="importAfter"><span>创建后导入我已有的论文库</span></label>

<!-- ===================================================================== 快速创建 -->
<section id="quickForm" class="panel" aria-label="快速创建">
  <div id="quickStart">
    <div class="grid">
      <div class="field"><label for="quickName">项目名称</label><input id="quickName" maxlength="120" placeholder="例如：图神经网络"></div>
      <div class="field"><label for="quickGoal">研究目标</label><textarea id="quickGoal" rows="3" placeholder="你想理解或解决什么问题？"></textarea></div>
    </div>
    <div class="actions"><button type="button" class="ghost" data-act="cancel">取消</button><button type="button" class="primary" id="quickGo" title="调用 1 次 AI">整理方向并查找论文</button></div>
  </div>
  <div id="quickWork" hidden>
    <div class="activity" id="quickActivity" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span class="act-text"></span><span class="act-time"></span></div>
    <div class="ai-note" id="quickNote" hidden></div>
    <div id="quickReview"></div>
  </div>
</section>

<!-- ===================================================================== AI 引导 -->
<section id="guidedForm" class="panel" aria-label="AI 引导">
  <div id="guidedStart">
    <div class="grid">
      <div class="field"><label for="guidedName">项目名称</label><input id="guidedName" maxlength="120" placeholder="例如：图神经网络入门"></div>
      <div class="field"><label for="guidedGoal">研究目标</label><textarea id="guidedGoal" rows="3" placeholder="你想理解的主题"></textarea></div>
    </div>
    <div class="actions"><button type="button" class="ghost" data-act="cancel">取消</button><button type="button" class="primary" id="guidedGo">开始引导</button></div>
  </div>
  <div id="guidedWork" class="split" hidden>
    <div class="chat-col">
      <div class="col-head"><strong>对话</strong></div>
      <div id="guideChat" class="chat" aria-live="polite"></div>
      <div id="guideQuestion" class="guide-question" aria-live="polite" hidden></div>
      <div class="activity" id="guidedActivity" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span class="act-text"></span><span class="act-time"></span></div>
      <div class="composer">
        <textarea id="guideMessage" rows="2" placeholder="回答助手（⌘/Ctrl + 回车发送）"></textarea>
        <button type="button" class="primary" id="guideSend">发送</button>
      </div>
    </div>
    <div class="draft-col" id="guidedReview"></div>
  </div>
</section>

<!-- ===================================================================== 手动创建 -->
<section id="manualForm" class="panel" aria-label="手动创建">
  <div class="grid">
    <div class="field"><label for="manualName">项目名称</label><input id="manualName" maxlength="120" placeholder="例如：计算机视觉研究"></div>
    <div class="field"><label for="manualKeywordsInput">关键词</label><div class="chip-input" id="manualKeywords"><span class="chips"></span><input id="manualKeywordsInput" placeholder="回车添加，例如：world models"></div></div>
  </div>

  <div class="field">
    <label for="manualQueries">检索式 <span class="opt">（不用 AI）</span></label>
    <textarea id="manualQueries" rows="2" placeholder="每行一条，例如：语法教学 国际中文教育"></textarea>
    <div class="query-actions">
      <button type="button" id="manualSearch">按检索式查找论文</button>
      <span class="hint">找到的论文点“添加”就成为种子论文，推荐会从它们学起。</span>
    </div>
  </div>

  <div class="field">
    <label for="seedInput">种子论文 <span class="opt">（可选）</span></label>
    <div class="seed-add">
      <input id="seedInput" placeholder="DOI / arXiv 编号 / 链接，或论文名称" autocomplete="off">
      <button type="button" class="primary" id="seedAdd" title="只发送标识符或标题到 OpenAlex">添加</button>
    </div>
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="拖入或选择 PDF">
      <input type="file" id="pdfPick" accept="application/pdf,.pdf" multiple hidden>
      <strong>把论文 PDF 拖到这里</strong><span>或点击选择文件</span>
    </div>
    <p class="hint" id="seedNote" role="status" hidden></p>
    <div class="seed-search" id="seedSearch" hidden>
      <div class="seed-search-head"><strong id="seedSearchTitle"></strong><button type="button" class="ghost small" id="seedSearchClose">关闭</button></div>
      <div class="activity" id="seedSearchActivity" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span class="act-text"></span><span class="act-time"></span></div>
      <div class="notice" id="seedSearchNotice" hidden></div>
      <div id="seedSearchList"></div>
    </div>
    <ul class="seeds" id="seedList" aria-live="polite"></ul>
  </div>

  <div class="create-bar">
    <span id="manualSummary" class="summary"></span>
    <button type="button" class="ghost" data-act="cancel">取消</button>
    <button type="button" class="primary" id="manualCreate">创建项目</button>
  </div>
  <div class="activity" id="manualActivity" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span class="act-text"></span><span class="act-time"></span></div>
  <div id="manualResult" class="result" hidden></div>
</section>
</div>

<!-- 候选论文、关键词、检索式、学习路径的审阅区：快速创建和 AI 引导共用 -->
<template id="reviewTpl">
<div class="review">
  <section class="rv-block">
    <header><h3>关键词</h3></header>
    <div class="chip-input" data-role="keywords"><span class="chips"></span><input placeholder="输入后回车添加"></div>
    <p class="hint" data-role="keywordHint" hidden>添加至少一个关键词后才能创建。</p>
  </section>
  <section class="rv-block">
    <header><h3>检索式</h3></header>
    <textarea data-role="queries" rows="3" placeholder="例如：graph neural network node classification"></textarea>
  </section>
  <section class="rv-block" data-role="mapBlock" data-route-beta>
    <header><h3>学习图</h3>
      <button type="button" class="ghost small" data-role="mapGenerate" title="调用 1 次 AI，只发送五项需求">AI 细化学习图（1 次 AI）</button><button type="button" class="ghost small" data-role="mapRegen" hidden>重新生成</button><button type="button" class="ghost small" data-role="mapStart">自己搭一张</button></header>
    <div class="activity" data-role="mapActivity" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span class="act-text"></span><span class="act-time"></span></div>
    <div data-role="mapBrief"></div>
    <div class="notice" data-role="mapNotice" hidden></div>
    <div class="map-note" data-role="mapNote" hidden></div>
    <div class="map-shape" data-role="mapShape" hidden></div>
    <div class="map-layout stack" data-role="mapLayout" hidden>
      <div data-role="map"></div>
      <aside class="map-detail" data-role="mapDetail" aria-live="polite"></aside>
    </div>
    <div class="map-actions" data-role="mapActions" hidden>
      <button type="button" class="ghost small" data-role="mapAdd">+ 添加概念</button>
      <button type="button" class="ghost small" data-role="mapCheck">用公开文献核对</button>
      <button type="button" class="ghost small" data-role="mapDrop">不使用学习图</button>
    </div>
    <label class="map-confirm" data-role="mapConfirmWrap" hidden><input type="checkbox" data-role="mapConfirm"><span>确认使用这张学习图</span></label>
  </section>
  <section class="rv-block" data-role="pathBlock" data-route-beta>
    <header><h3>学习路径</h3><button type="button" class="ghost small" data-role="addPath">+ 添加阶段</button></header>
    <div data-role="path"></div>
  </section>
  <section class="rv-block">
    <header><h3>候选论文</h3></header>
    <div class="cand-toolbar">
      <button type="button" data-role="search">按检索式查找论文</button>
      <span class="status" data-role="searchStatus"></span>
      <label class="years"><input type="checkbox" data-role="allYears"> 不限年份</label>
      <span class="spacer"></span>
      <button type="button" class="ghost small" data-role="selectAll">全选</button>
      <button type="button" class="ghost small" data-role="selectNone">清空</button>
    </div>
    <div class="activity" data-role="searchActivity" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span class="act-text"></span><span class="act-time"></span></div>
    <div class="notice" data-role="searchNotice" hidden></div>
    <div class="cands" data-role="cands"></div>
  </section>
  <div class="create-bar">
    <span class="summary" data-role="summary"></span>
    <button type="button" class="ghost" data-act="cancel">取消草稿</button>
    <button type="button" class="primary" data-role="create">确认并创建项目</button>
  </div>
  <div class="activity" data-role="createActivity" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span class="act-text"></span><span class="act-time"></span></div>
</div>
</template>

<script src="/creation-pdf.js"></script>
<script src="/pdf-hints.js"></script>
<script src="/route-editor.js"></script>
<script src="/route-brief.js"></script>
<script src="/route-graph.js"></script>
<script src="/paper-policy.js"></script>
<dialog id="creationQuitDialog" class="pt-confirm" aria-labelledby="creationQuitTitle" aria-describedby="creationQuitText">
<h2 id="creationQuitTitle">离开创建页？</h2>
<p id="creationQuitText">还没有创建项目，未提交的内容会丢失。</p>
<div id="creationQuitError" data-pt-status role="alert" aria-live="assertive" aria-atomic="true"></div>
<div class="pt-confirm-actions creation-quit-actions"><button type="button" id="creationQuitCancel">取消退出</button><button type="button" id="creationQuitReview">返回审阅</button><button type="button" id="creationQuitDiscard">放弃未提交修改并退出</button></div>
</dialog>
<script src="/creation-quit.js"></script>
<script src="/cnki.js"></script>
<script src="/project-creation.js"></script>
<script src="/tour.js"></script>
<script>
// No project yet: "back" would only bounce here again, so offer the demo instead.
(async()=>{
  try {
    const list=await (await fetch('/api/projects')).json();
    if((list.projects||[]).length){PTTour.dismiss('c1');return;}   // a project exists now: the "create your first project" hint is moot
    const link=document.querySelector('a.back');
    link.textContent='看看演示';
    link.addEventListener('click',async e=>{
      e.preventDefault();
      try {
        const res=await fetch('/api/onboarding');
        const data=await res.json();
        if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);
        PTTour.begin({step:'w0',version:data.version,returnProject:null});   // the welcome card builds the sandbox
        window.location.href='/';
      } catch(err) { window.PTDialogs.notice(`打不开演示：${err.message}`,{target:document.getElementById('creationQuitStatus'),kind:'error'}); }
    });
    PTTour.boot('creation',{});
  } catch(e) { PTTour.boot('creation',{}); /* keep the plain back link */ }
})();
</script>
</body>
</html>
