<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/project-creation.css">
<title>学习图 · PaperDigHelper</title>
</head>
<body>
<div class="container">
<a class="back" href="/" data-role="back">← 返回今日推荐</a>
<h1>学习图</h1>
<p class="lead" data-role="project"></p>
<div class="notice" data-role="notice" hidden></div>

<div class="ai-draft" data-role="aiBox" hidden>
  <b data-role="briefTitle">学习需求</b>
  <div data-role="briefFields"></div>
  <div class="map-note" data-role="aiWarn" hidden></div>
  <div class="row"><button type="button" class="primary small" data-role="aiGo" title="调用 1 次 AI，只发送这五项需求">生成草稿</button><button type="button" class="ghost small" data-role="aiCancel">关闭需求</button><span class="map-note" data-role="aiActivity" role="status" aria-live="polite"></span></div>
  <section data-role="revisionPreview" hidden>
    <div data-role="revisionSummary"></div>
    <div data-role="revisionGraph"></div>
    <button type="button" class="primary small" data-role="revisionConfirm">确认修改</button>
  </section>
</div>

<section data-role="empty" hidden>
  <p class="hint">还没有学习图</p>
  <div class="map-actions">
    <button type="button" class="primary" data-role="aiOpen">让 AI 起草一张</button>
    <button type="button" class="ghost" data-role="startEmpty">自己搭一张</button>
  </div>
</section>

<section data-role="main" hidden>
  <div class="map-summary">
    <span data-role="summary"></span>
    <div class="mode-pick"><div class="seg" role="radiogroup" aria-label="推荐方式" data-role="modeSeg"><button type="button" role="radio" aria-checked="true" data-mode="route">按学习图推荐</button><button type="button" role="radio" aria-checked="false" data-mode="off">热点模式</button></div>
      <span class="sub" data-role="modeNote"></span></div>
  </div>
  <div class="map-shape" data-role="shape"></div>
  <div class="map-layout">
    <div data-role="graph"></div>
    <aside class="map-detail" data-role="detail" aria-live="polite"></aside>
  </div>
  <div class="map-actions">
    <button type="button" class="ghost small" data-role="add">+ 添加概念</button>
    <button type="button" class="ghost small" data-role="aiOpen2" title="调用 1 次 AI，发送这五项需求和当前学习图的概念与前置">按需求修改学习图</button>
    <button type="button" class="ghost small" data-role="check" title="只发送检索词到 OpenAlex">用公开文献核对</button>
    <button type="button" class="primary small" data-role="save" hidden>保存修改</button>
    <button type="button" class="ghost small" data-role="discard" hidden>放弃修改</button>
  </div>
  <section class="growth" data-role="growth">
    <header><h3>潜在方向</h3><button type="button" class="ghost small" data-role="findGrowth">刷新</button></header>
    <div class="notice" data-role="growthNotice" hidden></div>
    <div data-role="growthList"></div>
  </section>
</section>
</div>
<dialog class="route-quit" data-role="quitDialog" aria-labelledby="routeQuitTitle" aria-describedby="routeQuitHint">
  <h2 id="routeQuitTitle">有未保存的修改</h2>
  <p id="routeQuitHint">学习图或需求尚未保存。</p>
  <div class="actions">
    <button type="button" class="primary" data-role="quitReview">返回检查并保存</button>
    <button type="button" data-role="quitCancel">取消退出</button>
    <button type="button" data-role="quitDiscard">放弃修改并退出</button>
  </div>
</dialog>
<script src="/route-editor.js"></script>
<script src="/route-brief.js"></script>
<script src="/route-graph.js"></script>
<script src="/route-page.js"></script>
</body>
</html>
