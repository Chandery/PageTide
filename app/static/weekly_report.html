<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>本周变化 · PaperDigHelper</title><script>document.documentElement.dataset.mode=localStorage.getItem('pdh-mode')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/profile.css"><style>body{margin:0;background:var(--base);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;font-size:calc(15px * var(--s))}main.profile-page{max-width:calc(980px * var(--s));margin:0 auto;padding:calc(32px * var(--s)) calc(24px * var(--s)) calc(72px * var(--s))}.back-link{flex:none;padding:calc(7px * var(--s)) calc(14px * var(--s));border:1px solid var(--line-strong);border-radius:var(--r-md);color:var(--text);text-decoration:none;font-size:calc(13px * var(--s))}.back-link:hover{background:var(--surface-2)}</style></head><body><main class="profile-page"><div class="profile-head"><div class="profile-kicker">PaperDigHelper · 本地周报</div><div class="profile-headline"><div><h1>本周变化</h1><p>只整理已发生的本地活动。没有记录不代表兴趣下降，也不会生成阅读债务。</p></div><a href="/" class="back-link">返回画像</a></div></div><section class="profile-section" id="weeklyContent"><div class="profile-empty">正在读取本地记录…</div></section></main><dialog class="profile-evidence" id="evidence" aria-label="周报来源证据"><header><h2>来源明细</h2><button type="button" data-close>关闭</button></header><div id="evidenceBody"></div></dialog><script src="/profile-ui.js"></script><script>
const $=s=>document.querySelector(s), esc=PDHProfile.esc;
async function api(url){const r=await fetch(url);const j=await r.json();if(!r.ok)throw Error(j.error||'读取失败');return j;}
(async()=>{const id=new URLSearchParams(location.search).get('project_id')||localStorage.getItem('pdh-current-project');if(!id){$('#weeklyContent').innerHTML='<div class="profile-empty">请先在主页面选择项目。</div>';return;}try{const d=await api('/api/profile/insights?project_id='+encodeURIComponent(id));$('#weeklyContent').innerHTML='<h2>本周与上周</h2>'+PDHProfile.weeklyHTML(d.weekly_change);$('#weeklyContent').addEventListener('click',async e=>{const b=e.target.closest('[data-evidence]');if(!b)return;const q=new URLSearchParams({project_id:id,kind:b.dataset.evidence});if(b.dataset.start){q.set('start',b.dataset.start);q.set('end',b.dataset.end);}if(b.dataset.term)q.set('term',b.dataset.term);const r=await api('/api/profile/evidence?'+q);$('#evidence h2').textContent=b.dataset.term?b.dataset.term:'来源明细';$('#evidenceBody').innerHTML=(r.items||[]).map(x=>'<div class="profile-feedback-row"><span>'+esc(x.title)+'<small class="profile-note">'+esc(x.published||'年份未知')+' · '+esc(x.time||'')+'</small></span></div>').join('')||'<div class="profile-empty">没有匹配记录。</div>';$('#evidence').showModal();});}catch(e){$('#weeklyContent').innerHTML='<div class="profile-empty profile-error">'+esc(e.message)+'</div>';}})();$('#evidence').addEventListener('click',e=>{if(e.target.hasAttribute('data-close'))$('#evidence').close();});
</script></body></html>
