<!doctype html>
<html lang="zh-CN" data-mode="light" data-accent="violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperDigHelper</title>
<style>
  /* Neumorphism: one surface colour, depth from paired shadows (no borders). */
  :root {
    --base:#e7ebf1; --text:#3b4058; --muted:#7d849b;
    --sd:rgba(163,177,198,.62); --sl:rgba(255,255,255,.96);
    --accent:#6d5dfc; --accent-soft:rgba(109,93,252,.14);
    --good:#2f9e6f; --bad:#d05a4a; --warn:#c98a1f; --ai:#7b61ff;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --sh-out:7px 7px 16px var(--sd), -7px -7px 16px var(--sl);
    --sh-out-sm:4px 4px 9px var(--sd), -4px -4px 9px var(--sl);
    --sh-in:inset 5px 5px 11px var(--sd), inset -5px -5px 11px var(--sl);
    --sh-in-sm:inset 3px 3px 7px var(--sd), inset -3px -3px 7px var(--sl);
  }
  html[data-mode="dark"] {
    --base:#272b33; --text:#e3e7ee; --muted:#98a1b1;
    --sd:rgba(0,0,0,.62); --sl:rgba(255,255,255,.055);
    --accent-soft:rgba(109,93,252,.20);
    --good:#4ecb8d; --bad:#f0836f; --warn:#e0b25c; --ai:#a892ff;
  }
  html[data-accent="violet"] { --accent:#6d5dfc; --ai:#7b61ff; }
  html[data-accent="mint"]   { --accent:#1f9d6b; --ai:#2fa07a; }
  html[data-accent="coral"]  { --accent:#e2653f; --ai:#d0723f; }
  html[data-accent="rose"]   { --accent:#c94f86; --ai:#b5629a; }
  html[data-accent="amber"]  { --accent:#c78a1a; --ai:#b3861f; }
  html[data-mode="dark"][data-accent="violet"] { --accent:#8b7dff; --ai:#a394ff; }
  html[data-mode="dark"][data-accent="mint"]   { --accent:#3ecf9a; --ai:#54c69a; }
  html[data-mode="dark"][data-accent="coral"]  { --accent:#ff8a63; --ai:#e8946b; }
  html[data-mode="dark"][data-accent="rose"]   { --accent:#f07aae; --ai:#dd8fbb; }
  html[data-mode="dark"][data-accent="amber"]  { --accent:#e8b04a; --ai:#d7a44e; }

  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font:15px/1.62 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue","PingFang SC",Arial,sans-serif;
    color:var(--text); background:var(--base); min-height:100vh;
    transition:background .3s ease, color .3s ease;
  }
  .out { background:var(--base); box-shadow:var(--sh-out); border-radius:var(--r-lg); }
  .out-sm { background:var(--base); box-shadow:var(--sh-out-sm); border-radius:var(--r-sm); }
  .in { background:var(--base); box-shadow:var(--sh-in); border-radius:var(--r-lg); }
  .in-sm { background:var(--base); box-shadow:var(--sh-in-sm); border-radius:var(--r-sm); }

  /* ------------------------------------------------------------------ header */
  header.top { position:sticky; top:14px; z-index:40; max-width:920px; margin:14px auto 0;
               padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
               background:var(--base); box-shadow:var(--sh-out); border-radius:var(--r-lg); }
  .brand { font-weight:650; letter-spacing:.01em; display:flex; align-items:center; gap:9px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent);
         box-shadow:0 0 0 4px var(--accent-soft); }
  .tabs { display:flex; gap:4px; padding:5px; border-radius:14px; background:var(--base); box-shadow:var(--sh-in-sm); }
  .tab { padding:7px 16px; border-radius:10px; font-size:13.5px; color:var(--muted); cursor:pointer;
         user-select:none; transition:color .2s, background .2s, box-shadow .2s; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--text); font-weight:600; background:var(--base); box-shadow:var(--sh-out-sm); }
  .right { margin-left:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .stat { font-size:12px; color:var(--muted); display:flex; gap:10px; }
  .stat b { color:var(--text); font-weight:650; }
  .controls { display:flex; align-items:center; gap:8px; }
  .sw { width:17px; height:17px; border-radius:50%; cursor:pointer; box-shadow:var(--sh-out-sm);
        transition:transform .15s ease; }
  .sw:hover { transform:scale(1.12); }
  .sw.active { box-shadow:var(--sh-in-sm); }
  .sw[data-a="violet"]{background:#6d5dfc}.sw[data-a="mint"]{background:#1f9d6b}
  .sw[data-a="coral"]{background:#e2653f}.sw[data-a="rose"]{background:#c94f86}
  .sw[data-a="amber"]{background:#c78a1a}
  .modes { padding:4px; border-radius:12px; box-shadow:var(--sh-in-sm); display:flex; }
  main { max-width:920px; margin:20px auto 90px; padding:0 16px; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:-.015em; }
  .sub { color:var(--muted); font-size:13px; }

  /* ----------------------------------------------------------------- buttons */
  button, .btn { font:inherit; color:var(--text); cursor:pointer; border:none; background:var(--base);
    padding:9px 17px; border-radius:999px; box-shadow:var(--sh-out-sm);
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; text-decoration:none;
    transition:box-shadow .16s ease, transform .16s ease, color .16s ease; }
  button:hover, .btn:hover { transform:translateY(-1px); }
  button:active, .btn:active { box-shadow:var(--sh-in-sm); transform:none; }
  button:disabled { opacity:.55; cursor:default; transform:none; }
  button.primary { color:var(--accent); font-weight:650; }
  button.ghost { box-shadow:none; background:transparent; }
  button.ghost:hover { box-shadow:var(--sh-out-sm); }
  .tiny { padding:6px 13px; font-size:12.5px; }
  .danger:hover { color:var(--bad); }
  .saved { color:var(--good); font-weight:600; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  input[type=text] { font:inherit; color:var(--text); background:var(--base); border:none;
    border-radius:999px; padding:11px 18px; min-width:220px; flex:1; box-shadow:var(--sh-in-sm); }
  input[type=text]::placeholder { color:var(--muted); }
  input[type=text]:focus { outline:none; box-shadow:var(--sh-in-sm), 0 0 0 2px var(--accent-soft); }
  .switch { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer; }
  .switch input { accent-color:var(--accent); width:16px; height:16px; }

  /* -------------------------------------------------------------------- hero */
  .hero { padding:22px; margin-bottom:18px; background:var(--base); box-shadow:var(--sh-out);
          border-radius:var(--r-lg); animation:rise .5s ease both; }
  .hero .row + .row { margin-top:14px; }

  /* ------------------------------------------------------------------- cards */
  .grid { display:grid; grid-template-columns:1fr; gap:18px; }
  @media (min-width:820px) { .grid { grid-template-columns:1fr 1fr; } }
  .card { position:relative; padding:20px; cursor:pointer; background:var(--base);
          box-shadow:var(--sh-out); border-radius:var(--r-lg); animation:rise .45s ease both;
          transition:box-shadow .22s ease, transform .22s ease; }
  .card:hover { transform:translateY(-2px);
                box-shadow:10px 10px 22px var(--sd), -10px -10px 22px var(--sl); }
  .card:active { box-shadow:var(--sh-in); transform:none; }
  .card h3 { font-size:15.5px; margin:0 0 9px; line-height:1.44; letter-spacing:-.005em; }
  .meta { font-size:12px; color:var(--muted); display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:11px; }
  .badge { font-size:11px; padding:3px 10px; border-radius:999px; box-shadow:var(--sh-in-sm); color:var(--muted); }
  .badge.ai { color:var(--ai); }
  .badge.saved { color:var(--good); }
  .abs { font-size:13.5px; color:var(--text); opacity:.86;
         display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .ai-slot { margin-top:12px; }
  .ai-line { font-size:13px; padding:11px 13px; border-radius:var(--r-md); box-shadow:var(--sh-in-sm);
             animation:fade .3s ease both; }
  .ai-line b { color:var(--ai); }
  .ai-loading { display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--muted); }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid var(--accent-soft);
          border-top-color:var(--accent); animation:spin .8s linear infinite; }
  .ai-off { font-size:12.5px; color:var(--muted); }
  .why { font-size:12.5px; color:var(--muted); margin-top:13px; }
  .why span { box-shadow:var(--sh-in-sm); padding:5px 11px; border-radius:999px; display:inline-block; }
  .actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:15px; }
  .hint { position:absolute; right:20px; bottom:16px; font-size:11.5px; color:var(--muted);
          opacity:0; transition:opacity .2s; }
  .card:hover .hint { opacity:1; }

  /* --------------------------------------------------------------- preview */
  #preview { position:fixed; z-index:70; width:min(460px,92vw); padding:18px; background:var(--base);
             box-shadow:var(--sh-out); border-radius:var(--r-lg); pointer-events:auto;
             max-height:min(74vh,660px); display:flex; flex-direction:column;
             opacity:0; transform:translateY(8px) scale(.98); transition:opacity .16s, transform .16s; }
  #preview.show { opacity:1; transform:none; }
  #preview h4 { margin:0 0 9px; font-size:14px; line-height:1.44; }
  #preview .pabs { font-size:12.5px; overflow:auto; color:var(--muted); flex:1; padding-right:8px; }
  #preview .phint { margin-top:11px; font-size:11.5px; color:var(--accent); }
  .whyline { font-size:12.5px; color:var(--muted); margin-top:13px; }
  .whyline span { box-shadow:var(--sh-in-sm); padding:5px 11px; border-radius:999px; display:inline-block; }
  .pdfbox { box-shadow:var(--sh-in); border-radius:var(--r-md); height:min(72vh,640px); overflow:hidden; margin-top:6px; }
  .pdfbox iframe { width:100%; height:100%; border:0; background:#fff; }
  .pdfbox .ph { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;
                gap:12px; color:var(--muted); font-size:13px; }

  /* ----------------------------------------------------------- detail page */
  .page { position:fixed; inset:0; z-index:80; overflow:auto; padding:28px 16px 70px; background:var(--base);
          animation:slideIn .28s ease both; }
  .page-inner { max-width:800px; margin:0 auto; padding:28px; background:var(--base);
                box-shadow:var(--sh-out); border-radius:var(--r-lg); }
  .page h2 { font-size:22px; line-height:1.4; margin:0 0 10px; letter-spacing:-.015em; }
  .full { font-size:14.5px; line-height:1.85; opacity:.92; }
  .full p, .msg p { margin:0 0 10px; }
  .full h4, .msg h4 { margin:14px 0 6px; font-size:14px; }
  .full ul, .msg ul { margin:6px 0 10px 20px; padding:0; }
  .full li, .msg li { margin:3px 0; }
  .full code, .msg code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px;
                          box-shadow:var(--sh-in-sm); padding:1px 6px; border-radius:6px; }
  .full pre, .msg pre { box-shadow:var(--sh-in-sm); padding:12px 14px; border-radius:var(--r-sm);
                        overflow:auto; margin:8px 0; }
  .full pre code, .msg pre code { box-shadow:none; padding:0; background:none; }
  .full a, .msg a { color:var(--accent); }
  .label { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:26px 0 10px; }

  /* --------------------------------------------------------------- library */
  .lib-item { padding:18px; cursor:pointer; display:flex; gap:16px; align-items:center; background:var(--base);
              box-shadow:var(--sh-out); border-radius:var(--r-lg); animation:rise .4s ease both;
              transition:box-shadow .2s, transform .2s; }
  .lib-item:hover { transform:translateY(-2px);
                    box-shadow:9px 9px 20px var(--sd), -9px -9px 20px var(--sl); }
  .lib-item h4 { margin:0 0 6px; font-size:14.5px; line-height:1.45; }

  /* ---------------------------------------------------------------- reader */
  .reader { position:fixed; inset:0; z-index:90; background:var(--base); display:flex; flex-direction:column;
            animation:fade .18s ease both; }
  .reader .rbar { display:flex; align-items:center; gap:12px; padding:11px 16px; box-shadow:var(--sh-out-sm);
                  position:relative; z-index:3; }
  .reader .rbar h2 { font-size:13.5px; margin:0; flex:1; font-weight:600; overflow:hidden;
                     text-overflow:ellipsis; white-space:nowrap; }
  .reader .pages { flex:1; overflow:auto; padding:22px 0 60px; display:flex; flex-direction:column;
                   align-items:center; gap:22px; }
  .reader .pg { position:relative; background:#fff; box-shadow:0 12px 34px rgba(0,0,0,.4); }
  .reader .pg canvas { display:block; }
  /* pdf.js TextLayer contract (copied from pdf_viewer.css) — do not change. */
  .reader .textLayer { position:absolute; text-align:initial; inset:0; overflow:clip; opacity:1; line-height:1;
                       text-size-adjust:none; forced-color-adjust:none; transform-origin:0 0; caret-color:CanvasText; z-index:0; }
  .reader .textLayer :is(span, br) { color:transparent; position:absolute; white-space:pre; cursor:text; transform-origin:0% 0%; }
  .reader .textLayer ::selection { background:color-mix(in srgb, var(--accent) 45%, transparent); }
  .reader .textLayer br::selection { background:transparent; }
  .reader .textLayer .endOfContent { display:block; position:absolute; inset:100% 0 0; z-index:0; cursor:default; user-select:none; }
  .reader .rload { margin:auto; color:var(--muted); font-size:13px; display:flex; gap:10px; align-items:center; }
  .reader .rbody { flex:1; display:flex; min-height:0; }
  .reader .rside { width:158px; overflow:auto; padding:12px 10px; box-shadow:var(--sh-in-sm); display:none;
                   flex-direction:column; gap:12px; align-items:center; }
  .reader.side .rside { display:flex; }
  .reader .rside .thumb { cursor:pointer; border-radius:6px; overflow:hidden; background:#fff;
                          box-shadow:0 2px 8px rgba(0,0,0,.25); outline:2px solid transparent; }
  .reader .rside .thumb.active { outline-color:var(--accent); }
  .reader .rside .thumb canvas { display:block; }
  .reader .zoombar { display:flex; align-items:center; gap:2px; font-size:12px; color:var(--muted); }
  .reader .pgwrap { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .reader .pgno { font-size:11px; color:var(--muted); }
  .reader .rbody { min-height:0; }
  .reader .rside { overflow-y:auto; overflow-x:hidden; flex:0 0 auto; scrollbar-width:thin; }
  .reader .rside .thumb { flex:0 0 auto; }
  .reader .rside .thumb canvas { width:120px; height:auto; display:block; }
  .petpanel.docked { position:static; width:380px; flex:0 0 auto; margin:14px 14px 14px 0;
                    max-height:none; height:calc(100% - 28px); }
  .petpanel.docked header { box-shadow:var(--sh-out-sm); }
  body.reader-open .pet { bottom:14px; right:14px; opacity:.62; }
  body.reader-open .pet:hover { opacity:1; }
  .sugg { display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px 0; }
  .sugg button { font-size:12px; padding:5px 11px; }

  /* ------------------------------------------------------------ assistant */
  .pet { position:fixed; right:22px; bottom:22px; z-index:88; width:58px; height:58px; border-radius:50%;
         background:var(--base); box-shadow:var(--sh-out); display:flex; align-items:center; justify-content:center;
         cursor:pointer; font-size:23px; user-select:none; transition:transform .18s ease, box-shadow .18s; }
  .pet:hover { transform:translateY(-2px) scale(1.05); }
  .pet:active { box-shadow:var(--sh-in); transform:none; }
  .petpanel { position:fixed; right:22px; bottom:92px; z-index:89; width:min(410px,92vw);
              max-height:min(72vh,640px); display:none; flex-direction:column; background:var(--base);
              box-shadow:var(--sh-out); border-radius:var(--r-lg); overflow:hidden; }
  .petpanel.open { display:flex; animation:pop .22s ease both; }
  .petpanel header { padding:12px 14px; display:flex; align-items:center; gap:8px; box-shadow:var(--sh-in-sm); }
  .petpanel header b { font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ptitle { font-size:14.5px; font-weight:650; line-height:1.45; padding:12px 14px 0; }
  .ptitle small { display:block; font-weight:400; font-size:11.5px; color:var(--muted); margin-top:3px; }
  .pref { padding:8px 14px 0; display:flex; gap:6px; flex-wrap:wrap; }
  .refchip { font-size:11.5px; padding:4px 9px; border-radius:9px; box-shadow:var(--sh-in-sm);
             display:inline-flex; gap:7px; align-items:center; max-width:100%; }
  .refchip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:250px; }
  .refchip b { cursor:pointer; color:var(--muted); }
  .refchip b:hover { color:var(--bad); }
  #transPop { position:fixed; z-index:97; display:none; width:min(400px,92vw); padding:14px 16px;
              background:var(--base); box-shadow:var(--sh-out); border-radius:var(--r-md); }
  #transPop.show { display:block; animation:pop .16s ease both; }
  #transPop .tlabel { font-size:11.5px; color:var(--muted); margin-bottom:6px; }
  #transPop .tbody { font-size:13.5px; line-height:1.7; max-height:34vh; overflow:auto; }
  .plog { flex:1; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .msg { font-size:13px; line-height:1.62; padding:9px 12px; border-radius:var(--r-md); max-width:90%;
         white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; box-shadow:var(--sh-in-sm); }
  .msg.ai { align-self:flex-start; box-shadow:var(--sh-out-sm); }
  .msg.sys { align-self:center; color:var(--muted); font-size:12px; }
  .prow { display:flex; gap:8px; padding:12px 14px; }
  .prow input { box-shadow:var(--sh-in-sm); }

  /* ----------------------------------------------------------- selection */
  #selbar { position:fixed; z-index:96; display:none; gap:6px; padding:6px; background:var(--base);
            box-shadow:var(--sh-out); border-radius:999px; }
  #selbar.show { display:flex; animation:pop .16s ease both; }

  #toasts { position:fixed; right:18px; bottom:18px; z-index:95; display:flex; flex-direction:column; gap:10px; }
  .toast { padding:13px 17px; font-size:13px; background:var(--base); box-shadow:var(--sh-out);
           border-radius:var(--r-md); animation:pop .24s ease both; max-width:380px;
           border-left:4px solid var(--accent); }
  .toast.ok { border-left-color:var(--good); } .toast.warn { border-left-color:var(--warn); }
  .toast.err { border-left-color:var(--bad); } .toast.ai { border-left-color:var(--ai); }
  .empty { padding:40px; text-align:center; color:var(--muted); background:var(--base);
           box-shadow:var(--sh-in); border-radius:var(--r-lg); }
  .hidden { display:none !important; }
  footer { max-width:920px; margin:0 auto 40px; padding:0 16px; color:var(--muted); font-size:11.5px; text-align:center; }

  @keyframes rise { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
  @keyframes pop { from{opacity:0;transform:scale(.97) translateY(6px);} to{opacity:1;transform:none;} }
  @keyframes fade { from{opacity:0;} to{opacity:1;} }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes slideIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:none;} }
  @media (prefers-reduced-motion: reduce) { *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>PaperDigHelper</div>
  <div class="tabs">
    <div class="tab active" data-view="today">今日</div>
    <div class="tab" data-view="library">论文库</div>
    <div class="tab" data-view="profile">画像</div>
  </div>
  <div class="right">
    <div class="stat" id="stats"></div>
    <div class="controls">
      <div class="sws" id="sws" title="强调色"></div>
      <div class="modes"><button class="tiny ghost" id="modeBtn">◐</button></div>
    </div>
  </div>
</header>

<main>
  <section id="view-today">
    <section class="hero">
      <h1>今日推荐</h1>
      <div class="sub">本地优先 · 默认零 token · 生成后自动 AI 速览</div>
      <div class="row" style="margin-top:16px">
        <button class="primary" id="btnDaily">生成今日 5 篇</button>
        <button id="btnRefresh">抓取新论文</button>
        <label class="switch"><input type="checkbox" id="autoAi" checked> 生成后自动 AI 速览</label>
      </div>
    </section>
    <section id="cards" class="grid"></section>
  </section>

  <section id="view-library" class="hidden">
    <section class="hero">
      <h1>我的论文库</h1>
      <div class="sub">点「☆ 收藏」的论文会保存到这里；可随时取消收藏</div>
    </section>
    <div id="library" class="grid"></div>
  </section>

  <section id="view-profile" class="hidden">
    <section class="hero">
      <h1>我的画像</h1>
      <div class="sub">可查看、可修改、可回滚；「没空 / 看不懂 / 以后再看」不改变兴趣</div>
      <div class="row" style="margin-top:16px">
        <input type="text" id="pin" placeholder="钉死关键词（逗号分隔），例如 world model, JEPA, planning">
        <button id="btnPin">保存关键词</button>
      </div>
    </section>
    <section class="hero" id="profileBox"></section>
  </section>
</main>
<footer id="foot"></footer>

<div id="reader" class="reader hidden">
  <div class="rbar">
    <button class="ghost" id="readerBack">← 返回</button>
    <button class="tiny ghost" id="readerToggleSide" title="页面缩略图">☰</button>
    <h2 id="readerTitle"></h2>
    <span class="stat" id="readerInfo"></span>
    <div class="zoombar">
      <button class="tiny ghost" id="zoomOut">−</button><span id="zoomLabel">100%</span>
      <button class="tiny ghost" id="zoomIn">+</button>
      <button class="tiny ghost" id="zoomFit">适宽</button>
    </div>
    <button class="tiny" id="readerNative" title="用浏览器自带阅读器打开（原生清晰、带边栏）">浏览器打开</button>
    <button class="tiny" id="readerAsk">对这篇提问</button>
  </div>
  <div class="rbody">
    <aside class="rside" id="readerSide"></aside>
    <div class="pages" id="readerPages"></div>
  </div>
</div>

<div class="petpanel" id="petPanel">
  <header>
    <b id="petTitle">阅读助手</b>
    <button class="tiny ghost" id="petClear">清空</button>
    <button class="tiny ghost" id="petClose">✕</button>
  </header>
  <div class="ptitle" id="petPaper">未选择论文<small>在卡片点「阅读 PDF」，或选中文字后追问</small></div>
  <div class="pref" id="petRef"></div>
  <div class="sugg" id="petSugg"></div>
  <div class="plog" id="petLog"></div>
  <div class="prow">
    <input type="text" id="petInput" placeholder="追问，例如：这个方法的核心假设是什么？">
    <button class="primary" id="petSend">发送</button>
  </div>
</div>
<div class="pet" id="pet" title="阅读助手">🐾</div>
<div id="selbar"><button class="tiny" data-sel="translate">翻译</button><button class="tiny" data-sel="ask">追问</button><button class="tiny ghost" data-sel="clear" title="取消选择">✕</button></div>
<div id="transPop"></div>

<div id="preview"></div>
<div id="detail" class="page hidden"></div>
<div id="toasts"></div>

<script>
const $ = (s) => document.querySelector(s);
const state = { view:'today', cards:[], library:[], summaries:{}, profile:null, stats:null, triaging:false, version:'?' };

// ------------------------------------------------------------ appearance
const ACCENTS = ['violet','mint','coral','rose','amber'];
function setMode(m){ document.documentElement.dataset.mode = m; localStorage.setItem('pdh-mode', m); }
function setAccent(a){ document.documentElement.dataset.accent = a; localStorage.setItem('pdh-accent', a);
  document.querySelectorAll('.sw').forEach(s => s.classList.toggle('active', s.dataset.a === a)); }
$('#sws').innerHTML = ACCENTS.map(a => `<span class="sw" data-a="${a}" title="${a}"></span>`).join('');
document.querySelectorAll('.sw').forEach(s => s.onclick = () => setAccent(s.dataset.a));
setMode(localStorage.getItem('pdh-mode') || (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
setAccent(localStorage.getItem('pdh-accent') || 'violet');
$('#modeBtn').onclick = () => setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark');

// ------------------------------------------------------------------ utils
function toast(msg, kind='ok', ms=3600) {
  const el = document.createElement('div'); el.className = `toast ${kind}`; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),250); }, ms);
}
async function api(path, body) {
  const res = await fetch(path, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
function mdInline(t) {
  return t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function md(text) {
  const lines = esc(text || '').split('\n');
  let html = '', inCode = false, list = [];
  const flush = () => { if (list.length) { html += '<ul>' + list.map((x) => `<li>${x}</li>`).join('') + '</ul>'; list = []; } };
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) {
      if (inCode) { html += '</code></pre>'; inCode = false; } else { flush(); html += '<pre><code>'; inCode = true; }
      continue;
    }
    if (inCode) { html += raw + '\n'; continue; }
    const li = raw.match(/^\s*[-*]\s+(.*)$/);
    if (li) { list.push(mdInline(li[1])); continue; }
    flush();
    const h = raw.match(/^#{1,4}\s+(.*)$/);
    if (h) { html += `<h4>${mdInline(h[1])}</h4>`; continue; }
    if (!raw.trim()) continue;
    html += `<p>${mdInline(raw)}</p>`;
  }
  flush();
  if (inCode) html += '</code></pre>';
  return html;
}
const esc = (s) => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderStats() {
  const s = state.stats || {};
  $('#stats').innerHTML = `<span>文献 <b>${s.papers ?? 0}</b></span><span>收藏 <b>${s.saved ?? 0}</b></span>
    <span>正例 <b>${s.positive ?? 0}</b></span><span>负例 <b>${s.negative ?? 0}</b></span>`;
}

// ------------------------------------------------------------------ cards
function aiSlot(c) {
  if (c.summary) return `<div class="ai-line"><b>速览</b> ${esc(c.summary.one_liner || '')}
    ${c.summary.why_relevant ? `<div class="sub">相关：${esc(c.summary.why_relevant)}</div>` : ''}</div>`;
  if (state.triaging) return `<div class="ai-loading"><span class="spin"></span>AI 正在速览…</div>`;
  return `<div class="ai-off">（尚未速览）</div>`;
}
function cardHTML(c, i) {
  const saved = c.saved || c.feedback === 'useful';
  return `
  <article class="card" data-key="${esc(c.key)}" style="animation-delay:${i*50}ms">
    <h3>${esc(c.title)}</h3>
    <div class="meta">
      <span>${esc(c.published || '')}</span><span>${esc(c.source || '')}</span>
      ${saved ? '<span class="badge saved">已收藏</span>' : ''}
      ${c.summary ? '<span class="badge ai">AI 已速览</span>' : ''}
    </div>
    <div class="abs">${esc(c.abstract || '（无摘要）')}</div>
    <div class="ai-slot">${aiSlot(c)}</div>
    <div class="whyline"><span>推荐理由：${esc(c.why)}</span></div>
    <div class="actions">
      <button class="tiny ${saved ? 'saved' : ''}" data-fb="${saved ? 'unsave' : 'useful'}" data-key="${esc(c.key)}">
        ${saved ? '✓ 已收藏（点此取消）' : '☆ 收藏'}</button>
      <button class="tiny" data-fb="irrelevant" data-key="${esc(c.key)}">不感兴趣</button>
      <button class="tiny" data-read="${esc(c.key)}" data-title="${esc(c.title)}">阅读 PDF</button>
    </div>
    <div class="hint">点击查看详情 →</div>
  </article>`;
}
function renderCards() {
  if (state.view !== 'today') return;
  $('#cards').innerHTML = state.cards.length ? state.cards.map(cardHTML).join('')
    : `<div class="empty">还没有今日卡片。先「抓取新论文」，再点「生成今日 5 篇」。</div>`;
}
function renderLibrary() {
  $('#library').innerHTML = state.library.length ? state.library.map((p, i) => `
    <article class="lib-item" data-key="${esc(p.key)}" style="animation-delay:${i*40}ms">
      <div style="flex:1">
        <h4>${esc(p.title)}</h4>
        <div class="meta"><span>${esc(p.published || '')}</span><span>${esc(p.source || '')}</span>
          <span>收藏于 ${esc((p.saved_at || '').slice(0,10))}</span></div>
      </div>
      <button class="tiny danger" data-unsave="${esc(p.key)}">取消收藏</button>
    </article>`).join('') : `<div class="empty">论文库还是空的。在今日卡片上点「☆ 收藏」。</div>`;
}
function renderProfile() {
  const p = state.profile || {};
  $('#profileBox').innerHTML = `
    <div class="sub">项目：<b>${esc(p.project || '')}</b></div>
    <div class="label">钉死关键词</div>
    <div>${(p.pinned_terms || []).length ? p.pinned_terms.map(t => `<span class="badge">${esc(t)}</span>`).join(' ') : '<span class="sub">（无）</span>'}</div>
    <div class="label">种子与反馈</div>
    <div>正向种子 <b>${(p.positive_seeds || []).length}</b> · 反馈正例 <b>${(p.positive_feedback || []).length}</b>
      · 显式负例 <b>${(p.explicit_negatives || []).length}</b> · 中性 <b>${(p.neutral_feedback || []).length}</b></div>`;
}

async function load() {
  const data = await api('/api/home');
  state.version = data.server_version || '?';
  state.stats = data.stats; state.profile = data.profile; state.summaries = data.summaries || {};
  state.cards = (data.cards || []).map(c => ({ ...c, summary: c.summary || state.summaries[c.key] }));
  renderStats(); renderCards(); renderProfile();
  $('#foot').textContent = `本地运行 · 数据在 .local/app · 服务端版本 ${state.version}`;
}
async function loadLibrary() {
  const data = await api('/api/library');
  state.library = data.items || []; state.stats = data.stats; renderStats(); renderLibrary();
}

// ------------------------------------------------------------- generation
async function generate() {
  const b = $('#btnDaily'); b.disabled = true; b.textContent = '生成中…';
  try {
    const r = await api('/api/daily', { limit: 5 });
    if (!r.cards || !r.cards.length) { toast(r.reason || '没有新候选，先抓取', 'warn'); return; }
    state.cards = r.cards.map(c => ({ ...c, summary: null }));
    renderCards();
    toast(`已生成 ${r.cards.length} 篇`, 'ok');
    if ($('#autoAi').checked) await autoTriage();
  } catch (e) { toast(`生成失败：${e.message}`, 'err'); }
  finally { b.disabled = false; b.textContent = '生成今日 5 篇'; }
}
async function autoTriage() {
  if (state.triaging) return;
  state.triaging = true; renderCards();
  try {
    const r = await api('/api/triage', { dry_run: false });
    if (!r.ok) toast(`AI 速览不可用（${r.reason || '未知'}），保持本地模式`, 'warn', 5000);
    else toast(`AI 已速览 ${r.items.length} 条 · ${r.usage.total_tokens} token · $${r.usd}`, 'ai');
    await load();
  } catch (e) { toast(`AI 速览失败：${e.message}`, 'err'); }
  finally { state.triaging = false; renderCards(); }
}
$('#btnDaily').onclick = generate;
$('#btnRefresh').onclick = async () => {
  const b = $('#btnRefresh'); b.disabled = true; b.textContent = '抓取中…';
  try {
    const job = await api('/api/refresh', { pages: 1 });
    toast('后台抓取中（OpenAlex 公开元数据）…', 'warn');
    let r;
    for (let i = 0; i < 90; i++) { r = await api(`/api/jobs/${job.id}`); if (r.state !== 'running') break; await new Promise(x => setTimeout(x, 1000)); }
    if (r.state === 'failed') toast(`抓取失败：${r.error}`, 'err');
    else { const q = r.result || {}; toast(`新增 ${q.added || 0} 条${q.errors?.length ? `（${q.errors.length} 个查询被限流跳过）` : ''}`, q.errors?.length ? 'warn' : 'ok'); }
    await load();
  } catch (e) { toast(`抓取失败：${e.message}`, 'err'); }
  finally { b.disabled = false; b.textContent = '抓取新论文'; }
};
$('#btnPin').onclick = async () => {
  const r = await api('/api/pin', { terms: $('#pin').value });
  state.profile = r.profile; state.stats = r.stats; renderStats(); renderProfile(); toast('关键词已保存');
};

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  state.view = t.dataset.view;
  $('#view-today').classList.toggle('hidden', state.view !== 'today');
  $('#view-library').classList.toggle('hidden', state.view !== 'library');
  $('#view-profile').classList.toggle('hidden', state.view !== 'profile');
  if (state.view === 'library') loadLibrary().catch(e => toast(e.message, 'err'));
});

// --------------------------------------------------------------- feedback
async function doFeedback(key, action) {
  if (action === 'unsave') {
    await api('/api/unsave', { key });
    toast('已取消收藏', 'warn');
  } else {
    const r = await api('/api/feedback', { key, action });
    toast(r.saved ? '已收藏到论文库（卡片保留）' : (r.interest_changed ? `已记录：${action}` : `已记录：${action}（不影响兴趣）`),
          r.saved || r.interest_changed ? 'ok' : 'warn');
  }
  const card = state.cards.find(c => c.key === key);
  if (card) { if (action === 'unsave') { card.saved = false; card.feedback = null; } else if (action === 'useful') card.saved = true; }
  renderCards();
  if (state.view === 'library') await loadLibrary();
}
$('#cards').addEventListener('click', (e) => {
  const rd = e.target.closest('button[data-read]');
  if (rd) { e.stopPropagation(); window.PDH.openReader(rd.dataset.read, rd.dataset.title); return; }
  const fb = e.target.closest('button[data-fb]');
  if (fb) { e.stopPropagation(); doFeedback(fb.dataset.key, fb.dataset.fb).catch(x => toast(x.message, 'err')); return; }
  const card = e.target.closest('.card[data-key]');
  if (card) openDetail(card.dataset.key);
});
$('#library').addEventListener('click', (e) => {
  const un = e.target.closest('button[data-unsave]');
  if (un) { e.stopPropagation(); doFeedback(un.dataset.unsave, 'unsave').catch(x => toast(x.message, 'err')); return; }
  const item = e.target.closest('.lib-item[data-key]');
  if (item) openDetail(item.dataset.key);
});

// hover preview
let hoverTimer = null, hideTimer = null, hoverKey = null;
function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(hidePreview, 240); }
function cancelHide() { clearTimeout(hideTimer); }
$('#cards').addEventListener('mouseover', (e) => {
  const card = e.target.closest('.card[data-key]'); if (!card) return;
  cancelHide();
  if (card.dataset.key === hoverKey) return;
  hoverKey = card.dataset.key; clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => showPreview(card), 500);
});
$('#cards').addEventListener('mouseout', (e) => {
  const card = e.target.closest('.card[data-key]'); if (!card) return;
  if (e.relatedTarget && card.contains(e.relatedTarget)) return;
  clearTimeout(hoverTimer); scheduleHide();
});
// Keep the preview open while the pointer is inside it so the abstract can be scrolled.
$('#preview').addEventListener('mouseenter', cancelHide);
$('#preview').addEventListener('mouseleave', scheduleHide);
function showPreview(card) {
  const c = state.cards.find(x => x.key === card.dataset.key); if (!c) return;
  const p = $('#preview');
  p.innerHTML = `<h4>${esc(c.title)}</h4><div class="pabs">${esc(c.abstract || '（无摘要）')}</div>
    <div class="phint">点击卡片打开详情页（含 PDF 预览）</div>`;
  p.style.left = '0px'; p.style.top = '0px';
  p.classList.add('show');
  const r = card.getBoundingClientRect();
  const w = p.offsetWidth, h = p.offsetHeight;
  let left = Math.min(r.right + 16, window.innerWidth - w - 16); if (left < 12) left = 12;
  let top = Math.min(Math.max(12, r.top), Math.max(12, window.innerHeight - h - 16));
  p.style.left = `${left}px`; p.style.top = `${top}px`;
}
function hidePreview() { $('#preview').classList.remove('show'); hoverKey = null; }

// ------------------------------------------------------------ detail page
async function openDetail(key) {
  hidePreview();
  try {
    // POST with the key in the body: no URL-encoding pitfalls for URL-shaped keys.
    const d = await api('/api/detail', { key });
    const s = d.summary;
    $('#detail').innerHTML = `
      <div class="page-inner">
        <button class="ghost" id="backBtn">← 返回</button>
        <div class="label" style="margin-top:20px">论文详情</div>
        <h2>${esc(d.title)}</h2>
        <div class="meta">
          <span>${esc(d.published || '')}</span><span>${esc(d.source || '')}</span>
          ${d.arxiv_id ? `<span class="badge">arXiv:${esc(d.arxiv_id)}</span>` : ''}
          ${d.saved ? '<span class="badge saved">已收藏</span>' : ''}
        </div>
        ${s ? `<div class="ai-line" style="margin-top:18px"><b>速览</b> ${md(s.one_liner || '')}
          <div class="sub">相关：${esc(s.why_relevant || '')}${s.caution ? ` · 注意：${esc(s.caution)}` : ''}</div></div>` : ''}
        <div class="label">完整摘要</div>
        <div class="full">${md(d.abstract || '（无摘要）')}</div>
        <div class="row" style="margin-top:20px">
          <button class="primary" id="dRead">全屏阅读 PDF</button>
          <button id="dToggle" class="${d.saved ? 'saved' : 'primary'}" data-key="${esc(d.key)}" data-saved="${d.saved}">
            ${d.saved ? '✓ 已收藏（点击取消）' : '☆ 收藏到论文库'}</button>
          <button class="tiny" data-fb="irrelevant" data-key="${esc(d.key)}">不感兴趣</button>
          <a class="btn" href="${esc(d.url)}" target="_blank" rel="noreferrer">打开原文</a>
        </div>
      </div>`;
    $('#detail').classList.remove('hidden');
    $('#backBtn').onclick = () => $('#detail').classList.add('hidden');
    $('#dRead').onclick = () => window.PDH.openReader(d.key, d.title);
    window.PDH.setPetContext(d.key, d.title);
    $('#dToggle').onclick = async (ev) => {
      const btn = ev.currentTarget, wasSaved = btn.dataset.saved === 'true';
      await doFeedback(d.key, wasSaved ? 'unsave' : 'useful');
      const now = !wasSaved;
      btn.dataset.saved = String(now);
      btn.className = now ? 'saved' : 'primary';
      btn.textContent = now ? '✓ 已收藏（点击取消）' : '☆ 收藏到论文库';
    };
  } catch (e) {
    toast(`打不开详情：${e.message}`, 'err', 6000);
  }
}
$('#detail').addEventListener('click', (e) => {
  const fb = e.target.closest('button[data-fb]');
  if (fb) doFeedback(fb.dataset.key, fb.dataset.fb).catch(x => toast(x.message, 'err'));
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#detail').classList.add('hidden'); hidePreview(); } });
document.addEventListener('scroll', hidePreview, { passive: true });

load().catch(e => toast(`加载失败：${e.message}`, 'err'));

// Cross-script bridge for the ES-module reader/assistant below.
window.PDH = { api, toast, esc, md, state, openDetail, setPetContext: (k, t) => window.PDHSetContext?.(k, t) };
</script>
<script type="module">
const { api, toast } = window.PDH;
const $ = (s) => document.querySelector(s);
const pet = { key: null, title: null, selection: null, busy: false };
window.PDHSetContext = (key, title) => {
  pet.key = key; pet.title = title;
  $('#petPaper').innerHTML = title
    ? esc(title) + '<small>正在阅读 · 可选中文字追问</small>'
    : '未选择论文<small>在卡片点「阅读 PDF」，或选中文字后追问</small>';
};
function setReference(text) {
  pet.selection = text || null;
  const box = $('#petRef');
  box.innerHTML = '';
  if (!text) return;
  const chip = document.createElement('div');
  chip.className = 'refchip';
  const label = document.createElement('span');
  label.textContent = `引用：${text.replace(/\s+/g, ' ').slice(0, 120)}`;
  const kill = document.createElement('b');
  kill.textContent = '✕';
  kill.onclick = () => setReference(null);
  chip.append(label, kill);
  box.appendChild(chip);
}

/* ---------------------------------------------------------------- reader */
let pdfjs = null;
async function lib() {
  if (pdfjs) return pdfjs;
  pdfjs = await import('/vendor/pdfjs/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';
  return pdfjs;
}
const R = { doc:null, pages:[], scale:null, fit:true, side:false, observer:null, jobs:new Map(), url:null, current:1 };

async function openReader(key, title) {
  window.PDHSetContext(key, title);
  const box = $('#readerPages'), side = $('#readerSide'), reader = $('#reader');
  $('#readerTitle').textContent = title || '';
  $('#readerInfo').textContent = '';
  box.innerHTML = '<div class="rload"><span class="spin"></span>正在获取并渲染 PDF…</div>';
  side.innerHTML = '';
  reader.classList.remove('hidden');
  reader.classList.add('side');   // page thumbnails visible by default, like the native viewer
  document.body.classList.add('reader-open');
  dockPanel(true);
  R.side = true;
  if (R.observer) { R.observer.disconnect(); R.observer = null; }
  R.doc = null; R.pages = []; R.scale = null; R.fit = true; R.jobs = new Map(); R.current = 1;
  const url = `/api/pdf/view?key=${encodeURIComponent(key)}`;
  R.url = url; R.key = key;
  try { await api('/api/pdf/prepare', { key }); } catch (e) { /* the render step reports the real failure */ }
  try {
    const L = await lib();
    R.doc = await L.getDocument({ url, standardFontDataUrl: '/vendor/pdfjs/standard_fonts/' }).promise;
    R.pages = [];
    for (let n = 1; n <= R.doc.numPages; n++) R.pages.push(await R.doc.getPage(n));
    $('#readerInfo').textContent = `${R.doc.numPages} 页`;
    await layoutPages();
    buildThumbs();
  } catch (e) {
    box.innerHTML = `<iframe src="${url}" style="width:min(1200px,96vw);height:calc(100vh - 120px);border:0;background:#fff"></iframe>`;
    $('#readerInfo').textContent = '内置预览（无法划词）';
    toast(`pdf.js 加载失败，改用浏览器内置预览：${e.message}`, 'warn', 6000);
  }
}

function pageScale(page) {
  if (!R.fit) return R.scale || 1.2;
  const avail = Math.max(320, $('#readerPages').clientWidth - 56);
  return avail / page.getViewport({ scale: 1 }).width;
}

async function layoutPages() {
  const box = $('#readerPages');
  const keepPage = R.current || 1;
  if (R.observer) { R.observer.disconnect(); R.observer = null; }
  box.innerHTML = '';
  R.jobs = new Map();
  R.observer = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) { renderPage(Number(en.target.dataset.n)); markCurrent(Number(en.target.dataset.n)); }
    }
  }, { root: box, rootMargin: '800px 0px' });
  for (let i = 0; i < R.pages.length; i++) {
    const page = R.pages[i];
    const vp = page.getViewport({ scale: pageScale(page) });
    const wrap = document.createElement('div');
    wrap.className = 'pgwrap';
    wrap.dataset.n = i + 1;
    const pageDiv = document.createElement('div');
    pageDiv.className = 'pg';
    pageDiv.style.width = `${vp.width}px`;
    pageDiv.style.height = `${vp.height}px`;
    const canvas = document.createElement('canvas');
    pageDiv.appendChild(canvas);
    const textDiv = document.createElement('div');
    textDiv.className = 'textLayer';
    pageDiv.appendChild(textDiv);
    const num = document.createElement('div');
    num.className = 'pgno';
    num.textContent = `${i + 1} / ${R.pages.length}`;
    wrap.appendChild(pageDiv); wrap.appendChild(num);
    box.appendChild(wrap);
    R.observer.observe(wrap);
  }
  $('#zoomLabel').textContent = `${Math.round(pageScale(R.pages[0]) * 100)}%`;
  // Keep the reader where the user was; re-layout must not jump back to page 1.
  requestAnimationFrame(() => {
    document.querySelector(`.pgwrap[data-n="${keepPage}"]`)?.scrollIntoView({ block: 'start' });
    markCurrent(keepPage);
  });
}

function renderPage(n) {
  if (R.jobs.has(n)) return R.jobs.get(n);
  const job = (async () => {
    const L = await lib();
    const page = R.pages[n - 1];
    const wrap = document.querySelector(`.pgwrap[data-n="${n}"]`);
    if (!wrap) return;
    const pageDiv = wrap.querySelector('.pg');
    const canvas = pageDiv.querySelector('canvas');
    const textDiv = pageDiv.querySelector('.textLayer');
    const vp = page.getViewport({ scale: pageScale(page) });
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    canvas.style.width = `${vp.width}px`;
    canvas.style.height = `${vp.height}px`;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp,
                        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined }).promise;
    textDiv.innerHTML = '';
    textDiv.style.setProperty('--scale-factor', String(vp.scale));
    textDiv.style.setProperty('--total-scale-factor', String(vp.scale));
    const textLayer = new L.TextLayer({ textContentSource: await page.streamTextContent(), container: textDiv, viewport: vp });
    await textLayer.render();
  })().catch((e) => toast(`第 ${n} 页渲染失败：${e.message}`, 'err'));
  R.jobs.set(n, job);
  return job;
}

function markCurrent(n) {
  R.current = n;
  document.querySelectorAll('#readerSide .thumb').forEach((t) => t.classList.toggle('active', Number(t.dataset.n) === n));
}

let thumbObserver = null;
function buildThumbs() {
  const side = $('#readerSide');
  side.innerHTML = '';
  if (thumbObserver) { thumbObserver.disconnect(); thumbObserver = null; }
  thumbObserver = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) { renderThumb(Number(en.target.dataset.n)); thumbObserver.unobserve(en.target); }
    }
  }, { root: side, rootMargin: '300px 0px' });
  for (let i = 0; i < R.pages.length; i++) {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.dataset.n = i + 1;
    const canvas = document.createElement('canvas');
    canvas.width = 120; canvas.height = 160;
    div.appendChild(canvas);
    div.onclick = () => document.querySelector(`.pgwrap[data-n="${i + 1}"]`)?.scrollIntoView({ behavior:'smooth', block:'start' });
    side.appendChild(div);
    thumbObserver.observe(div);
  }
  markCurrent(1);
}

async function renderThumb(n) {
  const div = document.querySelector(`#readerSide .thumb[data-n="${n}"]`);
  if (!div) return;
  const page = R.pages[n - 1];
  const vp = page.getViewport({ scale: 120 / page.getViewport({ scale: 1 }).width });
  const canvas = div.querySelector('canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(vp.width * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  canvas.style.width = `${vp.width}px`;
  canvas.style.height = `${vp.height}px`;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp,
                      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined }).promise;
}

$('#readerToggleSide').onclick = () => { R.side = !R.side; $('#reader').classList.toggle('side', R.side); };
$('#zoomIn').onclick = async () => { R.fit = false; R.scale = Math.min(3, (R.scale || pageScale(R.pages[0])) + 0.2); await layoutPages(); };
$('#zoomOut').onclick = async () => { R.fit = false; R.scale = Math.max(0.4, (R.scale || pageScale(R.pages[0])) - 0.2); await layoutPages(); };
$('#zoomFit').onclick = async () => { R.fit = true; await layoutPages(); };
$('#readerNative').onclick = () => { if (R.url) window.open(R.url, '_blank'); };
// Re-fit the pages whenever the available width changes (panel docking, window resize).
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!$('#reader').classList.contains('hidden') && R.doc && R.fit) layoutPages();
  }, 180);
});
window.PDH.openReader = openReader;

/* --------------------------------------------------------- selection bar */
let selText = '', selRect = null;
function hideSel() { $('#selbar').classList.remove('show'); }
function showSel(rect, text) {
  selText = text;
  selRect = rect;
  const bar = $('#selbar');
  bar.classList.add('show');
  bar.style.left = `${Math.min(Math.max(10, rect.left), Math.max(10, window.innerWidth - bar.offsetWidth - 10))}px`;
  bar.style.top = `${Math.max(10, rect.top - bar.offsetHeight - 8)}px`;
}
document.addEventListener('mouseup', (e) => {
  if (e.target.closest && e.target.closest('#selbar')) return;
  const sel = window.getSelection();
  const text = sel ? sel.toString().replace(/\s+/g, ' ').trim() : '';
  const zone = e.target.closest && (e.target.closest('#readerPages') || e.target.closest('#detail'));
  if (!text || !zone) { hideSel(); return; }
  selRect = sel.getRangeAt(0).getBoundingClientRect();
  showSel(selRect, text);
});
document.addEventListener('scroll', hideSel, true);

/* ------------------------------------------------------------ assistant */
function dockPanel(dock) {
  const panel = $('#petPanel');
  if (dock) { $('#reader').querySelector('.rbody').appendChild(panel); panel.classList.add('docked'); }
  else { document.body.appendChild(panel); panel.classList.remove('docked'); }
}
function setPetOpen(open) {
  $('#petPanel').classList.toggle('open', open);
  // The panel is a flex column inside the reader, so the PDF re-fits automatically.
  if (!$('#reader').classList.contains('hidden') && R.doc) layoutPages();
}
function openPet() { setPetOpen(true); }

const SUGGESTIONS = [
  '这篇论文想解决什么问题？',
  '核心方法是什么？三句话说明。',
  '和已有工作相比新在哪里？',
  '有哪些假设或局限？',
  '如果要复现，关键步骤是什么？',
  '有哪些想法可以直接用到我的研究里？',
];
function renderSuggestions(list) {
  const box = $('#petSugg');
  box.innerHTML = '';
  for (const q of (list && list.length ? list : SUGGESTIONS)) {
    const b = document.createElement('button');
    b.className = 'tiny';
    b.textContent = q;
    b.onclick = () => ask(q);
    box.appendChild(b);
  }
}
renderSuggestions();
addMsg('sys', '点下面的问题直接问，或自己输入；也可以在 PDF 里选中文字后点「追问」。');
function addMsg(kind, text) {
  const el = document.createElement('div');
  el.className = `msg ${kind}`;
  if (kind === 'ai') el.innerHTML = window.PDH.md(text);
  else el.textContent = text;
  $('#petLog').appendChild(el);
  $('#petLog').scrollTop = $('#petLog').scrollHeight;
  return el;
}
async function ask(question) {
  if (!question.trim() || pet.busy) return;
  openPet(); pet.busy = true;
  addMsg('user', question);
  const thinking = addMsg('sys', '思考中…');
  try {
    const r = await api('/api/qa', { key: pet.key, question, selection: pet.selection });
    thinking.remove();
    addMsg(r.ok ? 'ai' : 'sys', r.ok ? r.answer : `AI 不可用：${r.reason || '未知'}`);
    if (r.ok) {
      toast(`回答完成 · ${r.usage.total_tokens} token · $${r.usd}`, 'ai');
      renderSuggestions(r.followups);   // follow-ups are regenerated from the exchange
    }
  } catch (e) { thinking.remove(); addMsg('sys', `失败：${e.message}`); }
  finally { pet.busy = false; setReference(null); }
}
async function translate(text, rect) {
  const pop = $('#transPop');
  pop.innerHTML = '<div class="tlabel">翻译中…</div>';
  placeTransPop(rect);
  pop.classList.add('show');
  try {
    const r = await api('/api/translate', { text });
    pop.innerHTML = `<div class="tlabel">划词翻译</div><div class="tbody">${
      r.ok ? window.PDH.md(r.translation) : '翻译不可用：' + (r.reason || '未知')}</div>
      <div class="row" style="margin-top:10px">
        <button class="tiny" id="transCopy">复制</button>
        <button class="tiny ghost" id="transClose">关闭</button></div>`;
    $('#transCopy').onclick = () => { navigator.clipboard?.writeText(pop.innerText).then(() => toast('已复制')); };
    $('#transClose').onclick = () => pop.classList.remove('show');
  } catch (e) {
    pop.innerHTML = `<div class="tlabel">翻译失败</div><div class="tbody">${esc(e.message)}</div>`;
  }
}
function placeTransPop(rect) {
  const pop = $('#transPop');
  pop.style.left = '0px'; pop.style.top = '0px';
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const r = rect || { left: 40, top: 80, bottom: 100 };
  pop.style.left = `${Math.min(Math.max(10, r.left), Math.max(10, innerWidth - w - 10))}px`;
  pop.style.top = `${Math.min(Math.max(10, r.bottom + 10), Math.max(10, innerHeight - h - 10))}px`;
}
$('#pet').onclick = () => setPetOpen(!$('#petPanel').classList.contains('open'));
$('#petClose').onclick = () => setPetOpen(false);
$('#petClear').onclick = () => { $('#petLog').innerHTML = ''; };
$('#petSend').onclick = () => { const v = $('#petInput').value; $('#petInput').value = ''; ask(v); };
$('#petInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const v = e.target.value; e.target.value = ''; ask(v); } });
$('#readerBack').onclick = () => { $('#reader').classList.add('hidden'); document.body.classList.remove('reader-open'); dockPanel(false); };
$('#readerAsk').onclick = () => { openPet(); $('#petInput').focus(); };
$('#selbar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-sel]');
  if (!btn) return;
  const text = selText, rect = selRect;
  hideSel();
  if (btn.dataset.sel === 'clear') { window.getSelection()?.removeAllRanges(); return; }
  if (btn.dataset.sel === 'translate') translate(text, rect);
  else { setReference(text); openPet(); $('#petInput').focus(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { hideSel(); $('#transPop').classList.remove('show'); window.getSelection()?.removeAllRanges(); }
});
</script>
</body>
