<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>PageTide</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font:var(--fs-md)/1.62 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue","PingFang SC",Arial,sans-serif;
    color:var(--text); background:var(--base); min-height:100vh;
    transition:background .3s ease, color .3s ease;
  }
  .out { background:var(--base); box-shadow:var(--sh-out); border-radius:var(--r-lg); }
  .out-sm { background:var(--base); box-shadow:var(--sh-out-sm); border-radius:var(--r-sm); }
  .in { background:var(--base); box-shadow:var(--sh-in); border-radius:var(--r-lg); }
  .in-sm { background:var(--base); box-shadow:var(--sh-in-sm); border-radius:var(--r-sm); }

  /* ------------------------------------------------------------------ header */
  header.top { position:sticky; top:14px; z-index:40; max-width:920px; margin:calc(14px * var(--s)) auto 0;
               padding:calc(12px * var(--s)) calc(16px * var(--s)); display:flex; align-items:center; gap:calc(14px * var(--s)); flex-wrap:wrap;
               background:var(--base); box-shadow:var(--sh-out); border-radius:var(--r-lg); }
  .brand { font-weight:650; letter-spacing:.01em; display:flex; align-items:center; gap:calc(9px * var(--s)); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent);
         box-shadow:0 0 0 4px var(--accent-soft); }
  .tabs { display:flex; gap:calc(4px * var(--s)); padding:calc(5px * var(--s)); border-radius:var(--r-lg); background:var(--base); box-shadow:var(--sh-in-sm); }
  .tab { padding:calc(7px * var(--s)) calc(16px * var(--s)); border-radius:var(--r-md); font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); cursor:pointer;
         user-select:none; transition:color .2s, background .2s, box-shadow .2s; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--text); font-weight:600; background:var(--base); box-shadow:var(--sh-out-sm); }
  .right { margin-left:auto; display:flex; align-items:center; gap:calc(12px * var(--s)); flex-wrap:wrap; }
  .stat { font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); display:flex; gap:calc(10px * var(--s)); }
  .stat b { color:var(--text); font-weight:650; }
  .controls { display:flex; align-items:center; gap:calc(8px * var(--s)); }
  .modes { padding:calc(4px * var(--s)); border-radius:var(--r-md); box-shadow:var(--sh-in-sm); display:flex; }

  /* ------------------------------------------ project overview (Mission Control style) */
  .project-btn { padding:7px 12px 7px 14px; border-radius:999px; font-size:var(--fs-sm); cursor:pointer;
                 background:var(--base); box-shadow:var(--sh-out-sm); display:flex; align-items:center; gap:8px;
                 transition:box-shadow .16s ease, transform .16s ease; user-select:none; }
  .project-btn:hover { background:var(--surface-2); }
  /* Header actions beside the project switcher: icon + word pills like the tabs; 新建项目 is the one that stands out. */
  .head-btn { display:inline-flex; align-items:center; gap:calc(6px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); font-weight:600;
              color:var(--muted); padding:calc(7px * var(--s)) calc(13px * var(--s)); border-radius:999px; text-decoration:none; white-space:nowrap;
              transition:background .15s var(--ease-out), color .15s var(--ease-out); }
  .head-btn .icon { width:16px; height:16px; flex:0 0 16px; }
  .head-btn:hover, .head-btn:focus-visible { color:var(--text); background:var(--surface-2); }
  .head-btn.head-new { color:var(--accent-text); background:var(--accent-soft); }
  .head-btn.head-new:hover, .head-btn.head-new:focus-visible { color:var(--accent-ink); background:var(--accent); }
  .project-btn .icon { font-size:var(--fs-md); }
  .project-btn kbd { font:var(--fs-xs)/1 -apple-system,BlinkMacSystemFont,sans-serif; color:var(--muted);
                     padding:3px 5px; border-radius:var(--r-sm); box-shadow:inset 0 0 0 1px var(--line-strong); }
  html.mc-open, html.mc-open body { overflow:hidden; }
  .mc { position:fixed; inset:0; z-index:200; --desk:#1a1d24; }
  html[data-mode="dark"] .mc { --desk:#08090b; }
  .mc[hidden] { display:none; }
  .mc-desk { position:absolute; inset:0;
             background:var(--desk); }
  .mc-bar { position:absolute; left:0; right:0; top:0; height:64px; display:flex; align-items:center;
            justify-content:center; gap:14px; color:#f3eee6; }
  .mc-title { font:600 var(--fs-md)/1 var(--display); letter-spacing:.02em; }
  .mc-hint { font-size:var(--fs-xs); opacity:.6; }
  .mc-bar .mc-add { position:absolute; right:22px; top:14px; width:36px; height:36px; padding:0; border-radius:var(--r-md);
                    display:grid; place-items:center; color:#f3eee6; background:rgba(255,255,255,.1);
                    border:1px solid rgba(255,255,255,.16); box-shadow:none; }
  .mc-bar .mc-add:hover { background:rgba(255,255,255,.18); transform:none; }
  .mc-stage { position:absolute; inset:0; top:0; }
  .mc-bar { z-index:1; }
  .mc-card { position:absolute; cursor:pointer; }
  .mc-card.front { z-index:2; }
  .mc-window { position:relative; overflow:hidden; border-radius:var(--r-md); transform-origin:0 0;
               background:var(--base); box-shadow:0 8px 24px rgba(0,0,0,.36), 0 0 0 1px rgba(255,255,255,.08); }
  .mc-window::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
                      box-shadow:inset 0 0 0 0 transparent; transition:box-shadow .14s ease; }
  .mc-card[aria-selected="true"] .mc-window::after { box-shadow:inset 0 0 0 3px var(--accent); }
  .mc-scale { transform-origin:0 0; }
  .mc-page { position:relative; overflow:hidden; background:var(--base); color:var(--text); pointer-events:none; }
  .mc-page, .mc-page * { animation:none !important; transition:none !important; }
  .mc-label { display:flex; align-items:center; justify-content:center; gap:7px; height:30px; padding-top:8px;
              font-size:var(--fs-sm); color:rgba(243,238,230,.78); white-space:nowrap; overflow:hidden; }
  .mc-label .mc-name { overflow:hidden; text-overflow:ellipsis; }
  .mc-edit { flex:0 0 auto; font-size:var(--fs-xs); padding:2px 8px; border-radius:999px; color:rgba(243,238,230,.8); background:rgba(255,255,255,.1);
             border:1px solid rgba(255,255,255,.16); box-shadow:none; opacity:0; transition:opacity .14s ease; cursor:pointer; }
  .mc-card:hover .mc-edit, .mc-card[aria-selected="true"] .mc-edit, .mc-edit:focus-visible { opacity:1; }
  .mc-edit:hover { background:rgba(255,255,255,.2); transform:none; }
  .mc-card[aria-selected="true"] .mc-label { color:#fff; font-weight:600; }
  .mc-demo { flex:0 0 auto; font-size:var(--fs-xs); padding:1px 7px; border-radius:999px; color:rgba(243,238,230,.8); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); }
  .mc-dot { flex:0 0 auto; width:6px; height:6px; border-radius:50%; background:var(--mark); }
  /* placeholder page for projects not opened in this session */
  .mc-ph-top { display:flex; align-items:center; gap:14px; padding:14px max(24px,calc((100% - 1200px)/2));
               border-bottom:1px solid var(--line); background:var(--surface-1); }
  .mc-ph-top img { height:24px; width:auto; }
  html[data-mode="dark"] .mc-ph-top img { content:url(/wordmark-dark.png); }
  .mc-ph-pill { padding:8px 16px; border-radius:999px; font-size:var(--fs-md); box-shadow:var(--sh-out-sm); }
  /* Centred by its side padding only: a max-width on top of that padding left the content 0 px wide on wide windows. */
  .mc-ph-body { margin:0; padding:40px max(28px,calc((100% - 1200px)/2)); }
  .mc-ph-edition { color:var(--muted); font-size:var(--fs-md); letter-spacing:.08em; }
  .mc-ph-body h1 { margin:10px 0 18px; font:600 var(--fs-3xl)/1.15 var(--display); }
  .mc-ph-chips { display:flex; flex-wrap:wrap; gap:10px; }
  .mc-ph-chips span { padding:6px 14px; border-radius:999px; background:var(--accent-soft); color:var(--accent-text); font-size:var(--fs-md); }
  .mc-ph-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:34px; }
  .mc-ph-grid div { height:190px; padding:22px; border-radius:var(--r-lg); background:var(--surface-1);
                    border:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  .mc-ph-grid i { display:block; height:14px; border-radius:var(--r-sm); background:var(--surface-3); }
  .mc-ph-grid i:first-child { width:80%; height:20px; }
  .mc-ph-grid i:last-child { width:55%; }

  main { max-width:920px; margin:20px auto 90px; padding:0 16px; }
  h1 { font-size:var(--fs-xl); margin:0 0 4px; letter-spacing:0; }
  .sub { color:var(--muted); font-size:var(--fs-sm); }

  /* ----------------------------------------------------------------- buttons */
  button, .btn { font:inherit; color:var(--text); cursor:pointer; border:none; background:var(--base);
    padding:calc(9px * var(--s)) calc(17px * var(--s)); border-radius:999px; box-shadow:var(--sh-out-sm);
    display:inline-flex; align-items:center; gap:calc(7px * var(--s)); white-space:nowrap; text-decoration:none;
    transition:box-shadow .16s ease, transform .16s ease, color .16s ease; }
  button:active, .btn:active { box-shadow:var(--sh-in-sm); transform:none; }
  button:disabled { opacity:.55; cursor:default; transform:none; }
  button.primary, .btn.primary { color:var(--accent); font-weight:650; }
  button.ghost { box-shadow:none; background:transparent; }
  button.ghost:hover { box-shadow:var(--sh-out-sm); }
  .tiny, .btn.tiny { padding:calc(6px * var(--s)) calc(13px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); }   /* .btn.tiny: a link styled as a small button must not be overridden by the later .btn rule */
  .danger:hover { color:var(--bad); }
  .saved { color:var(--good); font-weight:600; }
  .row { display:flex; gap:calc(12px * var(--s)); flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=password] { font:inherit; color:var(--text); background:var(--base); border:none;
    border-radius:999px; padding:calc(11px * var(--s)) calc(18px * var(--s)); min-width:220px; flex:1; box-shadow:var(--sh-in-sm); }
  input[type=text]::placeholder, input[type=password]::placeholder { color:var(--muted); }
  input[type=text]:focus, input[type=password]:focus { outline:none; box-shadow:var(--sh-in-sm), 0 0 0 2px var(--accent-soft); }
  .switch { display:inline-flex; align-items:center; gap:calc(8px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); cursor:pointer; }
  .switch input { accent-color:var(--accent); width:16px; height:16px; }

  /* -------------------------------------------------------------------- hero */
  .hero { padding:calc(22px * var(--s)); margin-bottom:calc(18px * var(--s)); background:var(--base); box-shadow:var(--sh-out);
          border-radius:var(--r-lg); animation:rise .5s ease both; }
  .hero .row + .row { margin-top:calc(14px * var(--s)); }

  /* ------------------------------------------------------------------- cards */
  .grid { display:grid; grid-template-columns:1fr; gap:calc(18px * var(--s)); }
  @media (min-width:820px) { .grid { grid-template-columns:1fr 1fr; } }
  .card { position:relative; padding:calc(20px * var(--s)); cursor:pointer; background:var(--base);
          box-shadow:var(--sh-out); border-radius:var(--r-lg); animation:rise .45s ease both;
          transition:box-shadow .22s ease, transform .22s ease; }
  .card:hover { box-shadow:var(--sh-2); }
  .card:active { box-shadow:var(--sh-in); transform:none; }
  .card h3 { font-size:calc(var(--fs-md) * var(--s)); margin:0 0 calc(9px * var(--s)); line-height:1.44; letter-spacing:0; }
  .meta { font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); display:flex; gap:calc(9px * var(--s)); flex-wrap:wrap; align-items:center; margin-bottom:calc(11px * var(--s)); }
  .badge { font-size:calc(var(--fs-xs) * var(--s)); padding:calc(3px * var(--s)) calc(10px * var(--s)); border-radius:999px; box-shadow:var(--sh-in-sm); color:var(--muted); }
  .badge.ai { color:var(--ai-text); }
  .badge.saved { color:var(--good); }
  .src-cnki { font-size:calc(var(--fs-xs) * var(--s)); padding:calc(3px * var(--s)) calc(10px * var(--s)); border-radius:999px;
              background:var(--src-cnki-soft); color:var(--src-cnki); font-weight:650; }
  .route-panel { margin-top:calc(16px * var(--s)); padding:calc(18px * var(--s)) calc(22px * var(--s)); border:0; box-shadow:var(--sh-1); border-radius:var(--r-lg); background:var(--surface-1);
    display:grid; gap:calc(14px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); line-height:1.6; }
  .route-panel[hidden], #maintainNote:empty, #eligibilityNote:empty, #triageFailure[hidden] { display:none; }
  .route-head .route-title { margin-right:auto; }
  .route-head, .route-foot { display:flex; align-items:center; justify-content:space-between; gap:calc(12px * var(--s)) calc(16px * var(--s)); flex-wrap:wrap; }
  .route-title { display:flex; align-items:baseline; gap:calc(8px * var(--s)); font-size:calc(var(--fs-md) * var(--s)); }
  .route-meter { display:flex; align-items:center; gap:calc(14px * var(--s)); }
  .route-bar { flex:1; min-width:calc(80px * var(--s)); height:calc(8px * var(--s)); border-radius:999px; background:var(--surface-3); overflow:hidden; }
  .route-bar i { display:block; height:100%; border-radius:999px; background:var(--good); }
  .route-meter span { white-space:nowrap; color:var(--muted); }
  .route-now { display:flex; flex-wrap:wrap; align-items:center; gap:calc(8px * var(--s)); }
  .route-foot .sub { max-width:62ch; }
  .abs { font-size:calc(var(--fs-sm) * var(--s)); color:var(--text); opacity:.86;
         display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .ai-slot { margin-top:calc(12px * var(--s)); }
  .ai-line { font-size:calc(var(--fs-sm) * var(--s)); padding:calc(11px * var(--s)) calc(13px * var(--s)); border-radius:var(--r-md); box-shadow:var(--sh-in-sm);
             animation:fade .3s ease both; }
  .ai-line b { color:var(--ai-text); }
  .ai-loading { display:flex; align-items:center; gap:calc(9px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid var(--accent-soft);
          border-top-color:var(--accent); animation:spin .8s linear infinite; }
  .ai-off { font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); }
  .why { font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); margin-top:calc(13px * var(--s)); }
  .why span { box-shadow:var(--sh-in-sm); padding:calc(5px * var(--s)) calc(11px * var(--s)); border-radius:999px; display:inline-block; }
  .actions { display:flex; gap:calc(9px * var(--s)); flex-wrap:wrap; margin-top:calc(15px * var(--s)); }
  .hint { position:absolute; right:20px; bottom:16px; font-size:calc(var(--fs-xs) * var(--s)); color:var(--muted);
          opacity:0; transition:opacity .2s; }
  .card:hover .hint { opacity:1; }

  /* --------------------------------------------------------------- preview */
  #preview { position:fixed; z-index:70; width:min(460px,92vw); padding:calc(18px * var(--s)); background:var(--base);
             box-shadow:var(--sh-out); border-radius:var(--r-lg);
             max-height:min(74vh,660px); display:flex; flex-direction:column;
             opacity:0; transform:translateY(8px) scale(.98); transition:opacity .16s, transform .16s; }
  /* Hidden means NOT interactive: an invisible box left where it last appeared
     would sit over the neighbouring column and swallow its hover events. */
  #preview { pointer-events:none; visibility:hidden; }
  #preview.show { opacity:1; transform:none; pointer-events:auto; visibility:visible; }
  #preview h4 { margin:0 0 calc(9px * var(--s)); font-size:calc(var(--fs-md) * var(--s)); line-height:1.44; }
  #preview .pabs { font-size:calc(var(--fs-sm) * var(--s)); overflow:auto; color:var(--muted); flex:1; padding-right:calc(8px * var(--s)); }
  #preview .phint { margin-top:calc(11px * var(--s)); font-size:calc(var(--fs-xs) * var(--s)); color:var(--accent-text); }
  .whyline { font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); margin-top:calc(13px * var(--s)); }
  .whyline span { box-shadow:var(--sh-in-sm); padding:calc(5px * var(--s)) calc(11px * var(--s)); border-radius:999px; display:inline-block; }
  .pdfbox { box-shadow:var(--sh-in); border-radius:var(--r-md); height:min(72vh,640px); overflow:hidden; margin-top:calc(6px * var(--s)); }
  .pdfbox iframe { width:100%; height:100%; border:0; background:#fff; }
  .pdfbox .ph { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;
                gap:calc(12px * var(--s)); color:var(--muted); font-size:calc(var(--fs-sm) * var(--s)); }

  /* ----------------------------------------------------------- detail page */
  .page { position:fixed; inset:0; z-index:80; overflow:auto; padding:calc(28px * var(--s)) calc(16px * var(--s)) calc(70px * var(--s)); background:var(--base);
          animation:slideIn .28s ease both; }
  /* Paper details use the same calm right-hand reading rail as Connected Papers.
     The graph/list stays visible behind it, and the rail owns its own scroll. */
  #detail.detail-page { padding:0; overflow:hidden; background:transparent; animation:none; display:flex; justify-content:flex-end; }
  /* The backdrop is a <button> (click to close), so it must shed every button look: no pill, border, padding or press. */
  #detail.detail-page .detail-scrim { position:absolute; inset:0; background:rgba(16,24,40,.16); opacity:0; transition:opacity .22s ease;
    border:0; border-radius:0; padding:0; margin:0; box-shadow:none; transform:none !important; cursor:default; }
  #detail.detail-page:not(.hidden) .detail-scrim { opacity:1; }
  #detail.detail-page .detail-panel { position:relative; z-index:1; width:min(calc(520px * var(--s)), 100vw); height:100%; margin:0; overflow:auto;
    padding:calc(28px * var(--s)) calc(34px * var(--s)) calc(44px * var(--s)); background:var(--surface-1); border-left:0;
    border-radius:var(--r-lg) 0 0 var(--r-lg); box-shadow:-8px 0 24px rgba(16,24,40,.12);
    transform:translateX(100%); transition:transform .28s cubic-bezier(.22,.8,.28,1); }
  #detail.detail-page:not(.hidden) .detail-panel { transform:translateX(0); }
  .detail-head { display:flex; align-items:center; justify-content:space-between; gap:calc(12px * var(--s)); margin-bottom:calc(18px * var(--s)); }
  .detail-head .label { margin:0; }
  .detail-close { width:calc(38px * var(--s)); height:calc(38px * var(--s)); padding:0; justify-content:center; border-radius:var(--r-md); }
  .detail-kicker { display:inline-flex; align-items:center; gap:calc(7px * var(--s)); color:var(--accent-text); font-size:calc(var(--fs-sm) * var(--s)); font-weight:650; }
  .detail-kicker::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--mark); }
  .detail-panel h2 { font-size:calc(var(--fs-2xl) * var(--s)); line-height:1.28; margin:0 0 calc(13px * var(--s)); }
  .detail-meta { display:flex; flex-wrap:wrap; align-items:center; gap:calc(7px * var(--s)) calc(12px * var(--s)); color:var(--muted); font-size:calc(var(--fs-sm) * var(--s)); }
  .detail-meta span + span { position:relative; }
  .detail-meta span + span::before { content:"·"; position:absolute; left:-9px; color:var(--line-strong); }
  .detail-actions { display:flex; flex-direction:column; gap:calc(12px * var(--s)); margin:calc(22px * var(--s)) 0 calc(25px * var(--s)); padding-bottom:calc(22px * var(--s)); border-bottom:1px solid var(--line); }
  .detail-actions .actions-main, .detail-actions .actions-more { display:flex; flex-wrap:wrap; gap:calc(10px * var(--s)); align-items:center; }
  /* The rail has two control sizes and nothing else: main (the two things you do with a paper) and small (the rest);
     buttons, links styled as buttons and the project select share the same heights. */
  #detail .detail-panel button, #detail .detail-panel a.btn, #detail .detail-panel select { box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center;
    min-height:calc(40px * var(--s)); padding:0 calc(18px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); line-height:1.2; border-radius:var(--r-md); text-decoration:none; }
  #detail .detail-panel button.tiny, #detail .detail-panel a.btn.tiny, #detail .detail-panel .detail-project-row select, #detail .detail-panel .detail-project-row button {
    min-height:calc(34px * var(--s)); padding:0 calc(14px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); }
  #detail .detail-panel button.outline { background:transparent; border:1px solid var(--accent); color:var(--accent-text); }
  #detail .detail-panel .detail-close { min-height:0; padding:0; }
  .detail-project-row { display:flex; gap:calc(8px * var(--s)); align-items:center; margin-bottom:calc(8px * var(--s)); }
  .detail-project-row select { flex:1; min-width:0; border:1px solid var(--line-strong); background:var(--surface-1); color:var(--text); }
  .detail-projects .hint { position:static; opacity:1; font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); line-height:1.6; margin-top:calc(6px * var(--s)); }
  .detail-section { padding:0 0 calc(24px * var(--s)); }
  .detail-section h3 { margin:0 0 calc(10px * var(--s)); font-size:calc(var(--fs-md) * var(--s)); }
  .detail-section .full { font-size:calc(var(--fs-md) * var(--s)); line-height:1.8; color:var(--text); opacity:.9; }

    border:0; box-shadow:none; border-radius:0; }

    padding:calc(10px * var(--s)) calc(20px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); border-radius:999px; }

  button.primary:hover, .btn.primary:hover { background:color-mix(in srgb, var(--accent) 88%, #000); border-color:transparent; }
  #readerPages.drop { outline:2px dashed var(--accent); outline-offset:-8px; }
  .saved, .badge.saved { color:var(--mark-text); }
  button.saved { color:var(--accent-text); background:var(--accent-soft); border-color:transparent; }
  /* A mark the reader has set (not interested, too hard) shows pressed; pressing it again takes it back. */
  button[data-fb][aria-pressed="true"], .card .actions button[data-fb][aria-pressed="true"] { color:var(--accent-text); background:var(--accent-soft); border-color:transparent; font-weight:600; }
  .card.is-passed h3, .card.is-passed .meta, .card.is-passed .abs, .card.is-passed .ai-slot { opacity:.5; }
  button.ghost { background:transparent; border-color:transparent; box-shadow:none; }
  button.ghost:hover { background:var(--surface-2); border-color:transparent; }
  button:focus-visible, .btn:focus-visible { outline:2px solid var(--accent-text); outline-offset:3px; }
  /* — cards — */
  .card { padding:calc(22px * var(--s)) calc(24px * var(--s)); border:0; border-radius:var(--r-lg);
    background:var(--surface-1); box-shadow:var(--sh-1); display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .card::before { display:none; }
  .card:hover { box-shadow:var(--sh-2); }
  .card:active { transform:none; }
  .card h3 { font-size:calc(var(--fs-md) * var(--s)); line-height:1.38; margin-bottom:calc(8px * var(--s)); }
  .card .actions { padding-top:calc(16px * var(--s)); margin-top:auto; gap:calc(8px * var(--s)); }
  .card .actions button { font-size:calc(var(--fs-sm) * var(--s)); padding:calc(9px * var(--s)) calc(14px * var(--s)); background:var(--surface-2); border-color:transparent; }
  .card .actions button:hover { background:var(--surface-3); }
  .card .actions button.primary { background:var(--accent); }
  /* Two groups (your verdict on the paper, and what to do with it). They share a row while both fit; when the card is
     too narrow each group takes a whole row and its buttons share it equally, so the edges always line up instead of
     the second group being left hanging on the right. The test is the content width, so it holds at every screen size. */
  .card .actions .actions-fb, .card .actions .actions-end { flex:1 1 auto; display:flex; gap:calc(8px * var(--s)); min-width:0; }
  .card .actions .actions-fb button, .card .actions .actions-end button { flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:calc(6px * var(--s)); }
  .card .actions .read-action { color:var(--accent-text); background:var(--accent-soft); }
  .card .actions .ai-action { color:var(--ai-text); }
  .card .actions .ai-action:disabled { opacity:.55; cursor:progress; }
  .card .actions .ai-action .icon { width:calc(14px * var(--s)); height:calc(14px * var(--s)); }
  .abs { color:var(--muted); line-height:1.7; opacity:1; -webkit-line-clamp:3; font-size:calc(var(--fs-sm) * var(--s)); }
  .badge, .chip { background:var(--surface-2); border:0; box-shadow:none; font-size:calc(var(--fs-xs) * var(--s)); font-weight:600; }
  .whyline { border-top:1px solid var(--line); padding-top:calc(12px * var(--s)); margin-top:calc(12px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); }
  .whyline span { background:none; border:0; padding:0; border-radius:0; box-shadow:none; }
  .ai-line { background:var(--surface-2); padding:calc(11px * var(--s)) calc(14px * var(--s)); border:0;
    border-radius:var(--r-md); box-shadow:none; font-size:calc(var(--fs-sm) * var(--s)); }
  .grid { gap:calc(14px * var(--s)); }
  .paper-topline { display:flex; align-items:center; justify-content:space-between; margin-bottom:calc(14px * var(--s)); gap:calc(12px * var(--s)); }
  .paper-number { font-size:calc(var(--fs-xs) * var(--s)); color:var(--muted); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:calc(8px * var(--s)); }
  .paper-number .icon { color:var(--accent-text); }
  .paper-title { padding:0; display:block; white-space:normal; text-align:left;
    font:inherit; color:inherit; background:none; border:0; border-radius:0; box-shadow:none; overflow-wrap:anywhere; }
  .paper-title:hover { transform:none; color:var(--accent-text); }


  /* — badges and meta — */
  .meta { font-size:calc(var(--fs-xs) * var(--s)); margin-bottom:calc(9px * var(--s)); }
  .edition { display:flex; align-items:center; gap:calc(8px * var(--s)); color:var(--muted); font-size:calc(var(--fs-sm) * var(--s)); margin-bottom:calc(12px * var(--s)); }
  .edition .live-dot { width:6px; height:6px; background:var(--mark); border-radius:50%; }
  .view-heading { display:flex; align-items:center; justify-content:space-between; gap:calc(20px * var(--s)); margin-bottom:calc(4px * var(--s)); }
  .view-heading .count { font-size:calc(var(--fs-sm) * var(--s)); color:var(--muted); white-space:nowrap; }
  .label, .brand, .refcard .rlabel, .msg .meta { letter-spacing:0; }
  main a:not(.btn) { color:var(--accent-text); font-weight:600; text-decoration:none; }
  main a:not(.btn):hover { text-decoration:underline; text-underline-offset:3px; }

  /* — inputs — */
  input[type=text], input[type=password] { background:var(--surface-1); box-shadow:none;
    border:1px solid var(--line-strong); border-radius:var(--r-lg); color:var(--text); font:inherit; padding:calc(11px * var(--s)) calc(16px * var(--s)); }
  input[type=text]:focus, input[type=password]:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .switch input { appearance:none; width:38px; height:22px; border-radius:999px; margin:0; position:relative;
    background:var(--line-strong); border:0; cursor:pointer; transition:background .18s ease; }
  .switch input::after { content:""; position:absolute; width:18px; height:18px; top:2px; left:2px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(16,24,40,.3); transition:transform .18s ease; }
  .switch input:checked { background:var(--accent); }
  .switch input:checked::after { transform:translateX(16px); background:#fff; }
  .switch input:focus-visible { outline:2px solid var(--accent-text); outline-offset:3px; }

  /* — page / detail — */
  .page { background:var(--base); }
  .page-inner { max-width:860px; padding:36px 48px; background:transparent; border:0; border-radius:0; box-shadow:none; }

  /* — chat panel — */
  .petpanel { border:0; box-shadow:var(--sh-3); background:var(--surface-1); border-radius:var(--r-lg); }
  .petpanel header { box-shadow:none; border-bottom:1px solid var(--line); padding:11px 14px; }
  .msg { border:0; box-shadow:none; border-radius:var(--r-md); }
  .msg.user { background:var(--accent); color:var(--accent-ink); }
  .msg.user .refcard { color:var(--text); }
  .msg.ai { background:var(--surface-2); }
  .msg.sys { border:none; box-shadow:none; background:transparent; }
  .fol { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .fol button { font-size:var(--fs-sm); padding:5px 11px; background:var(--surface-1); }
  .fol button:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .fol button { white-space:normal; overflow-wrap:anywhere; text-align:left; max-width:100%; }
  .refcard { border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface-2); box-shadow:none; }

  /* — toasts & misc — */
  .toast { border:1px solid var(--line); box-shadow:var(--sh-3); background:var(--surface-1); border-radius:var(--r-md); }
  /* A problem is said in words; its edge takes a muted tint. Success and AI notes need no colour. */
  .toast.warn { border-color:color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .toast.err { border-color:color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .empty { background:var(--surface-1); border:0; box-shadow:var(--sh-1); border-radius:var(--r-lg); }
  .devbanner { max-width:var(--wrap); }
  #preview { background:var(--surface-1); border:0; box-shadow:var(--sh-3); border-radius:var(--r-lg); }
  .reader .rbar { background:var(--surface-1); border-bottom:1px solid var(--line); box-shadow:none; }
  .reader .rside { border-right:1px solid var(--line); box-shadow:none; }
  .reader .pg { box-shadow:var(--sh-2); }
  /* — icon system — */
  .icon { display:inline-block; width:18px; height:18px; flex:0 0 18px; background:currentColor;
    mask:center / contain no-repeat; -webkit-mask:center / contain no-repeat; }
  .icon.book        { mask-image:url("/icons/book-open.svg");          -webkit-mask-image:url("/icons/book-open.svg"); }
  .icon.external    { mask-image:url("/icons/external-link.svg");      -webkit-mask-image:url("/icons/external-link.svg"); }
  .icon.sparkles    { mask-image:url("/icons/sparkles.svg");           -webkit-mask-image:url("/icons/sparkles.svg"); }
  .icon.library     { mask-image:url("/icons/library.svg");            -webkit-mask-image:url("/icons/library.svg"); }
  .icon.profile     { mask-image:url("/icons/sliders-horizontal.svg"); -webkit-mask-image:url("/icons/sliders-horizontal.svg"); }
  .icon.bookmark    { mask-image:url("/icons/bookmark.svg");           -webkit-mask-image:url("/icons/bookmark.svg"); }
  .icon.mode        { mask-image:url("/icons/sun-moon.svg");           -webkit-mask-image:url("/icons/sun-moon.svg"); }
  .icon.settings    { mask-image:url("/icons/settings.svg");           -webkit-mask-image:url("/icons/settings.svg"); }
  .icon.chart       { mask-image:url("/icons/chart-column.svg");       -webkit-mask-image:url("/icons/chart-column.svg"); }
  .icon.folder      { mask-image:url("/icons/folder.svg");             -webkit-mask-image:url("/icons/folder.svg"); }
  .icon.folder-open { mask-image:url("/icons/folder-open.svg");        -webkit-mask-image:url("/icons/folder-open.svg"); }
  .icon.chevron-down{ mask-image:url("/icons/chevron-down.svg");       -webkit-mask-image:url("/icons/chevron-down.svg"); }
  .icon.plus        { mask-image:url("/icons/plus.svg");               -webkit-mask-image:url("/icons/plus.svg"); }
  .icon.help        { mask-image:url("/icons/circle-help.svg");        -webkit-mask-image:url("/icons/circle-help.svg"); }
  .icon.check       { mask-image:url("/icons/check.svg");              -webkit-mask-image:url("/icons/check.svg"); }
  .icon.pages       { mask-image:url("/icons/gallery-vertical-end.svg"); -webkit-mask-image:url("/icons/gallery-vertical-end.svg"); }
  .icon.outline     { mask-image:url("/icons/list-tree.svg");          -webkit-mask-image:url("/icons/list-tree.svg"); }
  .icon.notes       { mask-image:url("/icons/notebook-pen.svg");       -webkit-mask-image:url("/icons/notebook-pen.svg"); }
  .icon.chevron-right{ mask-image:url("/icons/chevron-right.svg");     -webkit-mask-image:url("/icons/chevron-right.svg"); }

  /* — header controls — */
  .modes { box-shadow:none; padding:0; }
  #modeBtn { width:34px; height:34px; padding:calc(8px * var(--s)); border-radius:50%; }

  /* — motion — */
  button, .btn, .tab, .card {
    transition: transform .16s var(--ease-out), background .18s ease, border-color .18s ease,
                box-shadow .22s var(--ease-out), color .18s ease, opacity .18s ease;
  }
  .card { transition: box-shadow .2s var(--ease-out), border-color .18s ease; }
  .fol { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; animation:fade .18s ease both; }
  .fol button { font-size:var(--fs-sm); padding:5px 11px; background:var(--surface-1); }
  .toast { animation:slideInRight .26s var(--ease-out) both; }
  main > section:not(.hidden) { animation:viewEnter .28s var(--ease-out) both; }
  #preview.show { animation:previewIn .16s var(--ease-out) both; }
  @keyframes slideInRight { from{opacity:0;transform:translateX(16px);} to{opacity:1;transform:none;} }
  @keyframes viewEnter { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }
  @keyframes previewIn { from{opacity:0;transform:translateY(8px) scale(.98);} to{opacity:1;transform:none;} }

  /* — responsive — */
  @media (max-width:900px) {
    header.top { gap:calc(12px * var(--s)); }
    .petpanel.docked { width:310px; }
  }
  @media (max-width:700px) {
    header.top { padding:calc(12px * var(--s)) calc(16px * var(--s)); gap:calc(10px * var(--s)); }
    .right { width:100%; margin-left:0; justify-content:space-between; }
    .tabs { margin-left:auto; }
    .tab { padding:calc(7px * var(--s)) calc(10px * var(--s)); font-size:calc(var(--fs-sm) * var(--s)); }
    .tab .icon { display:none; }
    .brand { font-size:calc(var(--fs-md) * var(--s)); gap:calc(8px * var(--s)); }
    .wordmark { height:calc(22px * var(--s)); }
    main { padding:calc(20px * var(--s)) calc(16px * var(--s)) calc(70px * var(--s)); }
    .hero { padding:calc(20px * var(--s)) 0; }
    .hero h1 { font-size:calc(var(--fs-xl) * var(--s)); }
    .card { padding:calc(18px * var(--s)); }
    .card h3 { font-size:calc(var(--fs-md) * var(--s)); }
    .page-inner { padding:calc(22px * var(--s)) calc(18px * var(--s)); }
    .view-heading { align-items:flex-start; }
    .devbanner { margin:calc(10px * var(--s)) calc(16px * var(--s)) 0; border-radius:var(--r-md); }
    .petpanel.docked { position:absolute; right:12px; bottom:0; width:min(380px,calc(100% - 24px));
      height:min(60%,480px); margin:calc(12px * var(--s)); z-index:5; }
    .reader .rside { width:172px; }
    .reader .rtabs .lbl { display:none; }
    .reader .rside .thumb canvas { width:72px; }
    .reader .rbar { gap:calc(5px * var(--s)); padding:calc(8px * var(--s)); flex-wrap:wrap; }
    .reader .rbar h2 { min-width:120px; }
    #pin { width:100%; min-width:0; flex-basis:100%; }
    #toasts { left:16px; right:16px; bottom:76px; }
    .toast { max-width:100%; }
  }

  /* — large screens: the steps (--s, --wrap) are defined in theme.css; the dense library page keeps --s:1 — */
  #organizationRoot { --s:1; }
  /* The demo project is read-only for the person's data: whatever would fetch, call a model, read a PDF or edit is simply not shown. */
  html.pt-demo #btnRefresh, html.pt-demo #refreshRecord, html.pt-demo #projectNew,
  html.pt-demo .ai-action, html.pt-demo .detail-projects,
  html.pt-demo #organizationRoot [data-action="suggest"],
  html.pt-demo #organizationRoot [data-action="export"], html.pt-demo #organizationRoot .org-notes,
  html.pt-demo #organizationRoot .org-note-mark, html.pt-demo #organizationRoot [data-action="read"],
  html.pt-demo #organizationRoot [data-action="membership"], html.pt-demo #organizationRoot [data-action="paper-membership"] { display:none !important; }
  /* Reading is on for the one paper that carries the demo reading material (a local PDF in the sandbox); the assistant needs no
     page-image or longer-context switches because nothing is sent. */
  html.pt-demo .read-action:not([data-read="https://doi.org/10.48550/arxiv.1706.03762"]),
  html.pt-demo #dRead:not([data-key="https://doi.org/10.48550/arxiv.1706.03762"]),
  html.pt-demo #petImg, html.pt-demo #petPanel .switch, html.pt-demo #petLog .msg.sys .fol { display:none !important; }   /* the general starter questions would all get the one general reply */
  .ai-demo-tag { color:var(--muted, inherit); }
  @media (min-width:1700px) { .grid { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
  @media (min-width:2800px) { .grid { grid-template-columns:repeat(4, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: reduce) { *{animation:none!important;transition:none!important;} }

<script>
const $ = (s) => document.querySelector(s);
const state = { triagingKeys:new Set(), aiFailures:{}, view:'today', cards:[], summaries:{}, profile:null, stats:null, insights:null, triaging:false, version:'?',
                currentProject:null, projects:[], realProjects:[], demo:null, maintained:new Set() };
const DEMO_ID = 'pt-demo';
const inDemo = () => state.currentProject === DEMO_ID;   // the demo project exists only during the guided tour; its id is never stored

// ------------------------------------------------------------ appearance
function setMode(m){ document.documentElement.dataset.mode = m; localStorage.setItem('pt-mode', m);
  window.dispatchEvent(new CustomEvent('pt-mode', { detail:m })); }
setMode(localStorage.getItem('pt-mode') || (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  catch (e) { toast(e.message, 'err'); }

// ------------------------------------------------------------------ utils
let demoBlocked = null;   // {message, at}: the demo's own "not here" notice for the request that just failed
// The caller of that request then toasts its own error carrying the same text: drop that one (once, within a moment), nothing else.
function suppressDemoDuplicate(msg, kind) {
  if (kind === 'ok' || kind === 'ai' || !demoBlocked) return false;
  const mine = demoBlocked; demoBlocked = null;
  return Date.now() - mine.at < 2500 && String(msg).includes(mine.message);
}
function toast(msg, kind='ok', ms=3600) {
  if (suppressDemoDuplicate(msg, kind)) return;
  const el = document.createElement('div'); el.className = `toast ${kind}`; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),250); }, ms);
}
// While the guided tour shows the demo project every request asks for it with this header (settings, update and tour state ignore it).
function demoHeaders() { return inDemo() ? { 'X-PT-Demo': '1' } : {}; }
async function api(path, body) {
  const res = await fetch(path, body ? {method:'POST',headers:{'Content-Type':'application/json', ...demoHeaders()},body:JSON.stringify(body)} : {headers:demoHeaders()});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 403 && data.reason_code === 'demo_readonly') { toast(data.error, 'warn'); demoBlocked = { message: data.error, at: Date.now() }; }
    throw new Error(data.error || `HTTP ${res.status}`);
  }
  return data;
}
function mdInline(t) {
  return t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function md(text) {
  const lines = esc(text || '').split('\n');
  let html = '', inCode = false, list = [];
  const flush = () => { if (list.length) { html += '<ul>' + list.map((x) => `<li>${x}</li>`).join('') + '</ul>'; list = []; } };
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) {
      if (inCode) { html += '</code></pre>'; inCode = false; } else { flush(); html += '<pre><code>'; inCode = true; }
      continue;
    }
    if (inCode) { html += raw + '\n'; continue; }
    const li = raw.match(/^\s*[-*]\s+(.*)$/);
    if (li) { list.push(mdInline(li[1])); continue; }
    flush();
    const h = raw.match(/^#{1,4}\s+(.*)$/);
    if (h) { html += `<h4>${mdInline(h[1])}</h4>`; continue; }
    if (!raw.trim()) continue;
    html += `<p>${mdInline(raw)}</p>`;
  }
  flush();
  if (inCode) html += '</code></pre>';
  return html;
}
const esc = (s) => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderStats() {
  const proj = state.projects?.find(p => p.id === state.currentProject);
  $('#projectName').textContent = proj?.name || '研究工作区';
}

// ------------------------------------------------------------------ cards
function aiSlot(c) {
  const text = state.aiFailures?.[`${state.currentProject || 'default'}:${c.key}`];
  const failure = text ? `<div class="sub err" role="alert">${esc(text)} <a href="/settings.html">打开设置</a></div>` : '';
  if (c.summary) return `<div class="ai-line"><b>${c.summary.model === 'demo' ? 'AI 速览 · 演示' : 'AI 速览'}</b> <span data-no-i18n>${esc(c.summary.one_liner || '')}</span>
    ${c.summary.why_relevant ? `<div class="sub"><span class="ai-label">相关：</span><span data-no-i18n>${esc(c.summary.why_relevant)}</span></div>` : ''}</div>${failure}`;
  if (state.triaging || state.triagingKeys.has(c.key)) return `<div class="ai-loading"><span class="spin"></span>AI 正在速览…</div>`;
  return failure;
}
// The learning map: where the reader stands and why each card was chosen. Plain words, no counts of what was missed.
// How many of today's papers are exploration (outside what can be read now), and why there are none when there are none.
function dailyButtonText() {
  if (state.route?.enabled !== false && state.route?.progress_verification_deferred) return '核验后生成推荐';
  return state.route?.enabled !== false && state.route?.goal_status === 'completed' ? '生成今日发现' : '生成今日推荐';
}
function renderRoute(route) {
  const panel = $('#routePanel');
  if (!panel) return;
  $('#btnDaily').textContent = dailyButtonText();
  if (window.PAGETIDE_ROUTE_BETA === false) {
    // Learning-map mode is a beta setting, off by default: hotspot mode needs no panel at all.
    panel.hidden = true;
    panel.innerHTML = '';
    return;
  }
  const link = state.currentProject ? `/route.html?project_id=${encodeURIComponent(state.currentProject)}` : '/route.html';
  const seg = (on) => `<div class="seg" role="radiogroup" aria-label="推荐方式"><button type="button" role="radio" aria-checked="${on}" data-route-mode="route">按学习图推荐</button><button type="button" role="radio" aria-checked="${!on}" data-route-mode="off">热点模式</button></div>`;
  if (!route) {
    panel.hidden = !state.currentProject;
    panel.innerHTML = state.currentProject ? `<div class="route-head"><div class="route-title"><strong>学习图</strong></div><a class="btn" href="${link}">搭一张学习图</a></div>` : '';
    return;
  }
  panel.hidden = false;
  if (route.enabled === false) {
    panel.innerHTML = `<div class="route-head"><div class="route-title"><strong>学习图</strong></div>${seg(false)}<a class="btn" href="${link}">查看学习图</a></div>`;
    return;
  }
  const goalDone = route.goal_done ?? route.done, goalTotal = route.goal_total ?? route.total;
  const pct = goalTotal ? Math.round(100 * (goalDone || 0) / goalTotal) : 0;
  const names = (route.frontier || []).map((f) => `<span class="kw"><span class="kw-v" data-no-i18n>${esc(f.name)}</span></span>`).join('');
  panel.innerHTML = `<div class="route-head"><div class="route-title"><strong>学习图</strong></div>${seg(true)}<a class="btn" href="${link}">查看学习图</a></div>
    <div class="route-meter"><div class="route-bar" role="img" aria-label="${goalDone} / ${goalTotal}"><i style="width:${pct}%"></i></div><span>${goalDone} / ${goalTotal}</span></div>
    ${names ? `<div class="route-now">${names}</div>` : ''}`;
}
$('#routePanel').addEventListener('click', async (event) => {
  const choice = event.target.closest('[data-route-mode]');
  if (!choice || choice.getAttribute('aria-checked') === 'true' || !state.currentProject) return;
  const buttons = [...document.querySelectorAll('#routePanel [data-route-mode]')]; buttons.forEach((b) => { b.disabled = true; });
  try {
    await api('/api/route', { action: 'mode', project_id: state.currentProject, mode: choice.dataset.routeMode });
    await load();
  } catch (e) { toast(`没能切换推荐方式：${e.message}`, 'err'); buttons.forEach((b) => { b.disabled = false; }); }
});
const ROUTE_KINDS = { route: '路径', remedial: '补基础', explore: '探索', explore_new: '探索 · 新方向', watch: '新进展' };
const ROUTE_TITLES = {
  route: '来自学习图',
  remedial: '先补一篇基础',
  explore: '探索',
  explore_new: '探索新方向',
  watch: '新进展',
};
function routeBadge(c) {
  if (!c.route) return '';
  const kind = ROUTE_KINDS[c.route.kind];
  if (!kind) return '';
  return `<span class="kw kw-${esc(c.route.kind)}" title="${esc(ROUTE_TITLES[c.route.kind])}"><span class="kw-k">${kind}</span>${c.route.name ? `<span class="kw-v" data-no-i18n>${esc(c.route.name)}</span>` : ''}</span>`;
}
const PDF_BADGES = {
  direct: ['直链 PDF', '可直接下载'],
  page: ['PDF 在原文页', 'PageTide 拿不到这篇的 PDF 文件，原文页面上有。在那里下载后拖进阅读器即可。'],
  none: ['无 PDF 来源', '可自行下载后附加'],
};
const pdfBadge = (status) => {
  const [text, tip] = PDF_BADGES[status] || PDF_BADGES.none;
  // The PDF lives elsewhere: an outward arrow, not a book; what to do is in the tooltip, not on the label (owner, 2026-10-26).
  const icon = status === 'page' ? 'external' : 'book';
  return `<span class="pdf-tag pdf-${PDF_BADGES[status] ? status : 'none'}" title="${tip}"><i class="icon ${icon}" aria-hidden="true"></i>${text}</span>`;
};

/* A collected exploration paper: offer, once, to let the AI judge whether it is a new direction. Nothing is sent until the button is clicked. */
const isExploration = (c) => Boolean(c.route && /^explore/.test(c.route.kind || ''));
function judgeAskHTML(c) {
  const busy = c.judgeBusy || Boolean(state.judgeJobs && state.judgeJobs.has(state.currentProject));
  return `<div class="judge-ask"><span>让 AI 看看这是不是一个新方向？</span>`
    + `<button class="tiny" data-judge="ask" data-key="${esc(c.key)}" ${busy ? 'disabled' : ''} title="调用 AI；不发送笔记和画像">${busy ? '判断中…' : '判断'}</button>`
    + `<button class="tiny" data-judge="later" data-key="${esc(c.key)}">以后再说</button></div>`;
}
function judgeSummary(results) {
  return (results || []).map((r) => {
    const name = r.name ? `「${r.name}」` : '';
    if (r.verdict === 'new') return `${name}已成为学习提议`;
    if (r.verdict === 'join') return `并入了潜在方向${name}`;
    if (r.verdict === 'covered') return `${r.nearest ? `「${r.nearest}」` : '学习图里'}已覆盖`;
    if (r.verdict === 'declined') return `${name || '这个方向'}已设为不再提示`;
    if (r.verdict === 'full') return '潜在方向已满，请先处理一些';
    if (r.verdict === 'unusable') return 'AI 回复不完整，可再点一次';
    return 'AI 没看出来';
  }).join('；');
}
async function doJudge(key) {
  const projectId = state.currentProject, card = state.cards.find(c => c.key === key);
  const jobs = state.judgeJobs || (state.judgeJobs = new Set());
  if (!projectId || jobs.has(projectId) || (card && card.judgeBusy)) return;
  const prompts = state.cards.filter(c => c.judgeAsk || c === card);
  const generations = new Map(prompts.map(c => [c, c.judgeAskGeneration || 0]));
  const clearPrompt = c => { if ((c.judgeAskGeneration || 0) === generations.get(c)) c.judgeAsk = false; };
  jobs.add(projectId);
  prompts.forEach(c => { c.judgeBusy = true; }); renderCards();
  try {
    const out = await api('/api/route', { action: 'direction-judge', project_id: projectId });
    if (state.currentProject !== projectId) return;
    const progress = PTRoute.judgeProgress(out);
    if (progress) {
      toast(progress.message, progress.warning ? 'warn' : 'ok');
      if (progress.complete) prompts.forEach(clearPrompt);
    } else if (!out.ok) toast(`未得到判断：${out.reason || 'AI 没有给出判断'}`, 'warn');
    else { toast(judgeSummary(out.results), 'ok'); if (card) clearPrompt(card); }
  } catch (e) { if (state.currentProject === projectId) toast(e.message, 'err'); }
  finally {
    jobs.delete(projectId); prompts.forEach(c => { c.judgeBusy = false; });
    if (state.currentProject === projectId) renderCards();
  }
}
function workTypeLabel(value) {
  return ({review:'综述', 'conference-paper':'会议论文', article:'期刊文章', preprint:'预印本'})[value] || value || '';
}
function cardHTML(c, i) {
  const v = window.PTMarks.view(c), saved = v.saved;
  const exploring = c.route && /^explore/.test(c.route.kind || '');
  return `
  <article class="card${exploring ? ' is-explore' : ''}${v.irrelevant ? ' is-passed' : ''}" data-key="${esc(c.key)}" style="animation-delay:${i*50}ms">
    <h3><button class="paper-title" data-no-i18n data-tex>${esc(c.title)}</button></h3>
    <div class="meta">
      <span>${esc(c.published || '')}</span><span>${esc(c.source || '')}</span>
      ${String(c.key || '').startsWith('cnki:') ? '<span class="src-cnki">知网</span>' : ''}
      ${c.work_type ? `<span>${esc(workTypeLabel(c.work_type))}</span>` : ''}
      ${c.pdf_status === 'page' ? pdfBadge(c.pdf_status) : ''}
      ${routeBadge(c)}
    </div>
    <div class="abs">${c.abstract ? `<span data-no-i18n data-tex>${esc(c.abstract)}</span>${c.abstract_partial ? '…' : ''}` : '暂无摘要'}</div>
    <div class="ai-slot">${aiSlot(c)}</div>
    ${c.judgeAsk ? judgeAskHTML(c) : ''}
    <div class="actions">
      <span class="actions-fb">
        <button class="tiny ${saved ? 'saved' : ''}" data-fb="${saved ? 'unsave' : 'useful'}" data-key="${esc(c.key)}" aria-pressed="${saved}">
          <i class="icon bookmark" aria-hidden="true"></i>${saved ? '已收藏' : '收藏'}</button>
        ${window.PTMarks.buttonsHTML(c, esc)}
      </span>
      <span class="actions-end">
        <button class="tiny ai-action" data-ai="${esc(c.key)}" ${state.triaging || state.triagingKeys.has(c.key) ? 'disabled' : ''} title="${c.summary ? '让 AI 重新速览这一篇（1 次调用，只发送这一篇的标题和摘要）' : '让 AI 速览这一篇（1 次调用，只发送这一篇的标题和摘要）'}"><i class="icon sparkles" aria-hidden="true"></i>${c.summary ? '重新速览' : 'AI 速览'}</button>
        <button class="tiny read-action" data-read="${esc(c.key)}" data-title="${esc(c.title)}"><i class="icon book" aria-hidden="true"></i>阅读 PDF</button>
      </span>
    </div>
  </article>`;
}
function renderCards() {
  if (state.view !== 'today') return;
  // Rebuilding the cards invalidates any hover state; otherwise a stale hoverKey
  // makes the next hover on the same card silently do nothing.
  clearTimeout(hoverTimer);
  hoverKey = null;
  hidePreview();
  $('#cards').innerHTML = state.cards.length ? state.cards.map(cardHTML).join('')
    : `<div class="empty">暂无推荐论文</div>`;
}
let profileUI;
function renderProfile() {
  if (!profileUI) profileUI = PTProfile.create($('#view-profile'), {
    api, refresh:load, openPaper:openDetail, notify:toast,
    projectName:()=>state.projects.find(p=>p.id===state.currentProject)?.name || '当前项目'
  });
  if (state.insights?.error) {
    $('#view-profile').innerHTML = '<h1>画像暂未加载</h1><p class="sub">本地数据读取失败，请重试。</p><button id="retryProfile">重试</button>';
    $('#retryProfile').onclick=()=>load().catch(e=>toast(e.message,'err'));
    return;
  }
  if (state.insights) profileUI.render(state.insights, state.profile,
    state.projects.find(p=>p.id===state.currentProject)?.name || '当前项目');
}

// ------------------------------------------------------------------ projects
// The switcher lists the person's projects, plus the demo while the tour is on. The demo is never stored as the current project.
function syncProjects() {
  state.projects = [...state.realProjects, ...(window.PTTour.current() && state.demo ? [state.demo] : [])];
}
function applyDemoMode() {
  const on = inDemo();
  document.documentElement.classList.toggle('pt-demo', on);
  const auto = $('#autoAi');
  if (auto && on) { auto.checked = true; const label = auto.closest('label'); if (label) label.hidden = true; }
  else if (auto) { const label = auto.closest('label'); if (label) label.hidden = false; }

function rememberProject(id) { if (id && id !== DEMO_ID) localStorage.setItem('pt-current-project', id); }
async function loadProjects() {
  const data = await api('/api/projects');
  state.realProjects = (data.projects || []).filter(p => p.id !== DEMO_ID);
  state.demo = data.demo || null;
  syncProjects();

  // If no current project set, use first one
  if (state.currentProject && !state.projects.some(p => p.id === state.currentProject)) {
    state.currentProject = null;
  }
  if (!state.currentProject && state.realProjects.length > 0) {
    state.currentProject = state.realProjects[0].id;
    rememberProject(state.currentProject);
  }

  renderProjectSelector();
}

function renderProjectSelector() {
  const current = state.projects.find(p => p.id === state.currentProject);
  $('#currentProjectName').textContent = current?.name || '选择项目';
  $('#projectEdit').href = current && !current.demo ? `/project.html?project_id=${encodeURIComponent(current.id)}` : '/project.html';
}
$('#projectEdit').addEventListener('click', (e) => {
  if (!inDemo()) return;

let tourLeaveTo = null;   // where to go once the tour has been ended by leaving the demo (a real project, the creation page)
async function leaveDemo(url) {
  if (!window.PTTour.current()) { window.location.href = url; return; }
  tourLeaveTo = url;
  await window.PTTour.skip();
}

async function switchProject(projectId) {
  if (projectId !== DEMO_ID && window.PTTour.current()) { rememberProject(projectId); await leaveDemo('/'); return; }   // leaving the demo for a real project ends the tour
  closeDetail();
  if (profileUI) profileUI.invalidate();
  state.currentProject = projectId;
  applyDemoMode();
  showTriageFailure(null, null, projectId);
  rememberProject(projectId);
  renderProjectSelector();
  window.PTOrganization?.reset?.().catch?.(() => {});   // the library page follows the project
  await load();
  if (state.view === 'library') await refreshStats();
  autoMaintain();
}

const projectSwitcher = window.ProjectSwitcher.mount({
  root: $('#projectSwitcher'),
  button: $('#projectBtn'),
  getProjects: () => state.projects,
  getCurrent: () => state.currentProject,
  onSelect: id => switchProject(id),
  onCreate: () => { leaveDemo('/project_creation.html'); },
  onEdit: p => { window.location.href = `/project.html?project_id=${encodeURIComponent(p.id)}`; },
  // The PDF reader zooms with the same pinch, so it never opens the overview.
  pinchIgnore: '.org-graph, #reader, .pdfbox',

// ------------------------------------------------------------------ load
function usageLabel(u) {
  if (!u) return '';
  // Confirmed use only: an unconfirmed call is held at its maximum (a whole answer's room), which is not spending.
  const tokens = typeof u.tokens === 'number' ? Math.max(0, u.tokens - (Number(u.reserved_tokens) || 0)).toLocaleString() : '—';
  const ceiling = u.ceiling != null && Number.isFinite(Number(u.ceiling)) ? Number(u.ceiling).toLocaleString() : null;
  const pending = u.tokens_known === false || Number(u.pending_reservations) > 0 || u.usage_unknown || u.usage_reserved || Number(u.pending_requests) > 0 || Number(u.unknown_requests) > 0;
  return [ceiling == null ? `今日 ${tokens} token` : `今日 ${tokens} / ${ceiling} token`,
    u.dev ? '测试模式独立账本' : '',pending ? '另有用量未确认' : ''].filter(Boolean).join(' · ');
}
async function load() {
  const projectAtStart = state.currentProject;
  const params = state.currentProject ? `?project_id=${encodeURIComponent(state.currentProject)}` : '';
  const data = await api(`/api/home${params}`);
  if (state.currentProject !== projectAtStart) return;
  state.version = data.server_version || '?';
  state.usage = data.usage || null;
  state.devMode = Boolean(data.dev_mode);
  state.provider = data.provider || null;
  const aiReady = Boolean(state.provider && state.provider.configured);
  const autoAi = $('#autoAi');
  if (autoAi && inDemo()) autoAi.checked = true;
  if (autoAi) {
    autoAi.title = aiReady ? '' : '尚未配置 API';
  }
  const banner = document.getElementById('devbanner');
  banner.style.display = state.devMode ? 'block' : 'none';
  if (state.devMode) {

// Opening-time upkeep: the server refreshes the candidate pool and builds today's batch when they are due.
// It never starts an AI summary, never counts what was missed, and a failure leaves the page as it was.
function fetchedText(fetched, fresh) {   // "抓到 33 篇，新 10 篇" / "抓到 33 篇，没有新论文"
  return fresh > 0 ? `抓到 ${fetched} 篇，新 ${fresh} 篇` : `抓到 ${fetched} 篇，没有新论文`;
}
function fetchedHint(fetched, fresh, label) {   // today's list is already made: say where the new papers will come from
  return `抓到 ${fetched} 篇，新 ${fresh} 篇，点「${label}」查看`;
}
function refreshRecordText(rec) {   // the last successful fetch, in the person's local time
  const at = new Date(rec && rec.at);
  if (!rec || isNaN(at)) return '';
  const two = (n) => String(n).padStart(2, '0');
  const year = at.getFullYear() === new Date().getFullYear() ? '' : `${at.getFullYear()}-`;   // only a record from an earlier year needs one
  const when = `${year}${two(at.getMonth() + 1)}-${two(at.getDate())} ${two(at.getHours())}:${two(at.getMinutes())}`;
  return `最近抓取 ${when} · ${fetchedText(rec.fetched || 0, rec.new_to_project || 0)}`;
}

// ------------------------------------------------------------- 知网 (CNKI), ADR 0045
// After a refresh the desktop app also searches CNKI in its own window. Every batch it reads goes straight to the server, so
// leaving or reloading the page loses nothing already read; a reloaded page picks the run up again (cnkiResume).
// state.cnkiRunning: a 知网 run is being followed by this page (renderMaintenance shows only its line meanwhile).
async function cnkiIngest(projectId, items, problem) {
  let gained = 0;
  for (let i = 0; i < items.length || (i === 0 && problem); i += 100) {
    const r = await api('/api/cnki/ingest', {project_id: projectId, items: items.slice(i, i + 100), ...(problem ? {problem} : {})});
    gained += r.new_to_project || 0;
  }
  return gained;
}
async function cnkiFollow(projectId, job, attempt = 0) {
  state.cnkiRunning = true;
  if ($('#refreshRecord')) $('#refreshRecord').hidden = true;
  let busy = false;
  const note = $('#maintainNote');
  let gained = 0;
  const handlers = {
    onItems: async (items) => { gained += await cnkiIngest(projectId, items); },
    onVerification: (asking) => { if (asking) toast('知网需要验证：请在弹出的知网窗口里滑一下拼图', 'warn', 8000); },
    onProgress: (poll) => { if (note && poll.state !== 'done') note.textContent = gained ? `知网：已加入 ${gained} 篇，后台继续处理…` : '知网：后台处理中…'; },
  };
  try {
    const problem = job ? await window.PTCnki.run(job, handlers) : await window.PTCnki.follow(handlers);
    busy = problem === 'busy' && !!job;           // another job started in between: try again, never skip the day's part
    if (problem && problem !== 'busy') { await cnkiIngest(projectId, [], problem).catch(() => {}); toast(window.PTCnki.problemText(problem), 'warn'); }
    else if (!problem) toast(gained ? `知网：新加入 ${gained} 篇` : '知网：没有新论文', 'ok');
  } catch (e) { toast(`知网：${e.message}`, 'warn'); }
  finally {
    state.cnkiRunning = false;
    if (note) note.textContent = '';
    if (state.currentProject === projectId) await load().catch(() => {});
  }
  if (busy && attempt < 10) setTimeout(() => cnkiRefresh(projectId, attempt + 1), 20000);
}
// Starts the 知网 part of a refresh without waiting for it. True when 知网 will report on this refresh itself (it started, is
// already running, or will retry shortly): the caller then leaves the result toast to it.
async function cnkiRefresh(projectId, attempt = 0) {
  if (!window.PTCnki?.available() || inDemo() || !projectId) return false;
  if (state.cnkiRunning) return true;
  let plan;
  try { plan = await api(`/api/cnki/plan?project_id=${encodeURIComponent(projectId)}`); } catch (e) { return false; }
  if (!plan.enabled) return false;
  // Another CNKI job (a full abstract, a creation search) is running: try again shortly instead of skipping the day's part.
  const other = await window.PTCnki.current();
  if (other && (other.state === 'running' || other.state === 'verification')) {
    if (attempt < 10) setTimeout(() => cnkiRefresh(projectId, attempt + 1), 20000);
    return attempt < 10;
  }
  cnkiFollow(projectId, {mode: 'refresh', tag: 'refresh:' + projectId, queries: plan.queries, known: plan.known,
                         since: plan.since, max_new: plan.max_new}, attempt);
  return true;
}
// A 知网 paper was stored with CNKI's results-page snippet. When the person opens it, the CNKI window reads its detail page
// (a few seconds) and the full abstract replaces the snippet, in the library and in the open panel.
async function cnkiFullAbstract(d, stillOpen) {
  if (!window.PTCnki?.available() || inDemo()) return;
  // The line under the abstract says what is happening; it goes away once the full text is in.
  const status = (message, working = false) => {
    const line = stillOpen() && $('#detail .cnki-full');
    if (!line) return;
    if (!message) { line.remove(); return; }
    line.replaceChildren();
    if (working) { const spin = document.createElement('span'); spin.className = 'spin'; spin.setAttribute('aria-hidden', 'true'); line.append(spin); }
    line.append(message);
  };
  const read = [];
  let problem = null;
  // The CNKI window does one job at a time. While a refresh is fetching (about a minute), the read waits for it instead of
  // giving up; it is stored even if the panel was closed meanwhile.
  for (let attempt = 0; attempt < 100; attempt++) {
    problem = await window.PTCnki.run({mode: 'detail', targets: [d.cnki.target]}, {
      onItems: async (items) => { read.push(...items); },
      onVerification: (asking) => { if (asking) toast('知网需要验证：请在弹出的知网窗口里滑一下拼图', 'warn', 8000); },
    }).catch(() => 'unavailable');
    if (problem !== 'busy' || read.length) break;
    status('知网正在后台抓取，抓完就读取完整摘要…', true);
    await new Promise(resolve => setTimeout(resolve, 3000));
  }
  if (!read.length) { status('暂时读不到完整摘要，这里是知网的摘要片段'); return; }
  try {
    const r = await api('/api/cnki/abstract', {key: d.key, item: read[0]});
    if (r.updated) {
      const card = state.cards?.find(c => c.key === d.key);            // the card and its hover preview lose their "…" too
      if (card) {
        card.abstract = r.abstract; card.abstract_partial = false;
        const abs = document.querySelector(`.card[data-key="${CSS.escape(d.key)}"] .abs`);
        if (abs) { abs.replaceChildren(Object.assign(document.createElement('span'), {textContent: r.abstract})); }
      }
      const box = $('#detail .abstract-text');
      if (stillOpen() && box) { box.textContent = r.abstract; box.parentElement?.classList.remove('cut'); window.PTMath?.render?.(box); }
    }
    status(r.updated || !r.abstract_partial ? '' : '暂时读不到完整摘要，这里是知网的摘要片段');
  } catch (e) { status('暂时读不到完整摘要，这里是知网的摘要片段'); }
}
async function cnkiResume() {
  if (!window.PTCnki?.available() || inDemo() || state.cnkiRunning) return;
  const run = await window.PTCnki.current();

async function doFeedback(key, action, opts = {}) {
  const project = state.currentProject ? { project_id: state.currentProject } : {};
  const said = { irrelevant: '不感兴趣', too_hard: '太难', understood: '已读懂' }[action] || action;   // "已读懂" is recorded from the library, on a saved paper
  const undo = !!opts.undo && (action === 'irrelevant' || action === 'too_hard');
  let stored = null;   // the stored marks and library state the server answers with; they win over any guess
  if (action === 'unsave') {
    await api('/api/unsave', { key, ...project });
    toast('已取消收藏', 'warn');
  } else if (undo) {
    // Pressed again: take the mark back. A not-interested label is one record (undo by id); a difficulty mark is retracted.
    const r = action === 'irrelevant'
      ? await api('/api/undo', { feedback_id: Number(opts.feedbackId), ...project })
      : await api('/api/feedback', { key, action, retract: true, ...project });
    stored = r.state || null;
    // A learning-map revision can turn the press into a fresh confirmation instead of a take-back: say what happened.
    toast(r.reconfirmed ? `已记录：${said}` : `已撤销：${said}`, 'ok');
  } else {
    const r = await api('/api/feedback', { key, action, ...project });
    stored = r.state || null;
    const alsoUnsaved = !!r.unsaved;   // the server took a saved paper out of the library in the same commit as the label
    toast(r.saved ? '已收藏'
          : action === 'understood' ? '已记录：已读懂'
          : alsoUnsaved ? '已记录：不感兴趣，已取消收藏'
          : `已记录：${said}`,
          r.saved || r.interest_changed || action === 'understood' ? 'ok' : 'warn');
  }
  const card = state.cards.find(c => c.key === key);
  if (card) {
    if (action === 'unsave') { card.saved = false; card.feedback = null; }
    else if (action === 'useful') { card.saved = true; card.feedback = 'useful'; }
    if (action === 'unsave' || action === 'irrelevant') {
      card.judgeAskGeneration = (card.judgeAskGeneration || 0) + 1;
      card.judgeAsk = false;
    }
    if (action === 'irrelevant') { card.feedback = undo ? null : 'irrelevant'; if (!undo) card.saved = false; }
    if (action === 'understood' || action === 'too_hard') card.familiarity = undo ? null : action;   // a familiarity label never replaces the interest one
    if (action === 'useful' && state.route && state.route.graph && state.currentProject) {
      card.judgeAskGeneration = (card.judgeAskGeneration || 0) + 1;
      card.judgeAsk = true;   // offered, not sent; this interest must survive an older judgment job
    }
    if (stored) Object.assign(card, { feedback: stored.feedback, feedback_id: stored.feedback_id, familiarity: stored.familiarity, saved: stored.saved });
  }
  renderCards();
  if (state.view === 'library') await refreshStats();
}

}
