    ? (offered.find(p => p && typeof p.url === 'string' && p.url.startsWith('https://')) || {}).url || tried[0] : null;
  const links = offered.filter(p => p && typeof p.url === 'string' && p.url.startsWith('https://')).slice(0, 3)
    .map((p, i) => `<a class="btn tiny${i || inAppUrl ? '' : ' primary'}" href="${esc(p.url)}" target="_blank" rel="noreferrer">${label(p)}</a>`).join('');
  box.innerHTML = `<div class="rload pdf-fail"><div>${esc(pdfReason(result.reason))}</div>
    <div class="pdf-fail-actions">${inAppUrl ? '<button type="button" class="btn tiny primary" data-in-app>在应用里下载</button>' : ''}${links}${project === 'pt-demo' ? '' : '<label class="btn tiny">选择或拖入 PDF<input type="file" accept="application/pdf,.pdf" hidden></label>'}</div>
    <div class="pdf-fail-note"></div></div>`;
  const input = box.querySelector('input[type=file]') || document.createElement('input'), note = box.querySelector('.pdf-fail-note');
  const attach = async (file) => {
    if (!file || !current()) return;
    if (!(file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''))) { note.textContent = '请选择 PDF 文件'; return; }
    note.textContent = '正在附加…';
    try {
      const response = await fetch('/api/seeds/pdf', { method: 'POST', body: file,
        headers: { 'Content-Type': 'application/pdf', 'X-Filename': encodeURIComponent(file.name) } });
      const uploaded = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(uploaded.error || `HTTP ${response.status}`);
      if (!current()) return;
      await api('/api/pdf/attach', { key, pdf_id: uploaded.pdf_id });
      if (current()) openReader(key, title, project);
    } catch (e) { note.textContent = `附加失败：${e.message}`; }
  };
  input.onchange = () => attach(input.files[0]);
  const inApp = box.querySelector('[data-in-app]');
  if (inApp) inApp.onclick = async () => {
    const invoke = window.__TAURI_INTERNALS__.invoke;
    inApp.disabled = true;
    try { await invoke('pdf_window_open', { key, url: inAppUrl }); }
    catch (e) { note.textContent = `没能打开下载窗口：${e}`; inApp.disabled = false; return; }
    note.textContent = '已打开下载窗口：在那里打开这篇论文的 PDF（遇到验证就按页面提示完成），PDF 一出现就会自动加入。';
    // Some sites never hand the PDF over (WebKit runs no script in some PDF documents): after a while, say how to do it by hand.
    const MANUAL = '有些网站在应用里拿不到 PDF：关掉下载窗口，点“原文页面”在浏览器里下载，再拖到这里或点“选择或拖入 PDF”。';
    let waited = 0;
    while (true) {
      await new Promise(r => setTimeout(r, 1000));
      if ((waited += 1) === 20) note.textContent = MANUAL;
      if (!current()) { invoke('pdf_window_cancel', { key }).catch(() => {}); return; }     // the reader moved on: close its window
      let status;
      try { status = await invoke('pdf_window_poll'); } catch (e) { status = { state: 'failed' }; }
      if (status.state === 'received' && status.key === key) {
        let bytes;
        try { bytes = await invoke('pdf_window_take', { key }); }
        catch (e) { note.textContent = '没有拿到 PDF，可以再试一次，或点“原文页面”在浏览器里下载后拖到这里。'; inApp.disabled = false; return; }
        return attach(new File([bytes], 'paper.pdf', { type: 'application/pdf' }));
      }
      if (status.state !== 'open') {
        note.textContent = status.state === 'closed' ? '下载窗口已关闭，没有拿到 PDF。可以点“原文页面”在浏览器里下载，再拖到这里。' : '没有拿到 PDF，可以再试一次，或点“原文页面”在浏览器里下载后拖到这里。';
        inApp.disabled = false;
        return;
      }
    }
  };
  box.ondragover = event => { event.preventDefault(); box.classList?.add('drop'); };
  box.ondragleave = () => box.classList?.remove('drop');
  box.ondrop = event => { event.preventDefault(); box.classList?.remove('drop'); return attach(event.dataTransfer?.files?.[0]); };
}

async function openReader(key, title, project = state.currentProject) {
  window.PTSetContext(key, title, project);
  const epoch = ++R.epoch, current = () => epoch === R.epoch && R.key === key;
  if ($('#reader').classList.contains('hidden')) readerFocus = document.activeElement;
  setReference(null);
  setAttachPage(false);   // a pending 附本页图 belongs to the paper it was pressed on
  const box = $('#readerPages'), reader = $('#reader');
  closeNote(); R.notes = [];
  $('#readerTitle').textContent = title || '';
  $('#readerInfo').textContent = '';
  box.innerHTML = '<div class="rload"><span class="spin"></span>加载中…</div>';
  box.ondragleave = box.ondragover = box.ondrop = null; box.classList.remove('drop');   // an earlier failure's drop target ends here
  $('#readerThumbs').innerHTML = ''; $('#readerOutline').innerHTML = ''; $('#readerNotes').innerHTML = '';
  reader.classList.remove('hidden');
  reader.classList.add('side');   // page thumbnails visible by default, like the native viewer
  document.body.classList.add('reader-open');
  dockPanel(true);
  lockReaderBackground(); $('#readerBack').focus();
  R.side = true;
  if (R.observer) { R.observer.disconnect(); R.observer = null; }
  R.doc = null; R.pages = []; R.scale = null; R.fit = true; R.jobs = new Map(); R.current = 1;
  R.pendingZoom = null; R.renderedScale = null; R.zoomBase = null;
  let url = `/api/pdf/view?key=${encodeURIComponent(key)}` + (project === 'pt-demo' ? '&project_id=pt-demo' : '');   // the PDF is fetched by pdf.js, which sends no demo header
  R.url = url; R.key = key; R.project = project; R.sha256 = null;
  R.loading = true; $('#petSend').disabled = true;
  let prepared = null;
  try { prepared = await api('/api/pdf/prepare', { key }); } catch (e) { /* the render step reports the real failure */ }
  if (!current()) return;
  if (prepared?.sha256) { R.sha256 = prepared.sha256; url += '&sha256=' + encodeURIComponent(prepared.sha256); R.url = url; }
  if (prepared && prepared.ok === false) {
    showPdfFailure(box, key, title, prepared, project, current);
    $('#readerInfo').textContent = '无 PDF';
    R.loading = false; $('#petSend').disabled = pet.busy;
    return;
  }
  try {
    pet.sessionPromise = loadReadingSession(); await pet.sessionPromise;
    if (!current()) return;
    const L = await lib();
    const doc = await L.getDocument({ url, standardFontDataUrl: '/vendor/pdfjs/standard_fonts/' }).promise;
    if (!current()) { doc.destroy(); return; }
    const actualHash = await PTReaderSource.hash(doc);
    if (!current()) { doc.destroy(); return; }
    if (R.sha256 && actualHash !== R.sha256) throw new Error('PDF 版本已变化');
    R.sha256 = actualHash;
    const pages = [];
    for (let n = 1; n <= doc.numPages; n++) { pages.push(await doc.getPage(n)); if (!current()) { doc.destroy(); return; } }
    R.doc = doc; R.pages = pages;
    $('#readerInfo').textContent = `${R.doc.numPages} 页`;
    loadNotes(current);   // drawn by each page as it renders, and once more when they arrive
    await layoutPages();
    buildThumbs();
    buildOutline(doc, current);
    extractFulltext(key, R.doc, [...R.pages]);
  } catch (e) {
    if (!current()) return;
    box.innerHTML = `<iframe src="${url}" style="width:min(1200px,96vw);height:calc(100vh - 120px);border:0;background:#fff"></iframe>`;
    $('#readerInfo').textContent = '内置预览';
    toast(`阅读器没能加载：${e.message}`, 'warn', 6000);
  } finally {
    if (current()) { R.loading = false; $('#petSend').disabled = pet.busy; }
  }
}

function pageScale(page) {
  if (!R.fit) return R.scale || 1.2;
  const avail = Math.max(320, $('#readerPages').clientWidth - 56);
  return avail / page.getViewport({ scale: 1 }).width;
}

async function layoutPages() {
  const layoutEpoch=R.epoch, sourceDoc=R.doc;
  const box = $('#readerPages');
  const pendingBeforeLayout = R.pendingZoom;
  // Remember exactly where we are (page + offset inside it) so re-layout never jumps.
  const prevTop = box.scrollTop;
  const anchor = pendingBeforeLayout || currentAnchor(prevTop);
  const keepPage = anchor.page;
  R.current = keepPage;
  if (R.observer) { R.observer.disconnect(); R.observer = null; }
  const oldStage = box.querySelector('.page-stage');
  const stage = document.createElement('div');
  stage.className = 'page-stage';
  stage.style.visibility = 'hidden';
  const surface = document.createElement('div');
  surface.className = 'page-surface';
  stage.appendChild(surface);
  box.appendChild(stage);
  // Keep one scale for the entire tree. Previously a resize/re-fit could build
  // wrappers at the old rendered scale while a lazy page rendered at its new
  // page-specific scale; the later canvas then sat shrunken in the top-left of
  // its wrapper. Set the tree scale before creating any lazy-page observers so
  // layout and rendering share the same geometry.
  const usedScale = R.fit ? pageScale(R.pages[0]) : (R.renderedScale || R.scale || 1.2);
  R.renderedScale = usedScale;
  // During a pinch the whole surface is transformed, so the crisp layout must
  // use the exact gap captured from the final gesture frame.
  surface.style.gap = `${pendingBeforeLayout?.gap ?? 22}px`;
  const nextJobs = new Map();
  R.jobs = nextJobs;
  R.observer = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) {
        renderPage(Number(en.target.dataset.n), stage, nextJobs);   // pre-render only; the current page follows the view
      }
    }
  }, { root: box, rootMargin: '800px 0px' });
  for (let i = 0; i < R.pages.length; i++) {
    const page = R.pages[i];
    // Zoom gestures keep the existing page tree and only transform the
    // surface. Lazy pages must therefore render at the tree's base scale;
    // rendering them at R.scale would make a narrow canvas sit inside the old
    // page box and leave large blank margins.
    const vp = page.getViewport({ scale: R.renderedScale || pageScale(page) });
    const wrap = document.createElement('div');
    wrap.className = 'pgwrap';
    wrap.dataset.n = i + 1;
    const pageDiv = document.createElement('div');
    pageDiv.className = 'pg';
    pageDiv.style.width = `${vp.width}px`;
    pageDiv.style.height = `${vp.height}px`;
    const canvas = document.createElement('canvas');
    pageDiv.appendChild(canvas);
    const textDiv = document.createElement('div');
    textDiv.className = 'textLayer';
    pageDiv.appendChild(textDiv);
    wrap.appendChild(pageDiv);
    surface.appendChild(wrap);
    // Keep page spacing on the shared surface. It scales as one unit during a
    // pinch and is rebuilt with the same ratio after the gesture ends.
    wrap.dataset.baseW = String(Math.round(vp.width));
    wrap.dataset.baseH = String(Math.round(vp.height));
    wrap.dataset.chromeW = String(Math.max(0, wrap.offsetWidth - Math.round(vp.width)));
    wrap.dataset.chromeH = String(Math.max(0, wrap.offsetHeight - Math.round(vp.height)));
    R.observer.observe(wrap);
  }
  const maxPageWidth = Math.max(...Array.from(surface.querySelectorAll('.pgwrap'))
    .map((wrap) => wrap.offsetWidth), 320);
  const heldSurfaceWidth = pendingBeforeLayout
    ? pendingBeforeLayout.baseWidth * pendingBeforeLayout.k
    : box.clientWidth;
  // A zoom-out must still have a viewport-sized centering surface. If the
  // surface itself shrinks below the scrollport, flex centering disappears and
  // the page snaps to the left edge on release.
  surface.style.width = `${Math.max(box.clientWidth, heldSurfaceWidth, maxPageWidth)}px`;
  stage.style.width = `${surface.offsetWidth}px`;
  stage.style.height = `${surface.offsetHeight}px`;
  $('#zoomLabel').textContent = `${Math.round(usedScale * 100)}%`;
  // Keep the old surface visible while the new canvas is being prepared. Swap
  // only after the anchor page is ready, so a release never exposes a blank
  // frame between two render trees.
  const rendered = await renderPage(keepPage, stage, nextJobs);
  const currentLayout = () => R.epoch===layoutEpoch && R.doc===sourceDoc && R.jobs===nextJobs && stage.isConnected;
  if (!currentLayout()) { stage.remove(); return; }
  if (!rendered) { stage.remove(); if (!oldStage) throw new Error('PDF 页面渲染失败'); return; }
  await afterPaints(2);
  if (!currentLayout()) { stage.remove(); return; }
  stage.style.visibility = 'visible';
  for(const loading of box.querySelectorAll(':scope > .rload'))loading.remove();
  await afterPaints(1);
  if (!currentLayout()) { stage.remove(); return; }
  if (oldStage && oldStage.parentNode === box) oldStage.remove();
  // Restore the reading position after the rebuild. The old formula reduced to
  // "jump to the top of the page" (within cancels out), which is why zooming and
  // 适宽 both felt like a jump; keep the fraction of the page instead.
  requestAnimationFrame(() => {
    if(!currentLayout())return;
    const pending = R.pendingZoom;
    if (pending) {
      R.pendingZoom = null;
      // Same measured anchoring as the visual phase: the content point under the
      // cursor ends up exactly where it was, so releasing the gesture is seamless.
      const held = box.querySelector(`.pgwrap[data-n="${pending.page}"]`);
      if (held) {
        box.scrollTop = Math.max(0, contentTopOf(held, box)
          + pending.withinY * pending.k - pending.localY);
        box.scrollLeft = Math.max(0, contentLeftOf(held, box)
          + pending.withinX * pending.k - pending.localX);
      }
    } else {
      const target = box.querySelector(`.pgwrap[data-n="${keepPage}"]`);
      if (target) {
        const fraction = anchor.height ? Math.min(1, Math.max(0, anchor.within / anchor.height)) : 0;
        box.scrollTop = Math.max(0, contentTopOf(target, box) + fraction * target.offsetHeight);
      }
    }
    markCurrent(keepPage);
  });
}

/* A wrapper's offsetTop is measured against its nearest positioned ancestor
   (.reader), which includes the toolbar and the container padding, while
   box.scrollTop is the scroll offset inside #readerPages. Mixing the two
   introduced a constant error - the view shifted a fixed amount the moment a
   pinch started and stayed shifted. Always measure inside the scroll content. */
function contentTopOf(wrap, box = $('#readerPages')) {
  const boxRect = box.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  return wrapRect.top - boxRect.top + box.scrollTop;
}

function contentLeftOf(wrap, box = $('#readerPages')) {
  const boxRect = box.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  return wrapRect.left - boxRect.left + box.scrollLeft;
}

function afterPaints(count = 2) {
  // An inactive native window may pause animation frames. This wait controls
  // presentation timing only; canvas/text rendering must finish separately.
  return new Promise((resolve) => {
    let frame = null, finished = false;
    const finish = () => { if(finished)return; finished=true; clearTimeout(timer); if(frame!==null)cancelAnimationFrame(frame); resolve(); };
    const timer = setTimeout(finish, 250);
    const tick = () => { if(finished)return; if(--count<=0)finish(); else frame=requestAnimationFrame(tick); };
    frame=requestAnimationFrame(tick);
  });
}

function currentAnchor(scrollTop) {
  const box = $('#readerPages');
  const wraps = box.querySelectorAll('.pgwrap');
  let page = 1, top = 0, height = 1;
  for (const wrap of wraps) {
    const wrapTop = contentTopOf(wrap, box);
    if (wrapTop <= scrollTop + 40) {
      page = Number(wrap.dataset.n);
      top = wrapTop;
      height = Math.max(1, wrap.offsetHeight);
    } else break;
  }
  return { page, top, height, within: scrollTop - top };
}

function renderPage(n, root = document, jobs = R.jobs) {
  if (jobs.has(n)) return jobs.get(n);
  const job = (async () => {
    const L = await lib();
    const page = R.pages[n - 1];
    const wrap = root.querySelector(`.pgwrap[data-n="${n}"]`);
    if (!wrap) return;
    const pageDiv = wrap.querySelector('.pg');
    const canvas = pageDiv.querySelector('canvas');
    const textDiv = pageDiv.querySelector('.textLayer');
    // Lazy pages must use the same tree scale as their wrapper. During zoom the
    // visible tree stays at the rendered scale and is transformed visually;
    // using the current zoom scale here would make a late page shrink/crop.
    const vp = page.getViewport({ scale: R.renderedScale || pageScale(page) });
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    canvas.style.width = `${vp.width}px`;
    canvas.style.height = `${vp.height}px`;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp,
                        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined }).promise;
    textDiv.innerHTML = '';
    textDiv.style.setProperty('--scale-factor', String(vp.scale));
    textDiv.style.setProperty('--total-scale-factor', String(vp.scale));
    const textContent = await page.getTextContent();
    const textLayer = new L.TextLayer({ textContentSource: textContent, container: textDiv, viewport: vp });
    await textLayer.render();
    window.PTReaderTextFit?.apply(textLayer.textDivs, textContent.items, textContent.styles);   // text over the printed letters
    drawNotes(pageDiv, n);
    window.PTReaderSelection?.current?.repaint();   // a page rebuilt at a new zoom keeps the selection drawn where the text now is
    return true;
  })().catch((e) => { toast(`第 ${n} 页渲染失败：${e.message}`, 'err'); return false; });
  jobs.set(n, job);
  return job;
}

function markCurrent(n) {
  R.current = n;
  document.querySelectorAll('#readerSide .thumb').forEach((t) => t.classList.toggle('active', Number(t.dataset.n) === n));
  markOutline();
}
function pageInView() {   // the page the reader is showing right now
  const view = $('#readerPages').getBoundingClientRect();
  const pages = [...$('#readerPages').querySelectorAll('.pgwrap')].map((wrap) => {
    const box = wrap.getBoundingClientRect();
    return { n: Number(wrap.dataset.n), top: box.top, bottom: box.bottom };
  });
  return PTReaderPage.inView({ top: view.top, bottom: view.bottom }, pages);
}
let pageFrame = 0;
$('#readerPages').addEventListener('scroll', () => {
  if (!pageFrame) pageFrame = requestAnimationFrame(() => { pageFrame = 0; const n = pageInView(); if (n && n !== R.current) markCurrent(n); else if (!$('#readerOutline').hidden) markOutline(); });
}, { passive: true });

/* --------------------------------------------------- full text + vision */

async function extractFulltext(key, doc, sourcePages) {
  const current=()=>R.key===key && R.doc===doc;
  let sourceHash;
  try {sourceHash=await PTReaderSource.hash(doc);} catch(error) {if(current()) toast(error.message,'warn'); return;}
  if (!current()) return;
  try {
    const status = await api('/api/fulltext?key=' + encodeURIComponent(key) + '&text=1&source_pdf_sha256='+sourceHash);
    if (!current()) return;
    if (status.pages) {
      setFulltextBadge(status.pages, status.chars);
      R.fulltext = true;
      R.pageTexts = (status.texts || []).map((p) => p.text);   // needed for the local fallback
      return;
    }
  } catch (e) { /* fall through to extraction */ }
  setTimeout(async () => {
    try {
      const pages = [];
      for (let i = 0; i < sourcePages.length; i++) {
        if (!current()) return;
        const content = await sourcePages[i].getTextContent();
        let text = '';
        for (const item of content.items) text += item.str + (item.hasEOL ? '\n' : '');
        pages.push({ page: i + 1, text });
      }
      if (!current()) return;
      const saved = await api('/api/fulltext', { key, pages, source_pdf_sha256:sourceHash });
      window.PTOrganization?.invalidateLearning?.(key)?.catch?.(e => toast(e.message, 'warn'));
      if (!current()) return;
      R.pageTexts = pages.map((p) => p.text);
      setFulltextBadge(saved.pages, saved.chars);
      R.fulltext = true;
    } catch (e) { if(current()) toast('全文提取失败：' + e.message, 'warn'); }
  }, 400);
}

function setFulltextBadge(pages, chars) {
  const el = $('#petFt');
  if (el) el.textContent = '';
}

async function pageImage(pageNumber) {
  const page = R.pages[pageNumber - 1];
  const vp = page.getViewport({ scale: 1.7 });
  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(vp.width);
  canvas.height = Math.floor(vp.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return canvas.toDataURL('image/jpeg', 0.82);
}

let thumbObserver = null;
function buildThumbs() {
  const side = $('#readerThumbs');
  side.innerHTML = '';
  if (thumbObserver) { thumbObserver.disconnect(); thumbObserver = null; }
  thumbObserver = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) { renderThumb(Number(en.target.dataset.n)); thumbObserver.unobserve(en.target); }
    }
  }, { root: side, rootMargin: '300px 0px' });
  for (let i = 0; i < R.pages.length; i++) {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.dataset.n = i + 1;
    const canvas = document.createElement('canvas');
    canvas.width = 120; canvas.height = 160;
    div.appendChild(canvas);
    div.onclick = () => document.querySelector(`.pgwrap[data-n="${i + 1}"]`)?.scrollIntoView({ behavior:'smooth', block:'start' });
    side.appendChild(div);
    thumbObserver.observe(div);
  }
  markCurrent(1);
}

async function renderThumb(n) {
  const div = document.querySelector(`#readerSide .thumb[data-n="${n}"]`);
  if (!div) return;
  const page = R.pages[n - 1];
  const vp = page.getViewport({ scale: 120 / page.getViewport({ scale: 1 }).width });
  const canvas = div.querySelector('canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(vp.width * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  canvas.style.width = `${vp.width}px`;
  canvas.style.height = `${vp.height}px`;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp,
                      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined }).promise;
}

$('#readerToggleSide').onclick = () => { R.side = !R.side; $('#reader').classList.toggle('side', R.side); };

/* ------------------------------------------------- sidebar tabs + outline */
function showSideTab(tab) {
  for (const b of document.querySelectorAll('#readerSide [role=tab]')) {
    b.setAttribute('aria-selected', String(b.dataset.tab === tab)); b.tabIndex = b.dataset.tab === tab ? 0 : -1;
  }
  $('#readerThumbs').hidden = tab !== 'thumbs';
  $('#readerOutline').hidden = tab !== 'outline';
  $('#readerNotes').hidden = tab !== 'notes';
  if (tab === 'outline') markOutline(true);
}
$('#readerSide .rtabs').addEventListener('click', (e) => { const b = e.target.closest('[role=tab]'); if (b) showSideTab(b.dataset.tab); });
$('#readerSide .rtabs').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const tabs = [...document.querySelectorAll('#readerSide [role=tab]')];
  const at = tabs.findIndex((b) => b.getAttribute('aria-selected') === 'true');
  const next = tabs[(at + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  e.preventDefault(); showSideTab(next.dataset.tab); next.focus();
});
showSideTab('thumbs');

async function buildOutline(doc, current) {
  const pane = $('#readerOutline');
  let items = [];
  try { items = await PTReaderNotes.resolveOutline(doc, await doc.getOutline()); } catch (e) { items = []; }
  if (!current()) return;
  pane.innerHTML = '';
  if (!items.length) { pane.innerHTML = '<div class="rempty">这份 PDF 没有大纲</div>'; return; }
  const list = (nodes, depth) => {
    const ul = document.createElement('ul');
    for (const node of nodes) {
      const li = document.createElement('li'), row = document.createElement('div');
      const caret = document.createElement('button'), title = document.createElement('button');
      caret.type = title.type = 'button'; caret.className = 'oc'; title.className = 'ot';
      title.textContent = node.title || '—'; title.title = node.title || '';

        PTReaderIdentity.matches(readerIdentity, {key:R.key,project_id:R.project,pdf_sha256:R.sha256})) setAttachPage(true);
  };   // restore only for the same visible PDF version
  if (readerIdentity && R.doc && (figure || forced)) {
    // The page the question is about: a quote's page, else the page in view.
    const here = quotedPage || pageInView() || R.current || 1;
    if (figure && figure.number) {
      // The server owns figure location because it holds the cached full text.
      let found = null;

        const res = await api('/api/figure-page?key=' + encodeURIComponent(R.key) + '&q=' + encodeURIComponent(question));
        found = res.page || null;
      } catch (e) { found = null; }

      located = Boolean(found);

      imageNote = '';

        : `图注未找到，改发第 ${pageHint} 页…`;

    }

        image = await pageImage(pageHint);
    } catch (e) { pageHint = null; image = null; imageNote = ''; }
    if (!image) { thinking.textContent = '页面渲染失败，改用文本…'; keepSwitch(); }
  }
  try {
    await pet.sessionPromise;
    if (!current()) { thinking.remove(); return; }
    const r = await api('/api/qa', { key, question, selection: quoted, image, page_hint: pageHint,
                                    project_id: project, session_id:pet.session, reader_context:evidence,
                                    context: $('#fullCtx') && $('#fullCtx').checked ? 'full' : 'normal' });

}

    $('#transCopy').onclick = () => { navigator.clipboard?.writeText(pop.innerText).then(() => toast('已复制')); };
    $('#transClose').onclick = () => pop.classList.remove('show');
  } catch (e) {
    if (epoch !== pet.epoch || !pop.classList.contains('show')) return;
    pop.innerHTML = `<div class="tlabel">翻译失败</div><div class="tbody">${esc(e.message)}</div>`;
  }
  if (pop.classList.contains('show')) placeTransPop(rect);
}
function placeTransPop(rect) {
  const pop = $('#transPop');
  pop.style.left = '0px'; pop.style.top = '0px';
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const position = PTReaderIdentity.popupPosition(rect, {width:w,height:h}, {width:innerWidth,height:innerHeight});
  pop.style.left = `${position.left}px`; pop.style.top = `${position.top}px`;
}
let transAnchor = null;
window.addEventListener('resize', () => { if ($('#transPop').classList.contains('show')) placeTransPop(transAnchor); });
if (window.ResizeObserver) new ResizeObserver(() => { if ($('#transPop').classList.contains('show')) placeTransPop(transAnchor); }).observe($('#transPop'));
$('#petClose').onclick = () => setPetOpen(false);
$('#petClear').onclick = async () => {
  if (pet.busy || !pet.key) return;
  const button = $('#petClear'), epoch = pet.epoch; button.disabled = true;
  try {
    const result = await api('/api/qa/session', {key:pet.key, project_id:pet.project});
    if (epoch !== pet.epoch) return;
    pet.session = result.session.id; pet.epoch++; setReference(null); setAttachPage(false);
    $('#petLog').innerHTML = ''; lastFol = null; addIntro(); toast('已开始新会话', 'ok');
  } catch (error) { toast(`新会话未开始：${error.message}`, 'err'); }
  finally { button.disabled = false; }
};
/* The box keeps the question until it is actually sent, so nothing is lost while an answer is pending. */
function sendInput() {
  const input = $('#petInput');
  if (pet.busy || R.loading || !input.value.trim()) return;
  if (!pet.key) { toast('请先选择要提问的论文', 'warn'); return; }
  const v = input.value;
  input.value = '';
  growInput();
  ask(v);
}
function growInput() {
  const input = $('#petInput');
  input.style.height = 'auto';
  input.style.height = `${input.scrollHeight}px`;
}
$('#petSend').onclick = sendInput;
function setAttachPage(on) {
  pet.attachPage = Boolean(on);
  $('#petImg').setAttribute('aria-pressed', String(pet.attachPage));
}
$('#petImg').onclick = () => {
  if (!R.doc) { toast('先打开论文 PDF', 'warn'); return; }
  setAttachPage(!pet.attachPage);
};
$('#petInput').addEventListener('input', growInput);
$('#petInput').addEventListener('keydown', (e) => {
  // Enter that confirms an IME candidate (Chinese input) must not send; Shift+Enter adds a line.
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  sendInput();
});
/* ---------------------------------------------- zoom: pinch + modifier scroll
   macOS delivers zoom in two shapes: Chrome/Edge/Brave send wheel events with
   ctrlKey (trackpad pinch) and the user may also use Cmd or Option + scroll;
   Safari sends gesturestart/gesturechange/gestureend. Both are handled here and
   the browser's own page zoom is suppressed while the pointer is over the pages. */
let zoomTimer = null, gestureBase = null;

function currentScale() {
  return R.fit ? pageScale(R.pages[0]) : (R.scale || 1.2);
}

function applyVisualScale(k, base) {
  const box = $('#readerPages');
  const stage = box.querySelector('.page-stage');
  const surface = box.querySelector('.page-surface');
  if (!stage || !surface || !base) return;
  const visualWidth = base.baseWidth * k;
  const centerOffset = Math.max(0, (box.clientWidth - visualWidth) / 2);
  surface.style.transform = `translateX(${centerOffset}px) scale(${k})`;
  stage.style.width = `${Math.max(box.clientWidth, visualWidth)}px`;
  stage.style.height = `${base.baseHeight * k}px`;
  // Do this in the same event as the transform. A queued frame can outlive a
  // crisp re-layout and then measure a detached surface, which causes a release
  // jump or an old horizontal offset to be applied after the new DOM exists.
  const surfaceLeft = contentLeftOf(surface, box);
  const surfaceTop = contentTopOf(surface, box);
  box.scrollTop = Math.max(0, surfaceTop
    + (base.pageTop + base.withinY) * k - base.localY);
  box.scrollLeft = Math.max(0, surfaceLeft
    + (base.pageLeft + base.withinX) * k - base.localX);
}

function commitZoom() {
  if (!R.zoomBase || !R.doc) return;
  if (zoomTimer) { clearTimeout(zoomTimer); zoomTimer = null; }
  // Never rebuild the visible PDF tree at gesture end. Recreating canvases is
  // what causes image-heavy pages to flash white; keep the composed texture and
  // retain the final transform, like Preview.
  R.pendingZoom = null;
  R.zoomBase = null;
  $('#zoomLabel').textContent = `${Math.round(R.scale * 100)}%`;
}

function setScale(newScale, clientY, clientX) {
  if (!R.doc || !R.pages.length) return;
  const box = $('#readerPages');
  const rect = box.getBoundingClientRect();
  const localY = typeof clientY === 'number' ? clientY - rect.top : box.clientHeight / 2;
  const localX = typeof clientX === 'number' ? clientX - rect.left : box.clientWidth / 2;
  // Anchor against the scale the DOM was last RENDERED at, and remember where the
  // sequence started, so a burst of pinch events accumulates instead of fighting.
  const renderedScale = R.renderedScale || currentScale();
  const activeK = R.fit ? 1 : (R.scale / renderedScale);
  const clamped = Math.min(3, Math.max(0.4, newScale));
  if (Math.abs(clamped - currentScale()) < 0.001) return;
  if (!R.zoomBase) {
    const anchor = currentAnchor(box.scrollTop);
    const anchorWrap = box.querySelector(`.pgwrap[data-n="${anchor.page}"]`);
    const surface = box.querySelector('.page-surface');
    const surfaceTop = surface ? contentTopOf(surface, box) : 0;
    const surfaceLeft = surface ? contentLeftOf(surface, box) : 0;
    R.zoomBase = {
      page: anchor.page,
      // Convert the current transformed coordinates back into the surface's
      // base coordinate system before applying the next zoom.
      pageTop: anchorWrap ? (contentTopOf(anchorWrap, box) - surfaceTop) / activeK : 0,
      pageLeft: anchorWrap ? (contentLeftOf(anchorWrap, box) - surfaceLeft) / activeK : 0,
      withinY: anchorWrap ? (box.scrollTop + localY - contentTopOf(anchorWrap, box)) / activeK : 0,
      withinX: anchorWrap ? (box.scrollLeft + localX - contentLeftOf(anchorWrap, box)) / activeK : 0,
      localY, localX,
      baseWidth: surface ? surface.offsetWidth : box.clientWidth,
      baseHeight: surface ? surface.offsetHeight : box.clientHeight,
      gap: surface ? parseFloat(getComputedStyle(surface).gap) || 22 : 22,
    };
  }
  R.fit = false;
  R.scale = clamped;
  const k = clamped / renderedScale;
  R.zoomBase.finalK = k;
  R.zoomBase.finalGap = R.zoomBase.gap * k;
  applyVisualScale(k, R.zoomBase);
  // Safari has an explicit gestureend. For ctrl-wheel pinch there is no end
  // event, so use an idle timer, but never let that timer run during a Safari
  // gesture where events may arrive with a long gap.
  if (gestureBase === null) {
    if (zoomTimer) clearTimeout(zoomTimer);
    zoomTimer = setTimeout(commitZoom, 260);
  }
}

function zoomBy(factor, clientY) {
  const rect = $('#readerPages').getBoundingClientRect();
  setScale(currentScale() * factor,
    typeof clientY === 'number' ? clientY : rect.top + rect.height / 2,
    rect.left + rect.width / 2);
}

const pagesBox = $('#readerPages');
pagesBox.addEventListener('wheel', (event) => {
  if (!R.doc) return;
  const zoomModifier = event.ctrlKey || event.metaKey || event.altKey;
  if (!zoomModifier) return;                       // plain two-finger scroll keeps scrolling
  event.preventDefault();                          // never zoom the whole page
  if (gestureBase !== null) return;                // Safari gesturechange owns this pinch
  setScale(currentScale() * Math.exp(-event.deltaY * 0.0042), event.clientY, event.clientX);
}, { passive: false });

pagesBox.addEventListener('gesturestart', (event) => {   // Safari trackpad pinch
  if (!R.doc) return;
  event.preventDefault();
  gestureBase = currentScale();
}, { passive: false });
pagesBox.addEventListener('gesturechange', (event) => {
  if (!R.doc || gestureBase === null) return;
  event.preventDefault();
  setScale(gestureBase * event.scale, event.clientY, event.clientX);
}, { passive: false });
pagesBox.addEventListener('gestureend', (event) => {
  event.preventDefault();
  gestureBase = null;
  commitZoom();
}, { passive: false });

$('#readerBack').onclick = closeReader;
$('#readerAsk').onclick = () => { openPet(); $('#petInput').focus(); };
$('#selbar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-sel]');
  if (!btn) return;
  const text = selText, rect = selRect, page = selPage, boxes = selBoxes;
  hideSel();
  if (btn.dataset.sel === 'clear') { window.getSelection()?.removeAllRanges(); return; }
  if (btn.dataset.sel === 'highlight' || btn.dataset.sel === 'note') {
    window.getSelection()?.removeAllRanges();
    createNote(btn.dataset.color || 'yellow', boxes, text, rect, btn.dataset.sel === 'note');
    return;
  }
  if (btn.dataset.sel === 'translate') translate(text, rect);
  else {
    setReference(text, page); openPet();
    // The demo's answers are pre-written: the question is filled in so that sending it is the next (and only) step.
    if (window.PT.state.currentProject === 'pt-demo' && !$('#petInput').value.trim()) { $('#petInput').value = window.PTi18n?.exact?.('这句话是什么意思？') || '这句话是什么意思？'; growInput(); }
    $('#petInput').focus();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !e.defaultPrevented && !e.isComposing && e.keyCode!==229 && !document.querySelector('dialog[open]')) { hideSel(); $('#transPop').classList.remove('show'); window.getSelection()?.removeAllRanges(); }
});
