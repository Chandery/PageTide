<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>PaperDigHelper</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font:15px/1.62 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue","PingFang SC",Arial,sans-serif;
    color:var(--text); background:var(--base); min-height:100vh;
    transition:background .3s ease, color .3s ease;
  }
  .out { background:var(--base); box-shadow:var(--sh-out); border-radius:var(--r-lg); }
  .out-sm { background:var(--base); box-shadow:var(--sh-out-sm); border-radius:var(--r-sm); }
  .in { background:var(--base); box-shadow:var(--sh-in); border-radius:var(--r-lg); }
  .in-sm { background:var(--base); box-shadow:var(--sh-in-sm); border-radius:var(--r-sm); }

  /* ------------------------------------------------------------------ header */
  header.top { position:sticky; top:14px; z-index:40; max-width:920px; margin:calc(14px * var(--s)) auto 0;
               padding:calc(12px * var(--s)) calc(16px * var(--s)); display:flex; align-items:center; gap:calc(14px * var(--s)); flex-wrap:wrap;
               background:var(--base); box-shadow:var(--sh-out); border-radius:var(--r-lg); }
  .brand { font-weight:650; letter-spacing:.01em; display:flex; align-items:center; gap:calc(9px * var(--s)); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent);
         box-shadow:0 0 0 4px var(--accent-soft); }
  .tabs { display:flex; gap:calc(4px * var(--s)); padding:calc(5px * var(--s)); border-radius:14px; background:var(--base); box-shadow:var(--sh-in-sm); }
  .tab { padding:calc(7px * var(--s)) calc(16px * var(--s)); border-radius:10px; font-size:calc(13.5px * var(--s)); color:var(--muted); cursor:pointer;
         user-select:none; transition:color .2s, background .2s, box-shadow .2s; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--text); font-weight:600; background:var(--base); box-shadow:var(--sh-out-sm); }
  .right { margin-left:auto; display:flex; align-items:center; gap:calc(12px * var(--s)); flex-wrap:wrap; }
  .stat { font-size:calc(12px * var(--s)); color:var(--muted); display:flex; gap:calc(10px * var(--s)); }
  .stat b { color:var(--text); font-weight:650; }
  .controls { display:flex; align-items:center; gap:calc(8px * var(--s)); }
  .modes { padding:calc(4px * var(--s)); border-radius:12px; box-shadow:var(--sh-in-sm); display:flex; }

  /* ------------------------------------------ project overview (Mission Control style) */
  .project-btn { padding:7px 12px 7px 14px; border-radius:999px; font-size:13px; cursor:pointer;
                 background:var(--base); box-shadow:var(--sh-out-sm); display:flex; align-items:center; gap:8px;
                 transition:box-shadow .16s ease, transform .16s ease; user-select:none; }
  .project-btn:hover { transform:translateY(-1px); }
  .project-edit { font-size:12px; color:var(--muted); padding:6px 10px; border-radius:999px; text-decoration:none; white-space:nowrap; }
  .project-edit:hover, .project-edit:focus-visible { color:var(--text); box-shadow:var(--sh-out-sm); }
  .project-btn .icon { font-size:14px; }
  .project-btn kbd { font:11px/1 -apple-system,BlinkMacSystemFont,sans-serif; color:var(--muted);
                     padding:3px 5px; border-radius:5px; box-shadow:inset 0 0 0 1px var(--line-strong); }
  html.mc-open, html.mc-open body { overflow:hidden; }
  .mc { position:fixed; inset:0; z-index:200; --desk:#262c33; --desk-2:#3a3531; }
  html[data-mode="dark"] .mc { --desk:#0d1013; --desk-2:#1d1a17; }
  .mc[hidden] { display:none; }
  .mc-desk { position:absolute; inset:0;
             background:radial-gradient(120% 90% at 50% 0%, var(--desk-2), var(--desk));
             -webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px); }
  .mc-bar { position:absolute; left:0; right:0; top:0; height:64px; display:flex; align-items:center;
            justify-content:center; gap:14px; color:#f3eee6; }
  .mc-title { font:600 15px/1 var(--serif); letter-spacing:.02em; }
  .mc-hint { font-size:11.5px; opacity:.6; }
  .mc-bar .mc-add { position:absolute; right:22px; top:14px; width:36px; height:36px; padding:0; border-radius:10px;
                    display:grid; place-items:center; color:#f3eee6; background:rgba(255,255,255,.1);
                    border:1px solid rgba(255,255,255,.16); box-shadow:none; }
  .mc-bar .mc-add:hover { background:rgba(255,255,255,.18); transform:none; }
  .mc-stage { position:absolute; inset:0; top:0; }
  .mc-bar { z-index:1; }
  .mc-card { position:absolute; cursor:pointer; }
  .mc-card.front { z-index:2; }
  .mc-window { position:relative; overflow:hidden; border-radius:10px; transform-origin:0 0;
               background:var(--base); box-shadow:0 18px 44px rgba(0,0,0,.38), 0 0 0 1px rgba(255,255,255,.08); }
  .mc-window::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
                      box-shadow:inset 0 0 0 0 transparent; transition:box-shadow .14s ease; }
  .mc-card[aria-selected="true"] .mc-window::after { box-shadow:inset 0 0 0 3px var(--accent); }
  .mc-scale { transform-origin:0 0; }
  .mc-page { position:relative; overflow:hidden; background:var(--base); color:var(--text); pointer-events:none; }
  .mc-page, .mc-page * { animation:none !important; transition:none !important; }
  .mc-label { display:flex; align-items:center; justify-content:center; gap:7px; height:30px; padding-top:8px;
              font-size:12.5px; color:rgba(243,238,230,.78); white-space:nowrap; overflow:hidden; }
  .mc-label .mc-name { overflow:hidden; text-overflow:ellipsis; }
  .mc-edit { flex:0 0 auto; font-size:11px; padding:2px 8px; border-radius:999px; color:rgba(243,238,230,.8); background:rgba(255,255,255,.1);
             border:1px solid rgba(255,255,255,.16); box-shadow:none; opacity:0; transition:opacity .14s ease; cursor:pointer; }
  .mc-card:hover .mc-edit, .mc-card[aria-selected="true"] .mc-edit, .mc-edit:focus-visible { opacity:1; }
  .mc-edit:hover { background:rgba(255,255,255,.2); transform:none; }
  .mc-card[aria-selected="true"] .mc-label { color:#fff; font-weight:600; }
  .mc-dot { flex:0 0 auto; width:6px; height:6px; border-radius:50%; background:var(--mark); }
  /* placeholder page for projects not opened in this session */
  .mc-ph-top { display:flex; align-items:center; gap:14px; padding:14px max(24px,calc((100% - 1200px)/2));
               border-bottom:1px solid var(--line); background:var(--surface-1); }
  .mc-ph-top img { width:30px; height:30px; }
  .mc-ph-top b { font:600 20px/1 var(--serif); }
  .mc-ph-top b em { color:var(--accent-text); }
  .mc-ph-pill { padding:8px 16px; border-radius:999px; font-size:14px; box-shadow:var(--sh-out-sm); }
  /* Centred by its side padding only: a max-width on top of that padding left the content 0 px wide on wide windows. */
  .mc-ph-body { margin:0; padding:40px max(28px,calc((100% - 1200px)/2)); }
  .mc-ph-edition { color:var(--muted); font-size:14px; letter-spacing:.08em; }
  .mc-ph-body h1 { margin:10px 0 18px; font:600 44px/1.15 var(--serif); }
  .mc-ph-chips { display:flex; flex-wrap:wrap; gap:10px; }
  .mc-ph-chips span { padding:6px 14px; border-radius:999px; background:var(--accent-soft); color:var(--accent-text); font-size:15px; }
  .mc-ph-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:34px; }
  .mc-ph-grid div { height:190px; padding:22px; border-radius:var(--r-lg); background:var(--surface-1);
                    border:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  .mc-ph-grid i { display:block; height:14px; border-radius:7px; background:var(--surface-3); }
  .mc-ph-grid i:first-child { width:80%; height:20px; }
  .mc-ph-grid i:last-child { width:55%; }

  main { max-width:920px; margin:20px auto 90px; padding:0 16px; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:0; }
  .sub { color:var(--muted); font-size:13px; }

  /* ----------------------------------------------------------------- buttons */
  button, .btn { font:inherit; color:var(--text); cursor:pointer; border:none; background:var(--base);
    padding:calc(9px * var(--s)) calc(17px * var(--s)); border-radius:999px; box-shadow:var(--sh-out-sm);
    display:inline-flex; align-items:center; gap:calc(7px * var(--s)); white-space:nowrap; text-decoration:none;
    transition:box-shadow .16s ease, transform .16s ease, color .16s ease; }
  button:hover, .btn:hover { transform:translateY(-1px); }
  button:active, .btn:active { box-shadow:var(--sh-in-sm); transform:none; }
  button:disabled { opacity:.55; cursor:default; transform:none; }
  button.primary { color:var(--accent); font-weight:650; }
  button.ghost { box-shadow:none; background:transparent; }
  button.ghost:hover { box-shadow:var(--sh-out-sm); }
  .tiny, .btn.tiny { padding:calc(6px * var(--s)) calc(13px * var(--s)); font-size:calc(12.5px * var(--s)); }   /* .btn.tiny: a link styled as a small button must not be overridden by the later .btn rule */
  .danger:hover { color:var(--bad); }
  .saved { color:var(--good); font-weight:600; }
  .row { display:flex; gap:calc(12px * var(--s)); flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=password] { font:inherit; color:var(--text); background:var(--base); border:none;
    border-radius:999px; padding:calc(11px * var(--s)) calc(18px * var(--s)); min-width:220px; flex:1; box-shadow:var(--sh-in-sm); }
  input[type=text]::placeholder, input[type=password]::placeholder { color:var(--muted); }
  input[type=text]:focus, input[type=password]:focus { outline:none; box-shadow:var(--sh-in-sm), 0 0 0 2px var(--accent-soft); }
  .switch { display:inline-flex; align-items:center; gap:calc(8px * var(--s)); font-size:calc(13px * var(--s)); color:var(--muted); cursor:pointer; }
  .switch input { accent-color:var(--accent); width:16px; height:16px; }

  /* -------------------------------------------------------------------- hero */
  .hero { padding:calc(22px * var(--s)); margin-bottom:calc(18px * var(--s)); background:var(--base); box-shadow:var(--sh-out);
          border-radius:var(--r-lg); animation:rise .5s ease both; }
  .hero .row + .row { margin-top:calc(14px * var(--s)); }

  /* ------------------------------------------------------------------- cards */
  .grid { display:grid; grid-template-columns:1fr; gap:calc(18px * var(--s)); }
  @media (min-width:820px) { .grid { grid-template-columns:1fr 1fr; } }
  .card { position:relative; padding:calc(20px * var(--s)); cursor:pointer; background:var(--base);
          box-shadow:var(--sh-out); border-radius:var(--r-lg); animation:rise .45s ease both;
          transition:box-shadow .22s ease, transform .22s ease; }
  .card:hover { transform:translateY(-2px);
                box-shadow:var(--sh-2); }
  .card:active { box-shadow:var(--sh-in); transform:none; }
  .card h3 { font-size:calc(15.5px * var(--s)); margin:0 0 calc(9px * var(--s)); line-height:1.44; letter-spacing:0; }
  .meta { font-size:calc(12px * var(--s)); color:var(--muted); display:flex; gap:calc(9px * var(--s)); flex-wrap:wrap; align-items:center; margin-bottom:calc(11px * var(--s)); }
  .badge { font-size:calc(11px * var(--s)); padding:calc(3px * var(--s)) calc(10px * var(--s)); border-radius:999px; box-shadow:var(--sh-in-sm); color:var(--muted); }
  .badge.ai { color:var(--ai-text); }
  .badge.saved { color:var(--good); }
  .route-panel { margin-top:calc(16px * var(--s)); padding:calc(16px * var(--s)) calc(20px * var(--s)); border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface-1);
    display:grid; gap:calc(14px * var(--s)); font-size:calc(13px * var(--s)); line-height:1.6; }
  .route-head, .route-foot { display:flex; align-items:center; justify-content:space-between; gap:calc(12px * var(--s)) calc(16px * var(--s)); flex-wrap:wrap; }
  .route-title { display:flex; align-items:baseline; gap:calc(8px * var(--s)); font-size:calc(15px * var(--s)); }
  .route-meter { display:flex; align-items:center; gap:calc(14px * var(--s)); }
  .route-bar { flex:1; min-width:calc(80px * var(--s)); height:calc(8px * var(--s)); border-radius:999px; background:var(--surface-3); overflow:hidden; }
  .route-bar i { display:block; height:100%; border-radius:999px; background:var(--good); }
  .route-meter span { white-space:nowrap; color:var(--muted); }
  .route-now { display:flex; flex-wrap:wrap; align-items:center; gap:calc(8px * var(--s)); }
  .route-foot .sub { max-width:62ch; }
  .abs { font-size:calc(13.5px * var(--s)); color:var(--text); opacity:.86;
         display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .ai-slot { margin-top:calc(12px * var(--s)); }
  .ai-line { font-size:calc(13px * var(--s)); padding:calc(11px * var(--s)) calc(13px * var(--s)); border-radius:var(--r-md); box-shadow:var(--sh-in-sm);
             animation:fade .3s ease both; }
  .ai-line b { color:var(--ai-text); }
  .ai-loading { display:flex; align-items:center; gap:calc(9px * var(--s)); font-size:calc(12.5px * var(--s)); color:var(--muted); }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid var(--accent-soft);
          border-top-color:var(--accent); animation:spin .8s linear infinite; }
  .ai-off { font-size:calc(12.5px * var(--s)); color:var(--muted); }
  .why { font-size:calc(12.5px * var(--s)); color:var(--muted); margin-top:calc(13px * var(--s)); }
  .why span { box-shadow:var(--sh-in-sm); padding:calc(5px * var(--s)) calc(11px * var(--s)); border-radius:999px; display:inline-block; }
  .actions { display:flex; gap:calc(9px * var(--s)); flex-wrap:wrap; margin-top:calc(15px * var(--s)); }
  .hint { position:absolute; right:20px; bottom:16px; font-size:calc(11.5px * var(--s)); color:var(--muted);
          opacity:0; transition:opacity .2s; }
  .card:hover .hint { opacity:1; }

  /* --------------------------------------------------------------- preview */
  #preview { position:fixed; z-index:70; width:min(460px,92vw); padding:calc(18px * var(--s)); background:var(--base);
             box-shadow:var(--sh-out); border-radius:var(--r-lg);
             max-height:min(74vh,660px); display:flex; flex-direction:column;
             opacity:0; transform:translateY(8px) scale(.98); transition:opacity .16s, transform .16s; }
  /* Hidden means NOT interactive: an invisible box left where it last appeared
     would sit over the neighbouring column and swallow its hover events. */
  #preview { pointer-events:none; visibility:hidden; }
  #preview.show { opacity:1; transform:none; pointer-events:auto; visibility:visible; }
  #preview h4 { margin:0 0 calc(9px * var(--s)); font-size:calc(14px * var(--s)); line-height:1.44; }
  #preview .pabs { font-size:calc(12.5px * var(--s)); overflow:auto; color:var(--muted); flex:1; padding-right:calc(8px * var(--s)); }
  #preview .phint { margin-top:calc(11px * var(--s)); font-size:calc(11.5px * var(--s)); color:var(--accent-text); }
  .whyline { font-size:calc(12.5px * var(--s)); color:var(--muted); margin-top:calc(13px * var(--s)); }
  .whyline span { box-shadow:var(--sh-in-sm); padding:calc(5px * var(--s)) calc(11px * var(--s)); border-radius:999px; display:inline-block; }
  .pdfbox { box-shadow:var(--sh-in); border-radius:var(--r-md); height:min(72vh,640px); overflow:hidden; margin-top:calc(6px * var(--s)); }
  .pdfbox iframe { width:100%; height:100%; border:0; background:#fff; }
  .pdfbox .ph { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;
                gap:calc(12px * var(--s)); color:var(--muted); font-size:calc(13px * var(--s)); }

  /* ----------------------------------------------------------- detail page */
  .page { position:fixed; inset:0; z-index:80; overflow:auto; padding:calc(28px * var(--s)) calc(16px * var(--s)) calc(70px * var(--s)); background:var(--base);
          animation:slideIn .28s ease both; }
  /* Paper details use the same calm right-hand reading rail as Connected Papers.
     The graph/list stays visible behind it, and the rail owns its own scroll. */
  #detail.detail-page { padding:0; overflow:hidden; background:transparent; animation:none; display:flex; justify-content:flex-end; }
  #detail.detail-page .detail-scrim { position:absolute; inset:0; background:rgba(20,28,38,.16); opacity:0; transition:opacity .22s ease; }
  #detail.detail-page:not(.hidden) .detail-scrim { opacity:1; }
  #detail.detail-page .detail-panel { position:relative; z-index:1; width:min(calc(520px * var(--s)), 100vw); height:100%; margin:0; overflow:auto;
    padding:calc(28px * var(--s)) calc(34px * var(--s)) calc(44px * var(--s)); background:var(--surface-1); border-left:1px solid var(--line);
    border-radius:14px 0 0 14px; box-shadow:-18px 0 48px rgba(28,34,48,.14);
    transform:translateX(100%); transition:transform .28s cubic-bezier(.22,.8,.28,1); }
  #detail.detail-page:not(.hidden) .detail-panel { transform:translateX(0); }
  .detail-head { display:flex; align-items:center; justify-content:space-between; gap:calc(12px * var(--s)); margin-bottom:calc(18px * var(--s)); }
  .detail-head .label { margin:0; }
  .detail-close { width:calc(38px * var(--s)); height:calc(38px * var(--s)); padding:0; justify-content:center; border-radius:12px; }
  .detail-kicker { display:inline-flex; align-items:center; gap:calc(7px * var(--s)); color:var(--accent-text); font-size:calc(12px * var(--s)); font-weight:650; }
  .detail-kicker::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--mark); }
  .detail-panel h2 { font-size:calc(25px * var(--s)); line-height:1.28; margin:0 0 calc(13px * var(--s)); }
  .detail-meta { display:flex; flex-wrap:wrap; align-items:center; gap:calc(7px * var(--s)) calc(12px * var(--s)); color:var(--muted); font-size:calc(13px * var(--s)); }
  .detail-meta span + span { position:relative; }
  .detail-meta span + span::before { content:"·"; position:absolute; left:-9px; color:var(--line-strong); }
  .detail-actions { display:flex; flex-direction:column; gap:calc(12px * var(--s)); margin:calc(22px * var(--s)) 0 calc(25px * var(--s)); padding-bottom:calc(22px * var(--s)); border-bottom:1px solid var(--line); }
  .detail-actions .actions-main, .detail-actions .actions-more { display:flex; flex-wrap:wrap; gap:calc(10px * var(--s)); align-items:center; }
  /* The rail has two control sizes and nothing else: main (the two things you do with a paper) and small (the rest);
     buttons, links styled as buttons and the project select share the same heights. */
  #detail .detail-panel button, #detail .detail-panel a.btn, #detail .detail-panel select { box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center;
    min-height:calc(40px * var(--s)); padding:0 calc(18px * var(--s)); font-size:calc(13.5px * var(--s)); line-height:1.2; border-radius:10px; text-decoration:none; }
  #detail .detail-panel button.tiny, #detail .detail-panel a.btn.tiny, #detail .detail-panel .detail-project-row select, #detail .detail-panel .detail-project-row button {
    min-height:calc(34px * var(--s)); padding:0 calc(14px * var(--s)); font-size:calc(12.5px * var(--s)); }
  #detail .detail-panel button.outline { background:transparent; border:1px solid var(--accent); color:var(--accent-text); }
  #detail .detail-panel .detail-close { min-height:0; padding:0; }
  .detail-project-row { display:flex; gap:calc(8px * var(--s)); align-items:center; margin-bottom:calc(8px * var(--s)); }
  .detail-project-row select { flex:1; min-width:0; border:1px solid var(--line-strong); background:var(--surface-1); color:var(--text); }
  .detail-projects .hint { position:static; opacity:1; font-size:calc(12px * var(--s)); color:var(--muted); line-height:1.6; margin-top:calc(6px * var(--s)); }
  .detail-section { padding:0 0 calc(24px * var(--s)); }
  .detail-section h3 { margin:0 0 calc(10px * var(--s)); font-size:calc(14px * var(--s)); }
  .detail-section .full { font-size:calc(14px * var(--s)); line-height:1.8; color:var(--text); opacity:.9; }
  .detail-ai { margin:0 0 calc(24px * var(--s)); padding:calc(14px * var(--s)) calc(15px * var(--s)); border:1px solid var(--line); border-left:2px solid var(--ai); border-radius:4px 10px 10px 4px; background:var(--surface-2); }
  .detail-ai .ai-line { box-shadow:none; padding:0; background:transparent; }
  .detail-ai .sub { margin-top:calc(7px * var(--s)); line-height:1.55; }
  @media (prefers-reduced-motion: reduce) { #detail.detail-page .detail-scrim, #detail.detail-page .detail-panel { transition:none; } }
  .page-inner { max-width:800px; margin:0 auto; padding:calc(28px * var(--s)); background:var(--base);
                box-shadow:var(--sh-out); border-radius:var(--r-lg); }
  .page h2 { font-size:calc(22px * var(--s)); line-height:1.4; margin:0 0 calc(10px * var(--s)); letter-spacing:0; }
  .full { font-size:calc(14.5px * var(--s)); line-height:1.85; opacity:.92; }
  .full p, .msg p { margin:0 0 calc(10px * var(--s)); }
  .full h4, .msg h4 { margin:calc(14px * var(--s)) 0 calc(6px * var(--s)); font-size:calc(14px * var(--s)); }
  .full ul, .msg ul { margin:calc(6px * var(--s)) 0 calc(10px * var(--s)) calc(20px * var(--s)); padding:0; }
  .full li, .msg li { margin:calc(3px * var(--s)) 0; }
  .full code, .msg code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:calc(12.5px * var(--s));
                          box-shadow:var(--sh-in-sm); padding:calc(1px * var(--s)) calc(6px * var(--s)); border-radius:6px; }
  .full pre, .msg pre { box-shadow:var(--sh-in-sm); padding:calc(12px * var(--s)) calc(14px * var(--s)); border-radius:var(--r-sm);
                        overflow:auto; margin:calc(8px * var(--s)) 0; }
  .full pre code, .msg pre code { box-shadow:none; padding:0; background:none; }
  .full a, .msg a { color:var(--accent-text); }
  .label { font-size:calc(12px * var(--s)); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:calc(26px * var(--s)) 0 calc(10px * var(--s)); }


  /* ---------------------------------------------------------------- reader */
  .reader { position:fixed; inset:0; z-index:90; background:var(--base); display:flex; flex-direction:column;
            animation:fade .18s ease both; }

                  position:relative; z-index:3; }

                     text-overflow:ellipsis; white-space:nowrap; }
  .reader .pages { flex:1; overflow:auto; padding:22px 0 60px; overflow-anchor:none; }
  .reader .page-stage { position:relative; width:max-content; height:max-content; flex:0 0 auto; }

  /* pdf.js TextLayer contract (copied from pdf_viewer.css) — do not change. */

  .reader .textLayer :is(span, br) { color:transparent; position:absolute; white-space:pre; cursor:text; transform-origin:0% 0%; }

  .reader .rload { margin:auto; color:var(--muted); font-size:13px; display:flex; gap:10px; align-items:center; }
  .reader .rload.pdf-fail { flex-direction:column; text-align:center; max-width:480px; line-height:1.6; }

  .reader .rbody { flex:1; display:flex; min-height:0; }

  .reader .rside .thumb.active { outline-color:var(--accent); }
  .reader .rside .thumb canvas { display:block; }
  .reader .zoombar { display:flex; align-items:center; gap:2px; font-size:12px; color:var(--muted); }
  .reader .pgwrap { display:flex; flex:0 0 auto; flex-direction:column; align-items:center; gap:8px; }
  .reader .pgno { font-size:11px; color:var(--muted); }
  .reader .pg { flex:0 0 auto; }
  .reader .rbody { min-height:0; }
  .reader .rside { overflow-y:auto; overflow-x:hidden; flex:0 0 auto; scrollbar-width:thin; }
  .reader .rside .thumb { flex:0 0 auto; }
  .reader .rside .thumb canvas { width:120px; height:auto; display:block; }
  .petpanel.docked { position:static; width:380px; flex:0 0 auto; margin:14px 14px 14px 0;
                    max-height:none; height:calc(100% - 28px); }
  .petpanel.docked header { box-shadow:var(--sh-out-sm); }
  body.reader-open .pet { bottom:14px; right:14px; opacity:.62; }
  body.reader-open .pet:hover { opacity:1; }

  /* ------------------------------------------------------------ assistant */
  .pet { position:fixed; right:22px; bottom:22px; z-index:88; width:58px; height:58px; border-radius:50%;
         background:var(--base); box-shadow:var(--sh-out); display:flex; align-items:center; justify-content:center;
         cursor:pointer; font-size:23px; user-select:none; transition:transform .18s ease, box-shadow .18s; }
  .pet:hover { transform:translateY(-2px) scale(1.05); }
  .pet:active { box-shadow:var(--sh-in); transform:none; }
  .petpanel { position:fixed; right:22px; bottom:92px; z-index:89; width:min(410px,92vw);
              max-height:min(72vh,640px); display:none; flex-direction:column; background:var(--base);
              box-shadow:var(--sh-out); border-radius:var(--r-lg); overflow:hidden; }
  .petpanel.open { display:flex; animation:pop .22s ease both; }
  .petpanel header { padding:12px 14px; display:flex; align-items:center; gap:8px; box-shadow:var(--sh-in-sm); }
  .petpanel header b { font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .phead { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .phead b, .phead .ppaper { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .phead .ppaper { font-size:11.5px; color:var(--muted); }
  #transPop { position:fixed; z-index:97; display:none; width:min(400px,92vw); padding:14px 16px;
              background:var(--base); box-shadow:var(--sh-out); border-radius:var(--r-md); }
  #transPop.show { display:block; animation:pop .16s ease both; }
  #transPop .tlabel { font-size:11.5px; color:var(--muted); margin-bottom:6px; }
  #transPop .tbody { font-size:13.5px; line-height:1.7; max-height:34vh; overflow:auto; }
  /* Header and composer keep their size; only the log scrolls, and it never collapses under a long quote. */
  .petpanel > header, .pcompose { flex:0 0 auto; }
  .plog { flex:1 1 auto; min-height:140px; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .msg { font-size:13px; line-height:1.62; padding:9px 12px; border-radius:var(--r-md); max-width:90%;
         word-break:break-word; }
  .msg.user { align-self:flex-end; box-shadow:var(--sh-in-sm); }
  .msg.user .qtext { white-space:pre-wrap; }
  .msg.ai { align-self:flex-start; box-shadow:var(--sh-out-sm); }
  .msg.sys { align-self:center; color:var(--muted); font-size:12px; text-align:center; }
  .pcompose { margin:0 12px 12px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:10px;
              background:var(--surface-1); display:flex; flex-direction:column; gap:6px; }
  .pcompose:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .pcompose textarea { border:0; outline:none; resize:none; background:transparent; color:var(--text);
                       font:inherit; font-size:13.5px; line-height:1.5; padding:2px 2px; max-height:132px; overflow-y:auto; }
  .pfoot { display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--muted); }
  .pfoot .pft { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pfoot .switch { font-size:11.5px; gap:6px; white-space:nowrap; }
  .pfoot #petSend { padding:5px 14px; }
  .pfoot #petSend:disabled { opacity:.5; cursor:default; }
  .pfoot #petImg { padding:3px 8px; white-space:nowrap; }
  .pfoot #petImg[aria-pressed="true"] { color:var(--accent); box-shadow:var(--sh-in-sm); border-color:var(--accent); }
  #petRef:empty { display:none; }
  /* A quote is a compact card: two lines, expandable, never taller than a third of the panel. */
  .refcard { display:flex; gap:8px; align-items:flex-start; padding:6px 8px 6px 10px; max-width:100%;
             border-left:3px solid var(--accent) !important; }
  .refcard .rmeta { min-width:0; flex:1; }
  .refcard .rlabel { font-size:10.5px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  html[lang="en"] .ai-label { margin-right:.3em; }   /* "Related:" then the model's text */
  .refcard .rsnip { font-size:12px; line-height:1.5; color:var(--text); opacity:.85; margin-top:2px; cursor:pointer;
                    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .refcard.expanded .rsnip { display:block; -webkit-line-clamp:unset; max-height:30vh; overflow-y:auto; }
  .refcard .rx { border:0; background:none; padding:0 2px; cursor:pointer; color:var(--muted); font-size:13px; line-height:1; flex:0 0 auto; }
  .refcard .rx:hover { color:var(--bad); }
  .msg.user .refcard { margin-bottom:6px; }

  /* ----------------------------------------------------------- selection */
  #selbar { position:fixed; z-index:96; display:none; gap:6px; padding:6px; background:var(--base);
            box-shadow:var(--sh-out); border-radius:999px; }
  #selbar.show { display:flex; animation:pop .16s ease both; }

  .devbanner { max-width:1080px; margin:10px auto 0; padding:9px 14px; border-radius:12px; font-size:12.5px;
               border:1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
               background:color-mix(in srgb, var(--warn) 14%, transparent); }
  .devbanner b { color:var(--warn); }

  #toasts { position:fixed; right:18px; bottom:18px; z-index:95; display:flex; flex-direction:column; gap:10px; }
  .toast { padding:13px 17px; font-size:13px; background:var(--base); box-shadow:var(--sh-out);
           border-radius:var(--r-md); animation:pop .24s ease both; max-width:380px;
           border-left:4px solid var(--accent); }
  .toast.ok { border-left-color:var(--good); } .toast.warn { border-left-color:var(--warn); }
  .toast.err { border-left-color:var(--bad); } .toast.ai { border-left-color:var(--ai); }
  .empty { padding:40px; text-align:center; color:var(--muted); background:var(--base);
           box-shadow:var(--sh-in); border-radius:var(--r-lg); }

  footer { max-width:920px; margin:0 auto 40px; padding:0 16px; color:var(--muted); font-size:11.5px; text-align:center; }

  @keyframes rise { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
  @keyframes pop { from{opacity:0;transform:scale(.97) translateY(6px);} to{opacity:1;transform:none;} }
  @keyframes fade { from{opacity:0;} to{opacity:1;} }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ═══════════════════════════════════════════════════════════════
     VISUAL LAYER — single authoritative override. Tokens → layout → components → motion.
  ═══════════════════════════════════════════════════════════════ */

  /* — base — */
  body { background:var(--base); font-size:calc(15px * var(--s)); line-height:1.58; }

  /* — header — */
  header.top { top:0; max-width:none; margin:0; padding:12px max(24px,calc((100vw - var(--wrap))/2));
    border-radius:0; border:0; border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 var(--line); gap:calc(12px * var(--s));
    background:color-mix(in srgb, var(--surface-1) 92%, transparent);
    backdrop-filter:blur(20px) saturate(160%); }
  .brand { font-size:calc(15.5px * var(--s)); letter-spacing:0; gap:calc(10px * var(--s)); white-space:nowrap; }
  .wordmark { font-family:var(--serif); font-size:calc(19px * var(--s)); font-weight:600; }
  .wordmark em { color:var(--mark); font-style:italic; }
  h1, .card h3, .detail-panel h2, .page h2, #preview h4 { font-family:var(--serif); }
  .brand-mark { width:30px; height:30px; display:block; flex:none; }
  .dot { width:10px; height:10px; box-shadow:0 0 0 4px var(--accent-soft); }
  .tabs { background:transparent; border:0; padding:0; box-shadow:none; gap:calc(2px * var(--s)); }
  .tab { position:relative; padding:calc(6px * var(--s)) calc(13px * var(--s)); border-radius:6px; font-size:calc(13px * var(--s)); color:var(--muted); }
  .tab:hover { color:var(--text); background:var(--surface-2); }
  .tab.active { background:transparent; color:var(--text); box-shadow:none; font-weight:600; }
  .tab.active::after { content:""; position:absolute; left:13px; right:13px; bottom:-1px; height:2px;
    border-radius:2px; background:var(--mark); }

  /* — main layout — */
  main { max-width:var(--wrap); margin:0 auto calc(48px * var(--s)); padding:28px max(28px,calc((100vw - var(--wrap))/2)); }

  /* — hero — */
  .hero { padding:calc(24px * var(--s)) 0 calc(28px * var(--s)); margin-bottom:calc(24px * var(--s)); background:transparent;
    border:0; border-bottom:1px solid var(--line); box-shadow:none; border-radius:0; }
  .hero::after { display:none; }
  .hero h1 { font-size:calc(28px * var(--s)); line-height:1.25; }
  .hero .sub { margin-top:calc(10px * var(--s)); font-size:calc(13.5px * var(--s)); color:var(--muted); }
  .hero .row { margin-top:calc(20px * var(--s)) !important; }

  /* — buttons — */
  button, .btn { background:var(--surface-1); border:1px solid var(--line); box-shadow:none;
    padding:calc(9px * var(--s)) calc(16px * var(--s)); font-size:calc(13.5px * var(--s)); border-radius:8px; }
  button:hover, .btn:hover { border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); transform:translateY(-1px); }
  button:active, .btn:active { transform:scale(.97); }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow:none; }
  button.primary:hover { background:color-mix(in srgb, var(--accent) 86%, var(--surface-1)); box-shadow:var(--sh-1); }
  .saved, .badge.saved { color:var(--mark-text); }
  button.saved { border-color:color-mix(in srgb, var(--mark) 40%, var(--line)); }
  button.ghost { background:transparent; border-color:transparent; box-shadow:none; }
  button.ghost:hover { background:var(--surface-2); border-color:var(--line); }
  button:focus-visible, .btn:focus-visible { outline:2px solid var(--accent-text); outline-offset:3px; }
  /* — cards — */
  .card { padding:calc(20px * var(--s)) calc(22px * var(--s)); border:1px solid var(--line); border-radius:var(--r-lg);
    background:var(--surface-1); box-shadow:none; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .card::before { display:none; }
  .card:hover { transform:translateY(-2px); box-shadow:var(--sh-2); border-color:var(--line-strong); }
  .card:active { transform:none; }
  .card h3 { font-size:calc(16px * var(--s)); line-height:1.38; margin-bottom:calc(8px * var(--s)); }
  .card .actions { padding-top:calc(16px * var(--s)); margin-top:auto; gap:calc(8px * var(--s)); }
  .card .actions button { font-size:calc(12px * var(--s)); padding:calc(7px * var(--s)) calc(12px * var(--s)); }
  /* Two groups (your verdict on the paper, and what to do with it). They share a row while both fit; when the card is
     too narrow each group takes a whole row and its buttons share it equally, so the edges always line up instead of
     the second group being left hanging on the right. The test is the content width, so it holds at every screen size. */
  .card .actions .actions-fb, .card .actions .actions-end { flex:1 1 auto; display:flex; gap:calc(8px * var(--s)); min-width:0; }
  .card .actions .actions-fb button, .card .actions .actions-end button { flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:calc(6px * var(--s)); }
  .card .actions .read-action { color:var(--accent-text); border-color:var(--accent-soft); }
  .card .actions .ai-action { color:var(--ai-text); border-color:color-mix(in srgb, var(--ai) 55%, var(--line)); }
  .card .actions .ai-action:disabled { opacity:.55; cursor:progress; }
  .card .actions .ai-action .icon { width:calc(14px * var(--s)); height:calc(14px * var(--s)); }
  .abs { color:var(--muted); line-height:1.7; opacity:1; -webkit-line-clamp:3; font-size:calc(13px * var(--s)); }
  .badge, .chip { background:var(--surface-2); border:1px solid var(--line); box-shadow:none; font-size:calc(11px * var(--s)); }
  .whyline { border-top:1px solid var(--line); padding-top:calc(12px * var(--s)); margin-top:calc(12px * var(--s)); font-size:calc(12px * var(--s)); }
  .whyline span { background:none; border:0; padding:0; border-radius:0; box-shadow:none; }
  .ai-line { background:none; padding:calc(3px * var(--s)) 0 calc(3px * var(--s)) calc(12px * var(--s)); border:0;
    border-left:2px solid var(--ai); border-radius:0; box-shadow:none; font-size:calc(12.5px * var(--s)); }
  .grid { gap:calc(14px * var(--s)); }
  .paper-topline { display:flex; align-items:center; justify-content:space-between; margin-bottom:calc(14px * var(--s)); gap:calc(12px * var(--s)); }
  .paper-number { font-size:calc(11.5px * var(--s)); color:var(--muted); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:calc(8px * var(--s)); }
  .paper-number .icon { color:var(--accent-text); }
  .paper-title { padding:0; display:block; white-space:normal; text-align:left;
    font:inherit; color:inherit; background:none; border:0; border-radius:0; box-shadow:none; overflow-wrap:anywhere; }
  .paper-title:hover { transform:none; color:var(--accent-text); }


  /* — badges and meta — */
  .meta { font-size:calc(11.5px * var(--s)); margin-bottom:calc(9px * var(--s)); }
  .edition { display:flex; align-items:center; gap:calc(8px * var(--s)); color:var(--muted); font-size:calc(12px * var(--s)); margin-bottom:calc(12px * var(--s)); }
  .edition .live-dot { width:6px; height:6px; background:var(--mark); border-radius:50%; }
  .view-heading { display:flex; align-items:center; justify-content:space-between; gap:calc(20px * var(--s)); margin-bottom:calc(4px * var(--s)); }
  .view-heading .count { font-size:calc(12.5px * var(--s)); color:var(--muted); white-space:nowrap; }
  .label, .brand, .refcard .rlabel, .msg .meta { letter-spacing:0; }

  /* — inputs — */
  input[type=text], input[type=password] { background:var(--surface-1); box-shadow:none;
    border:1px solid var(--line-strong); border-radius:8px; color:var(--text); font:inherit; padding:calc(9px * var(--s)) calc(14px * var(--s)); }
  input[type=text]:focus, input[type=password]:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .switch input { appearance:none; width:30px; height:18px; border-radius:12px; margin:0; position:relative;
    background:var(--line-strong); border:1px solid var(--muted); cursor:pointer; transition:background .18s ease; }
  .switch input::after { content:""; position:absolute; width:12px; height:12px; top:2px; left:2px;
    border-radius:50%; background:var(--surface-1); transition:transform .18s ease; }
  .switch input:checked { background:var(--accent); border-color:var(--accent); }
  .switch input:checked::after { transform:translateX(12px); background:var(--accent-ink); }
  .switch input:focus-visible { outline:2px solid var(--accent-text); outline-offset:3px; }

  /* — page / detail — */
  .page { background:var(--base); }
  .page-inner { max-width:860px; padding:36px 48px; background:transparent; border:0; border-radius:0; box-shadow:none; }

  /* — chat panel — */
  .pet { width:46px; height:46px; background:var(--accent); color:var(--accent-ink); padding:0;
    box-shadow:var(--sh-2); border:0; }
  .pet .icon { width:20px; height:20px; }
  .pet:hover { transform:translateY(-2px) scale(1.04); }
  .petpanel { border:1px solid var(--line); box-shadow:var(--sh-3); background:var(--surface-1); }
  .petpanel header { box-shadow:none; border-bottom:1px solid var(--line); padding:11px 14px; }
  .msg { border:1px solid var(--line); box-shadow:none; }
  .msg.user { background:var(--surface-2); }
  .msg.ai { background:var(--surface-1); }
  .msg.sys { border:none; box-shadow:none; background:transparent; }
  .fol { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .fol button { font-size:12px; padding:5px 11px; background:var(--surface-1); }
  .fol button:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .refcard { border-radius:6px; border:1px solid var(--line); background:var(--surface-2); box-shadow:none; }

  /* — toasts & misc — */
  .toast { border:1px solid var(--line); box-shadow:var(--sh-3); background:var(--surface-1);
    border-left:3px solid var(--accent); }
  .toast.ai { border-left-color:var(--ai); }
  .toast.ok { border-left-color:var(--good); }
  .toast.warn { border-left-color:var(--warn); }
  .toast.err { border-left-color:var(--bad); }
  .empty { background:var(--surface-2); border:1px dashed var(--line-strong); box-shadow:none; }
  .devbanner { max-width:var(--wrap); }
  #preview { background:var(--surface-1); border:1px solid var(--line); box-shadow:var(--sh-3); }
  .reader .rbar { background:var(--surface-1); border-bottom:1px solid var(--line); box-shadow:none; }
  .reader .rside { border-right:1px solid var(--line); box-shadow:none; }
  .reader .pg { box-shadow:var(--sh-2); }
  /* — icon system — */
  .icon { display:inline-block; width:18px; height:18px; flex:0 0 18px; background:currentColor;
    mask:center / contain no-repeat; -webkit-mask:center / contain no-repeat; }
  .icon.book        { mask-image:url("/icons/book-open.svg");          -webkit-mask-image:url("/icons/book-open.svg"); }
  .icon.sparkles    { mask-image:url("/icons/sparkles.svg");           -webkit-mask-image:url("/icons/sparkles.svg"); }
  .icon.library     { mask-image:url("/icons/library.svg");            -webkit-mask-image:url("/icons/library.svg"); }
  .icon.profile     { mask-image:url("/icons/sliders-horizontal.svg"); -webkit-mask-image:url("/icons/sliders-horizontal.svg"); }
  .icon.bookmark    { mask-image:url("/icons/bookmark.svg");           -webkit-mask-image:url("/icons/bookmark.svg"); }
  .icon.mode        { mask-image:url("/icons/sun-moon.svg");           -webkit-mask-image:url("/icons/sun-moon.svg"); }

  @keyframes springUp { 0%{opacity:0;transform:translateY(10px) scale(.988);} 65%{transform:translateY(-1px) scale(1.003);} 100%{opacity:1;transform:none;} }

<script>
const $ = (s) => document.querySelector(s);
const state = { triagingKeys:new Set(), view:'today', cards:[], summaries:{}, profile:null, stats:null, insights:null, triaging:false, version:'?',
                currentProject:null, projects:[], maintained:new Set() };

// ------------------------------------------------------------ appearance
function setMode(m){ document.documentElement.dataset.mode = m; localStorage.setItem('pdh-mode', m);
  window.dispatchEvent(new CustomEvent('pdh-mode', { detail:m })); }
setMode(localStorage.getItem('pdh-mode') || (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
localStorage.removeItem('pdh-accent');   // accent picker retired with the PaperDig palette
$('#modeBtn').onclick = () => setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark');

// ------------------------------------------------------------------ utils
function toast(msg, kind='ok', ms=3600) {
  const el = document.createElement('div'); el.className = `toast ${kind}`; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),250); }, ms);
}
async function api(path, body) {
  const res = await fetch(path, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
function mdInline(t) {
  return t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function md(text) {
  const lines = esc(text || '').split('\n');
  let html = '', inCode = false, list = [];
  const flush = () => { if (list.length) { html += '<ul>' + list.map((x) => `<li>${x}</li>`).join('') + '</ul>'; list = []; } };
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) {
      if (inCode) { html += '</code></pre>'; inCode = false; } else { flush(); html += '<pre><code>'; inCode = true; }
      continue;
    }
    if (inCode) { html += raw + '\n'; continue; }
    const li = raw.match(/^\s*[-*]\s+(.*)$/);
    if (li) { list.push(mdInline(li[1])); continue; }
    flush();
    const h = raw.match(/^#{1,4}\s+(.*)$/);
    if (h) { html += `<h4>${mdInline(h[1])}</h4>`; continue; }
    if (!raw.trim()) continue;
    html += `<p>${mdInline(raw)}</p>`;
  }
  flush();
  if (inCode) html += '</code></pre>';
  return html;
}
const esc = (s) => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderStats() {
  const s = state.stats || {};
  $('#stats').innerHTML = `<span>文献 <b>${s.papers ?? 0}</b></span><span>收藏 <b>${s.saved ?? 0}</b></span>
    <span>正例 <b>${s.positive ?? 0}</b></span><span>负例 <b>${s.negative ?? 0}</b></span><span>太难 <b>${s.too_hard ?? 0}</b></span>`;
  const proj = state.projects?.find(p => p.id === state.currentProject);
  $('#projectName').textContent = proj?.name || '研究工作区';
}

// ------------------------------------------------------------------ cards
function aiSlot(c) {
  if (c.summary) return `<div class="ai-line"><b>AI 速览</b> <span data-no-i18n>${esc(c.summary.one_liner || '')}</span>
    ${c.summary.why_relevant ? `<div class="sub"><span class="ai-label">相关：</span><span data-no-i18n>${esc(c.summary.why_relevant)}</span></div>` : ''}</div>`;
  if (state.triaging || state.triagingKeys.has(c.key)) return `<div class="ai-loading"><span class="spin"></span>AI 正在速览…</div>`;
  return `<div class="ai-off">（尚未速览）</div>`;
}
// The learning map: where the reader stands and why each card was chosen. Plain words, no counts of what was missed.
function renderRoute(route) {
  const panel = $('#routePanel');
  if (!panel) return;
  const link = state.currentProject ? `/route.html?project_id=${encodeURIComponent(state.currentProject)}` : '/route.html';
  const seg = (on) => `<div class="seg" role="radiogroup" aria-label="推荐方式"><button type="button" role="radio" aria-checked="${on}" data-route-mode="route">按学习图推荐</button><button type="button" role="radio" aria-checked="${!on}" data-route-mode="off">普通排序</button></div>`;
  if (!route) {
    panel.hidden = !state.currentProject;
    panel.innerHTML = state.currentProject ? `<div class="route-head"><div class="route-title"><strong>学习图</strong><span class="sub">这个项目还没有学习图</span></div><a class="btn" href="${link}">搭一张学习图</a></div>
      <div class="sub">学习图把你想学的内容拆成概念，并画出“读懂 A 才能读 B”；推荐会先从你现在能读的概念里选论文。可以自己搭，也可以让 AI 起草。</div>` : '';
    return;
  }
  panel.hidden = false;
  if (route.enabled === false) {
    panel.innerHTML = `<div class="route-head"><div class="route-title"><strong>学习图</strong><span class="sub">路径模式已关闭</span></div>${seg(false)}</div>
      <div class="route-foot"><span class="sub">现在推荐按普通排序。打开后，推荐会先从你现在能读的概念里选论文。</span><a class="btn" href="${link}">查看学习图</a></div>`;
    return;
  }
  const share = Math.round((route.exploration_share || 0) * 100);
  const pct = route.total ? Math.round(100 * (route.done || 0) / route.total) : 0;
  const names = (route.frontier || []).map((f) => `<span class="kw"><span class="kw-v" data-no-i18n>${esc(f.name)}</span></span>`).join('');
  panel.innerHTML = `<div class="route-head"><div class="route-title"><strong>学习图</strong><span class="sub">路径模式</span></div>${seg(true)}</div>
    <div class="route-meter"><div class="route-bar" role="img" aria-label="已读懂 ${route.done} / ${route.total} 个概念"><i style="width:${pct}%"></i></div><span>已读懂 ${route.done} / ${route.total} 个概念 · 探索约占 ${share}%</span></div>
    <div class="route-now">${names ? `<span class="sub">现在在读：</span>${names}` : '<span class="sub">所有概念都已读懂，推荐回到普通排序。</span>'}</div>
    <div class="route-foot"><span class="sub">开启后推荐先从你现在能读的概念里选论文，各条分支各走各的，互不等待。</span><a class="btn" href="${link}">查看和调整学习图</a></div>`;
}
$('#routePanel').addEventListener('click', async (event) => {
  const choice = event.target.closest('[data-route-mode]');
  if (!choice || choice.getAttribute('aria-checked') === 'true' || !state.currentProject) return;
  const buttons = [...document.querySelectorAll('#routePanel [data-route-mode]')]; buttons.forEach((b) => { b.disabled = true; });
  try {
    await api('/api/route', { action: 'mode', project_id: state.currentProject, mode: choice.dataset.routeMode });
    await load();
  } catch (e) { toast(`没能切换推荐方式：${e.message}`, 'err'); buttons.forEach((b) => { b.disabled = false; }); }
});
const ROUTE_KINDS = { route: '路径', remedial: '补基础', explore: '探索' };
const ROUTE_TITLES = {
  route: '状态：来自学习图。它属于你现在能读的概念。',
  remedial: '状态：来自学习图。你把相关论文标为“太难”，所以先补一篇基础。',
  explore: '状态：来自学习图。这篇是探索位，不在你现在能读的概念里。',
};
function routeBadge(c) {
  if (!c.route) return '';
  const kind = ROUTE_KINDS[c.route.kind];
  if (!kind) return '';
  return `<span class="kw kw-${esc(c.route.kind)}" title="${esc(ROUTE_TITLES[c.route.kind])}"><span class="kw-k">${kind}</span>${c.route.name ? `<span class="kw-v" data-no-i18n>${esc(c.route.name)}</span>` : ''}</span>`;
}

const PDF_BADGES = {
  direct: ['直链 PDF', '已知合法的 PDF 下载链接（arXiv 或开放获取）'],
  page: ['仅原文页', '这篇论文是开放获取的，但只给了原文网页，没有 PDF 直链'],
  none: ['无 PDF 来源', '没有找到合法的 PDF 来源；可以自己下载后附加'],
};
const pdfBadge = (status) => {
  const [text, tip] = PDF_BADGES[status] || PDF_BADGES.none;
  return `<span class="pdf-tag pdf-${PDF_BADGES[status] ? status : 'none'}" title="${tip}"><i class="icon book" aria-hidden="true"></i>${text}</span>`;
};

function cardHTML(c, i) {
  const saved = c.saved || c.feedback === 'useful';
  return `
  <article class="card" data-key="${esc(c.key)}" style="animation-delay:${i*50}ms">
    <div class="paper-topline"><span class="paper-number"><i class="icon book" aria-hidden="true"></i>${String(i + 1).padStart(2,'0')}</span>
      ${c.summary ? '<span class="st st-done"><i class="icon sparkles" aria-hidden="true"></i>AI 已速览</span>' : '<span class="st st-pending">待速览</span>'}</div>
    <h3><button class="paper-title" data-no-i18n>${esc(c.title)}</button></h3>
    <div class="meta">
      <span>${esc(c.published || '')}</span><span>${esc(c.source || '')}</span>
      ${pdfBadge(c.pdf_status)}
      ${saved ? '<span class="st st-saved"><i class="icon bookmark" aria-hidden="true"></i>已收藏</span>' : ''}
    </div>
    ${routeBadge(c) ? `<div class="kws">${routeBadge(c)}</div>` : ''}
    <div class="abs">${c.abstract ? `<span data-no-i18n>${esc(c.abstract)}</span>` : '（无摘要）'}</div>
    <div class="ai-slot">${aiSlot(c)}</div>
    <div class="whyline"><span>推荐理由：${esc(c.why)}</span></div>
    <div class="actions">
      <span class="actions-fb">
        <button class="tiny ${saved ? 'saved' : ''}" data-fb="${saved ? 'unsave' : 'useful'}" data-key="${esc(c.key)}">
          <i class="icon bookmark" aria-hidden="true"></i>${saved ? '已收藏' : '收藏'}</button>
        <button class="tiny" data-fb="irrelevant" data-key="${esc(c.key)}">不感兴趣</button>
        <button class="tiny" data-fb="too_hard" data-key="${esc(c.key)}">太难</button>
      </span>
      <span class="actions-end">

// ------------------------------------------------------------------ load
async function load() {
  const projectAtStart = state.currentProject;
  const params = state.currentProject ? `?project_id=${encodeURIComponent(state.currentProject)}` : '';
  const data = await api(`/api/home${params}`);
  if (state.currentProject !== projectAtStart) return;
  state.version = data.server_version || '?';
  state.usage = data.usage || null;
  state.devMode = Boolean(data.dev_mode);
  state.provider = data.provider || null;
  const aiReady = Boolean(state.provider && state.provider.configured);
  const autoAi = $('#autoAi');
  if (autoAi) {
    autoAi.title = aiReady ? 'AI 速览已就绪' : '尚未配置模型 API；点击右上角设置填入密钥';
    $('#autoAiHint').textContent = aiReady ? '' : '（未配置 API）';
  }
  const banner = document.getElementById('devbanner');
  banner.style.display = state.devMode ? 'block' : 'none';
  if (state.devMode) {
    banner.innerHTML = '<b>测试模式</b> · 独立账本与宽松额度，不消耗也不改动正式预算。' +
      (state.usage ? ` 今日测试用量 ${state.usage.tokens.toLocaleString()} / ${state.usage.ceiling.toLocaleString()} token。` : '');
  }
  state.stats = data.stats; state.profile = data.profile; state.summaries = data.summaries || {};
  try {
    const insights = await api(`/api/profile/insights${params}`);
    if (state.currentProject !== projectAtStart) return;
    state.insights = insights;
  } catch (e) {
    state.insights = { error: true };
    console.warn('Failed to load profile insights', e);
  }
  state.cards = (data.cards || []).map(c => ({ ...c, summary: c.summary || state.summaries[c.key] }));
  state.maintenance = data.maintenance; state.route = data.route; renderStats(); renderCards(); renderProfile(); renderMaintenance(data.maintenance); renderRoute(data.route);
  const u = state.usage;
  $('#foot').replaceChildren(`本地运行 · 数据在 .local/app · 服务端版本 ${state.version}`,   // two phrases, two pack entries
    u ? ` · 今日 ${u.tokens.toLocaleString()} / ${u.ceiling.toLocaleString()} token${u.dev ? '（测试额度）' : ''}` : '');
}
// Opening-time upkeep: the server refreshes the candidate pool and builds today's batch when they are due.
// It never starts an AI summary, never counts what was missed, and a failure leaves the page as it was.
function renderMaintenance(m) {
  const note = $('#maintainNote');
  if (!note || !m) return;
  const frequency = { daily: '每天', weekly: '每周', manual: '手动' }[m.frequency] || '每天';
  const parts = [`更新频率：${frequency}`];
  if (m.last_refresh) parts.push(`上次刷新 ${new Date(m.last_refresh).toLocaleString()}`);
  if (m.last_error) parts.push(`上次刷新失败：${m.last_error}（已有内容不受影响）`);
  note.textContent = parts.join(' · ');
}
async function autoMaintain() {
  const key = state.currentProject || 'default';
  if (state.maintained.has(key)) return;   // once per project per page session; the server enforces the interval
  state.maintained.add(key);
  try {
    const r = await api('/api/maintain', state.currentProject ? { project_id: state.currentProject } : {});
    if (!r.due) {   // a job started by another window may have finished after this page loaded
      if (r.status && r.status.last_refresh !== (state.maintenance || {}).last_refresh) await load();
      return;
    }
    $('#maintainNote').textContent = '正在更新候选论文…';
    let job;
    for (let i = 0; i < 120; i++) { job = await api(`/api/jobs/${r.job.id}`); if (job.state !== 'running') break; await new Promise(x => setTimeout(x, 1000)); }
    if (job.state === 'failed') toast(`自动更新失败：${job.error}`, 'warn');
    await load();
  } catch (e) { renderMaintenance(state.maintenance); }
}
async function refreshStats() {   // the counts in the top bar follow a save made while the library page is open
  const params = state.currentProject ? `?project_id=${state.currentProject}` : '';
  const data = await api(`/api/library${params}`);
  state.stats = data.stats; renderStats();
}

// ------------------------------------------------------------- generation
function aiFailure(reason) {
  const detail = reason || '未知';
  if (/no API key|no provider/i.test(detail))
    return `AI 未配置（${detail}）。点击右上角设置填入 API 密钥即可；在此之前保持本地模式。`;
  return `AI 不可用（${detail}），保持本地模式。`;
}
async function generate() {
  const b = $('#btnDaily'); b.disabled = true; b.textContent = '生成中…';
  try {
    const body = { limit: 5 };
    if (state.currentProject) body.project_id = state.currentProject;
    const r = await api('/api/daily', body);
    if (!r.cards || !r.cards.length) { toast(r.reason || '没有新候选，先抓取', 'warn'); return; }
    state.cards = r.cards.map(c => ({ ...c, summary: null }));
    renderCards();
    toast(`已生成 ${r.cards.length} 篇`, 'ok');
    if ($('#autoAi').checked) await autoTriage();
  } catch (e) { toast(`生成失败：${e.message}`, 'err'); }
  finally { b.disabled = false; b.textContent = '生成今日 5 篇'; }
}
async function autoTriage() {
  if (state.triaging) return;
  state.triaging = true; renderCards();
  try {
    const body = { dry_run: false };
    if (state.currentProject) body.project_id = state.currentProject;
    const r = await api('/api/triage', body);
    if (!r.ok) toast(aiFailure(r.reason), 'warn', 6000);
    else toast(`AI 已速览 ${r.items.length} 条 · ${r.usage.total_tokens} token · $${r.usd}`, 'ai');
    await load();
  } catch (e) { toast(`AI 速览失败：${e.message}`, 'err'); }
  finally { state.triaging = false; renderCards(); }
}
// One paper, one explicit click, one call: only this card's title and abstract are sent.
async function triageOne(key) {
  if (state.triaging || state.triagingKeys.has(key)) return;
  state.triagingKeys.add(key); renderCards();
  try {
    const body = { dry_run: false, keys: [key] };
    if (state.currentProject) body.project_id = state.currentProject;
    const r = await api('/api/triage', body);
    if (!r.ok) toast(aiFailure(r.reason), 'warn', 6000);
    else toast(`AI 已速览 · ${r.usage.total_tokens} token · $${r.usd}`, 'ai');
    await load();
  } catch (e) { toast(`AI 速览失败：${e.message}`, 'err'); }
  finally { state.triagingKeys.delete(key); renderCards(); }
}

// --------------------------------------------------------------- feedback
async function doFeedback(key, action) {
  if (action === 'unsave') {
    const body = { key };
    if (state.currentProject) body.project_id = state.currentProject;
    await api('/api/unsave', body);
    toast('已取消收藏', 'warn');
  } else {
    const body = { key, action };
    if (state.currentProject) body.project_id = state.currentProject;
    const r = await api('/api/feedback', body);
    const said = { irrelevant: '不感兴趣', too_hard: '太难', understood: '已读懂' }[action] || action;   // "已读懂" is recorded from the library, on a saved paper
    toast(r.saved ? '已收藏到论文库（卡片保留）'
          : action === 'understood' ? '已记录：已读懂（只推进学习进度，不改变兴趣）'
          : (r.interest_changed ? `已记录：${said}` : `已记录：${said}（不影响兴趣）`),
          r.saved || r.interest_changed || action === 'understood' ? 'ok' : 'warn');
  }
  const card = state.cards.find(c => c.key === key);
  if (card) {
    if (action === 'unsave') { card.saved = false; card.feedback = null; }
    else if (action === 'useful') card.saved = true;
    if (action === 'understood' || action === 'too_hard') card.familiarity = action;   // a familiarity label never replaces the interest one
  }
  renderCards();
  if (state.view === 'library') await refreshStats();
}

  const card = e.target.closest('.card[data-key]');
  if (card) openDetail(card.dataset.key);
});

// hover preview
let hoverTimer = null, hideTimer = null, hoverKey = null;
function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(hidePreview, 240); }
function cancelHide() { clearTimeout(hideTimer); }
$('#cards').addEventListener('mouseover', (e) => {
  const card = e.target.closest('.card[data-key]'); if (!card) return;
  cancelHide();
  if (card.dataset.key === hoverKey) return;
  hoverKey = card.dataset.key; clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => showPreview(card), 500);
});
$('#cards').addEventListener('mouseout', (e) => {
  const card = e.target.closest('.card[data-key]'); if (!card) return;
  if (e.relatedTarget && card.contains(e.relatedTarget)) return;
  clearTimeout(hoverTimer); scheduleHide();
});
// Keep the preview open while the pointer is inside it so the abstract can be scrolled.
$('#preview').addEventListener('mouseenter', cancelHide);
$('#preview').addEventListener('mouseleave', scheduleHide);
function showPreview(card) {
  const c = state.cards.find(x => x.key === card.dataset.key); if (!c) return;
  const p = $('#preview');
  p.innerHTML = `<h4 data-no-i18n>${esc(c.title)}</h4><div class="pabs">${c.abstract ? `<span data-no-i18n>${esc(c.abstract)}</span>` : '（无摘要）'}</div>
    <div class="phint">点击卡片打开详情页（含 PDF 预览）</div>`;
  p.style.left = '0px'; p.style.top = '0px';
  p.classList.add('show');
  const r = card.getBoundingClientRect();
  const w = p.offsetWidth, h = p.offsetHeight;
  let left = Math.min(r.right + 16, window.innerWidth - w - 16); if (left < 12) left = 12;
  let top = Math.min(Math.max(12, r.top), Math.max(12, window.innerHeight - h - 16));
  p.style.left = `${left}px`; p.style.top = `${top}px`;
}
function hidePreview() {
  $('#preview').classList.remove('show');
  $('#preview').style.left = '0px';   // park it out of the way while hidden
  $('#preview').style.top = '0px';
  hoverKey = null;
}
