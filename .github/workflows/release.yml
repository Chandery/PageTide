# Windows x64 build of PaperDigHelper (Tauri 2 shell + PyInstaller one-dir backend) and release upload.
# The macOS arm64 .app is built locally by the maintainer (docs/RELEASE.md) and attached by hand.
# Builds are unsigned: no secrets are used anywhere in this workflow.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["windows-release"]   # TEMPORARY: CI for the port branch; removed before merging to main

# One run per ref; a newer push to the same ref waits instead of cancelling a release build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"   # Chinese text in files/stdout must not depend on the Windows ANSI code page

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Third-party actions below are pinned to major-version tags, not full commit SHAs
      # (SHAs cannot be looked up offline). Pinning them to SHAs is a recorded follow-up.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 3.11, not the 3.9.6 of the local macOS build env: 3.9 is end-of-life and the runner image
      # no longer guarantees it; networkx 3.2.1 and PyInstaller 6.16.0 both support 3.11.
      # The code base stays 3.9-compatible, so the macOS and Windows backends differ only by interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt

      # scripts/run_tests.py == unittest discover, plus (Windows only) a gc.collect and tolerant
      # TemporaryDirectory cleanup: Windows cannot delete a directory that still holds an open SQLite file.
      - name: Python unit tests
        run: python scripts/run_tests.py

      - name: Node tests
        shell: bash
        run: node --test tests/*.cjs

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Chosen over tauri-apps/tauri-action: no third-party action in the build path, and the CLI
      # version matches the one used locally (2.11.4). Costs several minutes of compile time per run.
      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build the Python backend (PyInstaller)
        run: python scripts/build_desktop.py

      - name: Packaged backend smoke test
        run: python scripts/verify_packaged_route.py src-tauri/resources/paperdighelper-server/paperdighelper-server.exe

      # `-- --locked` is passed to cargo: the build must use the committed Cargo.lock.
      - name: Build the NSIS installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis -- --locked

      # LF line endings, ASCII, no BOM: `shasum -a 256 -c` on macOS must accept the file.
      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$($exe.FullName).sha256", "$hash  $($exe.Name)`n", (New-Object System.Text.ASCIIEncoding))

      - uses: actions/upload-artifact@v4
        with:
          name: PaperDigHelper-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error

  publish:
    # Only a tag push publishes; workflow_dispatch and the temporary branch trigger stop at the artifact.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test-windows, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the only job that writes to the repository (release upload)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag must match the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$TAG" != "v$conf" ] || [ "$TAG" != "v$cargo" ]; then
            echo "Tag $TAG must equal v<version> in both src-tauri/tauri.conf.json ($conf) and src-tauri/Cargo.toml ($cargo)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: PaperDigHelper-windows-x64
          path: dist

      - name: Upload to the release for this tag (draft if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.exe dist/*.exe.sha256 --clobber
