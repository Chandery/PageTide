# Windows x64 and macOS (Apple silicon arm64, Intel x64) builds of PageTide (Tauri 2 shell + PyInstaller
# one-dir backend) and release upload. Each macOS architecture is built on a native runner: PyInstaller only
# builds for the interpreter's own architecture, so there is no universal app.
# Builds are unsigned: no secrets are used anywhere in this workflow.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# One run per ref; a newer push to the same ref waits instead of cancelling a release build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"   # Chinese text in files/stdout must not depend on the Windows ANSI code page

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Third-party actions below are pinned to major-version tags, not full commit SHAs
      # (SHAs cannot be looked up offline). Pinning them to SHAs is a recorded follow-up.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 3.11, not the 3.9.6 of the local macOS build env: 3.9 is end-of-life and the runner image
      # no longer guarantees it; networkx 3.2.1 and PyInstaller 6.16.0 both support 3.11.
      # The code base stays 3.9-compatible, so the macOS and Windows backends differ only by interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt

      # scripts/run_tests.py == unittest discover, plus (Windows only) a gc.collect and tolerant
      # TemporaryDirectory cleanup: Windows cannot delete a directory that still holds an open SQLite file.
      - name: Python unit tests
        run: python scripts/run_tests.py

      - name: Node tests
        shell: bash
        run: node --test tests/*.cjs

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # The official prebuilt CLI from npm (seconds) instead of compiling tauri-cli with cargo install
      # (several minutes per job). Same version as package-lock.json; installed on its own from the public
      # registry (the lock file's resolved URLs point at a mirror) and kept out of the repository's node_modules.
      - name: Install tauri-cli
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-save --no-audit --no-fund \
            --registry=https://registry.npmjs.org @tauri-apps/cli@2.11.4
          echo "$RUNNER_TEMP/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" --version

      - name: Build the Python backend (PyInstaller)
        run: python scripts/build_desktop.py

      - name: Packaged backend smoke test
        run: python scripts/verify_packaged_route.py src-tauri/resources/pagetide-server/pagetide-server.exe

      # The Windows store lacks some public roots (arXiv's Starfield G2) until Windows itself fetches them.
      - name: Packaged backend carries certifi's roots
        shell: bash
        run: find src-tauri/resources/pagetide-server -path "*certifi/cacert.pem" | grep -q . || { echo "certifi/cacert.pem missing" >&2; exit 1; }

      # `-- --locked` is passed to cargo: the build must use the committed Cargo.lock.
      - name: Build the NSIS installer
        working-directory: src-tauri
        env:
          PAGETIDE_RELEASE: "1"   # a release build: everyday data directory and self-update (src-tauri/src/main.rs)
        run: tauri build --bundles nsis -- --locked

      # LF line endings, ASCII, no BOM: `shasum -a 256 -c` on macOS must accept the file.
      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$($exe.FullName).sha256", "$hash  $($exe.Name)`n", (New-Object System.Text.ASCIIEncoding))

      - uses: actions/upload-artifact@v4
        with:
          name: PageTide-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error

  test-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Python unit tests
        run: python scripts/run_tests.py

      - name: Node tests
        run: node --test tests/*.cjs

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple silicon
            arch: arm64
          - runner: macos-15-intel    # Intel; GitHub's last x86_64 macOS image (retired about August 2027)
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # The official prebuilt CLI from npm (seconds) instead of compiling tauri-cli with cargo install
      # (several minutes per job). Same version as package-lock.json; installed on its own from the public
      # registry (the lock file's resolved URLs point at a mirror) and kept out of the repository's node_modules.
      - name: Install tauri-cli
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-save --no-audit --no-fund \
            --registry=https://registry.npmjs.org @tauri-apps/cli@2.11.4
          echo "$RUNNER_TEMP/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" --version

      # The runner's interpreter, not the local .local/desktop-build-env.
      - name: Build the Python backend (PyInstaller)
        env:
          PAGETIDE_BUILD_PYTHON: python
        run: python scripts/build_desktop.py

      - name: Packaged backend smoke test
        run: python scripts/verify_packaged_route.py src-tauri/resources/pagetide-server/pagetide-server

      - name: Build the app bundle
        working-directory: src-tauri
        env:
          PAGETIDE_RELEASE: "1"   # a release build: everyday data directory and self-update (src-tauri/src/main.rs)
        run: tauri build --bundles app -- --locked

      # The shell and the backend must both be this job's architecture, and the bundle version the app version
      # (the in-app updater refuses a bundle whose CFBundleShortVersionString differs from the tag).
      - name: Check architecture and version
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app=src-tauri/target/release/bundle/macos/PageTide.app
          want=$([ "$ARCH" = arm64 ] && echo arm64 || echo x86_64)
          for bin in "$app/Contents/MacOS/PageTide" "$app/Contents/Resources/backend/pagetide-server"; do
            got=$(lipo -archs "$bin")
            [ "$got" = "$want" ] || { echo "$bin is $got, expected $want" >&2; exit 1; }
          done
          # python.org's Python has no root certificates of its own: without certifi's bundle every HTTPS call fails.
          find "$app/Contents/Resources/backend" -path "*certifi/cacert.pem" | grep -q . \
            || { echo "certifi/cacert.pem missing from the packaged backend" >&2; exit 1; }
          plist=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          conf=$(python -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "$plist" = "$conf" ] || { echo "bundle version $plist != $conf" >&2; exit 1; }

      - name: Zip and checksum
        working-directory: src-tauri/target/release/bundle/macos
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ditto -c -k --keepParent PageTide.app "PageTide-macos-$ARCH.zip"
          shasum -a 256 "PageTide-macos-$ARCH.zip" > "PageTide-macos-$ARCH.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: PageTide-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/macos/PageTide-macos-${{ matrix.arch }}.zip
            src-tauri/target/release/bundle/macos/PageTide-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  publish:
    # Only a tag push publishes; workflow_dispatch and the temporary branch trigger stop at the artifact.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test-windows, build-windows, test-macos, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the only job that writes to the repository (release upload)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag must match the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$TAG" != "v$conf" ] || [ "$TAG" != "v$cargo" ]; then
            echo "Tag $TAG must equal v<version> in both src-tauri/tauri.conf.json ($conf) and src-tauri/Cargo.toml ($cargo)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: PageTide-*
          path: dist
          merge-multiple: true

      - name: All three platforms are present
        run: |
          for f in dist/PageTide_*_x64-setup.exe dist/PageTide-macos-arm64.zip dist/PageTide-macos-x64.zip; do
            [ -f "$f" ] && [ -f "$f.sha256" ] || { echo "missing $f or its checksum" >&2; exit 1; }
          done

      - name: Upload to the release for this tag (draft if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.exe dist/*.exe.sha256 dist/*.zip dist/*.zip.sha256 --clobber
