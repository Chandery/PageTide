<!doctype html><meta charset="utf-8"><title>PaperDig · sea lion</title>
<style>
body{margin:0;padding:24px;background:#F7F3EC;font:13px -apple-system,"PingFang SC";color:#1C2230}
.row{display:flex;gap:24px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}.cap{text-align:center;margin-top:6px;color:#8a8479;font-size:12px}
svg{display:block}
</style>
<div class="row" id="big"></div>
<div class="row" id="mid"></div>
<div class="row" id="small"></div>
<div class="row" id="lk"></div>
<script>
const INK="#1C2230", PAPER="#EFE8DC", RED="#D9462B", RED_DK="#A8331D", PINK="#EE8E7C";
// Construction (facing right): body circle B and head circle H joined by outer tangents make the
// tapering neck; H and snout circle S make the raised muzzle; the baseline cuts B flat.
const G = {
  B:[470,690,180], H:[578,345,94], S:[700,276,50], BASE:840, RB:520, RF:300,
  FL:[622,840,175,105], TAIL:[318,840,120,62], GAP:16, K:0.93, CX:560, CY:455, FLIP:'M588 606C604 730 692 818 812 840H572C556 760 562 680 588 606Z',
  EYE:[596,320,20],
  PAGE:{x:690,y:62,w:124,h:164,rot:12,ear:50}
};
const f=n=>n.toFixed(1);
function tangents([x1,y1,r1],[x2,y2,r2]){const th=Math.atan2(y2-y1,x2-x1),a=Math.acos((r1-r2)/Math.hypot(x2-x1,y2-y1));
  return [-1,1].map(s=>[[x1+r1*Math.cos(th+s*a),y1+r1*Math.sin(th+s*a)],[x2+r2*Math.cos(th+s*a),y2+r2*Math.sin(th+s*a)]]);}
function hull(A,C){const [[u1,u2],[l1,l2]]=tangents(A,C);
  return `M${f(u1[0])} ${f(u1[1])}L${f(u2[0])} ${f(u2[1])}A${C[2]} ${C[2]} 0 0 1 ${f(l2[0])} ${f(l2[1])}L${f(l1[0])} ${f(l1[1])}A${A[2]} ${A[2]} 0 1 1 ${f(u1[0])} ${f(u1[1])}Z`;}
function fillet(A,C,r,side){ // circle of radius r externally tangent to A and C; side=+1 left of A->C, -1 right
  const [ax,ay,ra]=A,[cx,cy,rc]=C, R1=ra+r, R2=rc+r, d=Math.hypot(cx-ax,cy-ay);
  const a=(R1*R1-R2*R2+d*d)/(2*d), h=Math.sqrt(R1*R1-a*a), ux=(cx-ax)/d, uy=(cy-ay)/d;
  return [ax+a*ux+side*h*uy, ay+a*uy-side*h*ux, r];}
const touch=(A,F)=>{const k=A[2]/(A[2]+F[2]);return [A[0]+(F[0]-A[0])*k, A[1]+(F[1]-A[1])*k];};
function arc([ox,oy,r],P,Q,M){const T=2*Math.PI, ang=p=>Math.atan2(p[1]-oy,p[0]-ox), m=x=>((x%T)+T)%T;
  const a1=ang(P), d2=m(ang(Q)-a1), dm=m(ang(M)-a1), sw=dm<d2?1:0, lg=(sw?d2:T-d2)>Math.PI?1:0;
  return `A${r} ${r} 0 ${lg} ${sw} ${f(Q[0])} ${f(Q[1])}`;}
function torso(){const {B,H}=G, Fb=fillet(B,H,G.RB,1), Ff=fillet(B,H,G.RF,-1);
  const bB=touch(B,Fb), bH=touch(H,Fb), fH=touch(H,Ff), fB=touch(B,Ff);
  const away=(O,X)=>{const d=Math.hypot(O[0]-X[0],O[1]-X[1]);return [O[0]+(O[0]-X[0])/d*O[2], O[1]+(O[1]-X[1])/d*O[2]];};
  const near=(F,P,Q)=>{const mx=(P[0]+Q[0])/2-F[0], my=(P[1]+Q[1])/2-F[1], d=Math.hypot(mx,my);return [F[0]+mx/d*F[2],F[1]+my/d*F[2]];};
  G._F=[Fb,Ff];
  return `M${f(bB[0])} ${f(bB[1])}${arc(Fb,bB,bH,near(Fb,bB,bH))}${arc(H,bH,fH,away(H,B))}${arc(Ff,fH,fB,near(Ff,fH,fB))}${arc(B,fB,bB,away(B,H))}Z`;}
function flipper(){const [cx,cy,rx,ry]=G.FL;return `M${cx} ${cy}V${cy-ry}A${rx} ${ry} 0 0 1 ${cx+rx} ${cy}Z`;}
function tail(){const [cx,cy,rx,ry]=G.TAIL;return `M${cx} ${cy}V${cy-ry}A${rx} ${ry} 0 0 0 ${cx-rx} ${cy}Z`;}
function page(fill=RED, ear=RED_DK, lineC=PAPER){const {x,y,w,h,rot,ear:e}=G.PAGE;
  const ln=G.LINES?[0.50,0.68].map((t,i)=>`<rect x="${x+22}" y="${y+h*t}" width="${w-44-(i?26:0)}" height="14" rx="7" fill="${lineC}"/>`).join(""):"";
  return `<g transform="rotate(${rot} ${x} ${y+h})"><path d="M${x} ${y}H${x+w-e}L${x+w} ${y+e}V${y+h}H${x}Z" fill="${fill}"/><path d="M${x+w-e} ${y}V${y+e}H${x+w}Z" fill="${ear}"/>${ln}</g>`;}
// Alternative "paper" props. Figure coordinates; snout top ~ (700,226), nose points up-right.
const WHITE="#FFF9F0";
function book(w,h,c,pg,edge){ // closed book seen from the fore-edge: cover wraps spine (left), pages inside
  return `<rect x="${-w/2}" y="${-h}" width="${w}" height="${h}" rx="${h*0.22}" fill="${c}"/>
  <rect x="${-w/2+h*0.34}" y="${-h+h*0.2}" width="${w-h*0.34-h*0.1}" height="${h*0.6}" rx="${h*0.08}" fill="${pg}"/>
  ${edge?`<rect x="${-w/2+h*0.34}" y="${-h/2-3}" width="${w-h*0.34-h*0.1}" height="6" fill="${edge}"/>`:""}`;}
function spiral(cx,cy,R,turns){let d="";const N=120,a=R/(turns*2*Math.PI);
  for(let i=0;i<=N;i++){const t=0.9+i/N*(turns*2*Math.PI-0.9),r=a*t;d+=(i?"L":"M")+f(cx+r*Math.cos(t))+" "+f(cy+r*Math.sin(t));}
  return d;}
const PROPS = {
  page: (bg,body_c,mono)=> mono?page(body_c,bg,bg):page(),
  bookmark: (bg,body_c,mono)=>`<path d="M702 -40H786V196L744 164L702 196Z" fill="${mono?body_c:RED}"/>`,
  hat: (bg,body_c,mono)=>`<g transform="translate(530 262) rotate(-27) translate(0 14)">
    <path d="M-78 0L0 -128L78 0Z" fill="${mono?body_c:RED}" stroke="${bg}" stroke-width="14" stroke-linejoin="round"/>
    <rect x="-92" y="-30" width="184" height="36" rx="6" fill="${mono?body_c:RED_DK}" stroke="${bg}" stroke-width="14"/>
    <path d="M-30 -62L10 -92" stroke="${mono?bg:PAPER}" stroke-width="10" stroke-linecap="round" opacity="${mono?1:.7}"/></g>`,
  book: (bg,body_c,mono)=>`<g transform="translate(704 228) rotate(-9)">${book(200,62,mono?body_c:RED,mono?bg:WHITE,mono?null:"#E6DCCB")}</g>`,
  stack: (bg,body_c,mono)=>`<g transform="translate(706 230) rotate(-8)">${book(212,68,mono?body_c:RED,mono?bg:WHITE)}
    <g transform="translate(-10 -76) rotate(5)">${book(176,60,mono?body_c:RED_DK,mono?bg:WHITE)}</g></g>`,
  scroll: (bg,body_c,mono)=>`<circle cx="712" cy="160" r="66" fill="${mono?body_c:RED}"/>
    <path d="${spiral(712,160,50,2.6)}" fill="none" stroke="${mono?bg:PAPER}" stroke-width="10" stroke-linecap="round"/>`,
  ball: (bg,body_c,mono)=>`<circle cx="712" cy="160" r="66" fill="${mono?body_c:RED}"/>
    <path d="M660 122 A66 66 0 0 1 772 136" fill="none" stroke="${mono?bg:PAPER}" stroke-width="14" stroke-linecap="round"/>`
};
function seal({bg=PAPER, body_c=INK, id="a", guides=false, tailOn=true, bust=false, lines=true, blush=true, mono=false, prop="bookmark", gap=G.GAP, eyeR=G.EYE[2]}={}){
  G.LINES=lines;
  const k=bust?1.12:G.K, ty=bust?560:528, tf=`translate(512 ${ty}) scale(${k}) translate(${-G.CX} ${-G.CY})`;
  const g = guides ? `<g fill="none" stroke="${RED}" stroke-width="3">${[G.B,G.H,G.S,G.EYE,...(G._F||[])].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join("")}<line x1="100" y1="${G.BASE}" x2="924" y2="${G.BASE}" stroke-dasharray="10 10"/></g>` : "";
  return `<svg viewBox="0 0 1024 1024" width="SIZE" height="SIZE"><defs><clipPath id="${id}"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath><clipPath id="${id}b"><rect x="0" y="0" width="1024" height="${bust?2000:G.BASE}"/></clipPath></defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="${bg}"/>
  <g clip-path="url(#${id})"><g transform="${tf}">
   <g fill="${body_c}" clip-path="url(#${id}b)"><path d="${torso()}"/><path d="${hull(G.H,G.S)}"/></g>
   ${bust?"":`<path d="${G.FLIP}" fill="${body_c}" stroke="${bg}" stroke-width="${gap}" stroke-linejoin="round"/>`}
   ${tailOn&&!bust?`<path d="${tail()}" fill="${body_c}"/>`:""}
   <circle cx="${G.EYE[0]}" cy="${G.EYE[1]}" r="${eyeR}" fill="${bg}"/>${blush&&!mono?`<ellipse cx="${G.EYE[0]+18}" cy="${G.EYE[1]+50}" rx="26" ry="16" fill="${PINK}"/>`:""}
   ${PROPS[prop](bg,body_c,mono)}
  ${g}</g></g></svg>`;}
const s=(v,n)=>v.replaceAll("SIZE",n), cell=(v,c)=>`<div>${v}<div class="cap">${c}</div></div>`;
const W=`<div style="font:600 64px 'New York','Iowan Old Style',Georgia,serif;letter-spacing:-1px">Paper<i style="color:${RED}">Dig</i></div>`;
const lock=(bg,fg,id)=>`<div style="display:flex;align-items:center;gap:26px;background:${bg};color:${fg};padding:36px 48px;border-radius:24px">${s(seal({id,tailOn:false}),150)}<div>${W.replace("color:"+RED,"color:"+RED)}<div style="font:italic 22px Georgia,serif;opacity:.8;margin-top:6px">Dig less, read more.</div><div style="font:18px 'PingFang SC';opacity:.65;margin-top:6px;letter-spacing:2px">不必翻遍，只管读好。</div></div></div>`;
// Final sheet: chosen bookmark icon, size ladder (<=32 px uses the SMALL master), dark, mono, lockup.
const SMALL={blush:false, gap:30, eyeR:26};
document.body.innerHTML=`<div style="display:flex;flex-direction:column;gap:28px;align-items:flex-start">`+
 `<div style="display:flex;gap:28px;align-items:flex-end">${s(seal({id:"f",tailOn:false}),320)}`+
 [128,64].map((n,k)=>s(seal({id:"m"+k,tailOn:false}),n)).join("")+
 [32,16].map((n,k)=>s(seal({id:"sm"+k,tailOn:false,...SMALL}),n)).join("")+`</div>`+
 `<div style="display:flex;gap:18px">${s(seal({id:"d",tailOn:false,bg:INK,body_c:PAPER}),160)}${s(seal({id:"o",tailOn:false,mono:true,bg:"#FFFFFF"}),160)}</div>`+
 lock("#F7F3EC",INK,"l1")+`</div>`;
</script>
