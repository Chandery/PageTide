<text x="464" y="74" font-size="50" font-weight="500" fill="#f0f6fc" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">25<tspan dx="5" font-size="22" fill="#9198a1" letter-spacing="0">MB</tspan></text>
<text x="464" y="108" font-size="14" fill="#9198a1">download on Apple Silicon</text>
