<svg xmlns="http://www.w3.org/2000/svg" width="880" height="156" viewBox="0 0 880 156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" role="img" aria-label="PageTide by the numbers">
<rect x="0" y="0" width="880" height="1" fill="#3d444d"/>
<rect x="0" y="155" width="880" height="1" fill="#3d444d"/>
<text x="24" y="74" font-size="50" font-weight="500" fill="#f0f6fc" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">0</text>
<text x="24" y="108" font-size="14" fill="#9198a1">model tokens to rank papers</text>
<text x="24" y="129" font-size="14" fill="#9198a1">and learn your profile</text>
<rect x="220" y="1" width="1" height="154" fill="#2a3038"/>
<text x="244" y="74" font-size="50" font-weight="500" fill="#f0f6fc" letter-spacing="-1.6" style="font-variant-numeric:tabular-nums">0</text>
<text x="244" y="108" font-size="14" fill="#9198a1">accounts, servers</text>
<text x="244" y="129" font-size="14" fill="#9198a1">or telemetry</text>
